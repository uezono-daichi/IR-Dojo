[project]
name = "irdojo"
version = "0.1.0"
description = "IR Dojo — インシデント対応 判断演習エンジン"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
irdojo = "irdojo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["irdojo"]
artifacts = ["web/**", "scenarios/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
