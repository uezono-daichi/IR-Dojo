schema_version: "0.4"

meta:
  id: insider-exfil-suspicion-01
  title: "最終出社まで十日"
  version: "1.0.0"
  author: "IR Dojo"
  license: "CC-BY-4.0"
  estimated_play_minutes: 10
  language: ja
  # 既定は立証可能性最優先。この盤面の中心は「止めるのを遅らせることが
  # 正解になりうる」で、それが最も強く出るのがこの方針である（SPEC 5.3）
  default_policy: provability
  default_assist_level: assisted
  briefing: |
    9/16 09:20、持ち出し検知の仕組みから警告が1件。
    部門の共有領域で、直近8日のうち2晩に、業務アカウント
    u317@example.com が 2,148 件の資料を参照している。

    このアカウントの利用者は 9/30 付で退職が決まっており、最終出社は 9/26。
    転職先は同業だと本人が申告している。

    人事と法務からは、先に2つ言われている。
      「本人に伝わった時点から先のことは、こちらでは押さえられません」
      「疑いの段階で就業を一方的に止めることは、こちらが持ちません」

    あなたは情報セキュリティ担当として対応にあたる。
    現時点の一次情報は、この警告1件だけである。
  tags: [insider, data-exfiltration, provability, misleading-evidence]

world:
  assets:
    # 依存の根。ここを締めると部門全体が止まる（SPEC 7.6.7 の構成図の根）
    - id: dirsvc
      label: "社内ディレクトリ"
      aliases: ["dir.example.com"]
      criticality: critical
      depends_on: []
      business_impact_per_hour: 85

    # 読まれた側。**乗っ取られてはいない。** 権限は正規のまま、
    # 見える範囲がそのまま読まれた（SPEC 8.6 の「どちらにも書けない」状態）
    - id: share-sales
      label: "共有ストレージ 営業企画領域"
      aliases: ["営業企画領域", "fs-sales"]
      criticality: high
      depends_on: [dirsvc]
      business_impact_per_hour: 48

    - id: ws-317
      label: "退職予定者の業務端末"
      criticality: medium
      depends_on: [dirsvc]
      # 端末を1台止める代価は、盤面の物語で決める（SPEC 5.2）。
      # ここには引き継ぎ中の案件がそのまま載っているので、止めれば
      # 後任への受け渡しが止まる。一律に小さく置くと、誤導に乗って
      # 無関係な端末を止めた代価が方針適合層に一度も現れない
      business_impact_per_hour: 30

    - id: ws-224
      label: "営業企画部の同僚端末"
      criticality: medium
      depends_on: [dirsvc]
      business_impact_per_hour: 26

    - id: acct-317
      label: "退職予定者の業務アカウント"
      # 記録の中では利用者名がそのまま呼び名になる。
      # ブリーフィングが名指ししている唯一の資産でもある
      aliases: ["u317@example.com", "u317"]
      criticality: low
      depends_on: [dirsvc]
      business_impact_per_hour: 5

    - id: phone-317
      label: "社給携帯"
      aliases: ["PHN-317"]
      criticality: low
      depends_on: [dirsvc]
      business_impact_per_hour: 4

    # 会社の管理下に無い資産。止めることも、取り除くことも、
    # 相手（事業者と本人）の手続きを通してしか届かない
    - id: store-personal
      label: "私物の外部保管"
      aliases: ["外部保管サービス", "stor.example.net"]
      criticality: low
      depends_on: []
      business_impact_per_hour: 2

  ground_truth:
    patient_zero: ws-317
    compromised: [ws-317, acct-317, store-personal]
    persistence: [ws-317, store-personal]
    innocent: [ws-224, phone-317]
    attack_narrative: |
      9/8 22:07 と 9/12 21:28 の2晩、営業企画部の担当者が自席の業務端末 WS-317 から、
      共有ストレージの営業企画領域にある価格表・見積・取引先一覧を一括で取得した。
      権限は正規のもので、破られたものは何も無い。見えていた範囲が、そのまま読まれた。

      持ち出しは社内回線を通っていない。端末の内蔵回線（携帯網）へ手動で切り替え、
      ブラウザから私物の外部保管 stor.example.net へ直接アップロードしている。
      境界のプロキシには、この 2晩ぶんの送信が1バイトも載らない。

      端末には、その外部保管の同期クライアントと、保存されたままの資格情報が残っている。
      外部保管の側には、上がった 2,1xx オブジェクトと、社外へ配れる共有リンクが1本生きている。
      止めただけでは、どちらも元に戻らない。

      同僚端末 WS-224 の 9/9 の一括取得は、部門の作業依頼 WO-2026-0412 によるものである。
      期末の提案雛形を各自の端末へ落とす手順が配られており、部門12名が同じ動きをしている。
      取得先は雛形の置き場だけで、価格表にも取引先一覧にも触れていない。

      社給携帯 PHN-317 の 5月の通信量は、全社に配られた写真移行ツールの一括転送による。
      展開は 5/11〜5/22、最終利用も 5/22 で、以後の月間は 2〜4 GB に戻っている。

      本人が持ち出しを知られたと分かった時点で、外部保管の中身は消え、
      端末は「返却前の初期化」という正規の手続きで消える。どちらも誰も咎められない。
      この盤面で失われるものは、すべて正規の手続きと善意によって失われる。

policies:
  # ── この盤面の中心。**止めるのを遅らせることが正解になりうる。**
  # 1本目・2本目では「証拠保全最優先」が周知を歓迎する側だった。
  # ここでは逆で、全社への周知は本人に届く。周知を禁じるのは
  # 就業関係の方針のほうで、この方針は周知を歓迎する側に残る —
  # つまり**同じ型の手が、盤面をまたいで向きを変えている**（SPEC 5.6.1）
  - id: provability
    label: "立証可能性最優先"
    briefing: |
      法的手続きと対外的な説明に耐える形で事実を確定することを最優先とする。
      業務影響および封じ込めの速さは二次的な考慮事項とする。

      止める資産ごとに、その資産の状態を先に保全すること。
      別の資産で保全できていることは、この要件を満たさない。

      本人への接触は、こちらの手が届く範囲の外に記録を追い出す。
      聴取は、押さえるものを押さえ終えてからでなければ行わないこと。

      元の状態へ戻す作業は、戻す前の状態を控えてから行うこと。
    weights:
      evidence_preserved:       0.45
      containment_completeness: 0.30
      total_damage:             0.20
      business_impact:          0.05
    constraints:
      # `require_before` ではなく `require_capture_of_target`（SPEC 5.3 / v1.40）。
      # 前者は盤面のどこか1つで満たせるので、端末を保全しただけで
      # 私物の外部保管を止めてよくなる ＝ この方針が事実上無料になる
      - type: require_capture_of_target
        action_type: contain
        prerequisite_tags: [forensic_capture]
        message: "止める資産の状態を、止める前に保全していません"
      # **この盤面の題材そのもの。** 聴取は 30分の調査アクションだが、
      # この方針の下では「押してはいけない手」になる。
      # 就業関係への配慮の下では、逆に押さないことが説明できなくなる
      - type: forbid_action
        action_ids: [act_interview_subject]
        message: "押さえる前の接触は、こちらの手が届く範囲の外に記録を追い出します"
      - type: forbid_action
        action_ids: [act_purge_and_suspend]
        message: "初期化と停止の要請は、証明に要る状態をまとめて消します"
      # **控えを取らずに戻す手も、この方針では取れない。** これが無いと
      # 立証可能性と就業関係が同じ組に着地し、3方針あっても盤面が
      # 答えられるのは2通りになる（SPEC 5.3 / 8.3 の「複製された方針」）
      - type: forbid_action
        action_ids: [act_remove_in_place]
        message: "戻す前の状態を控えていません。外した後の状態は残りません"

  - id: rapid_containment
    label: "早期封じ込め最優先"
    briefing: |
      渡る量をこれ以上増やさないことを最優先とする。
      証拠保全および業務影響は二次的な考慮事項とする。

      止めるべきものは、根拠が固まる前でも止めてよい。
      立会いや控えを待つ形の措置は取らないこと。待っている間も渡り続ける。
      通り道を塞ぐだけで凌がず、手元に残っている状態ごと落とすこと。
      資格情報を入れ替えても、いま開いている画面と保存された鍵は落ちない。
      止めるならサインインごと止めること。
    weights:
      total_damage:             0.50
      containment_completeness: 0.30
      business_impact:          0.10
      evidence_preserved:       0.10
    constraints:
      # 立会いを取り付けるまでの 45分も、控えを取る 60分も、渡り続ける時間である。
      # 就業関係にとって最良の手と、立証可能性にとって最良の手が、
      # どちらもこの方針では違反になる（SPEC 5.6 / 3つの締め方に3つの方針）
      - type: forbid_action
        action_ids: [act_remove_in_place]
        message: "立会いを待つ間も渡り続けます。この方針では待たずに落とすこと"
      - type: forbid_action
        action_ids: [act_preserve_then_remove]
        message: "控えを取る間も渡り続けます。この方針では書き出しを待たずに落とすこと"
      # 入れ替えでは、いま開いている画面と端末に保存された鍵はそのまま生きる。
      # 就業関係への配慮にとって最良の手（本人が仕事を続けられる締め方）が、
      # この方針では違反になる
      - type: forbid_action
        action_ids: [act_reset_acct_317]
        message: "入れ替えでは、いま開いている画面と保存された鍵は落ちません"

  - id: employment_care
    label: "就業関係への配慮最優先"
    briefing: |
      対象者はまだ疑いの段階であり、就業の継続を一方的に断つことは避ける。
      業務が止まる形の措置は最終手段とし、部門の仕事を止めないこと。

      本人の業務を止める措置（サインインの停止、貸与品の取り上げ）は取らないこと。
      部門全体に調査を知らせる形の連絡も取らないこと。特定の個人が読み取れる。

      対象者の機器・アカウントと、依存の根にあたる仕組みを止める場合は、
      それを示す材料を手元に持っていること。
    weights:
      business_impact:          0.40
      containment_completeness: 0.25
      total_damage:             0.20
      evidence_preserved:       0.15
    constraints:
      - type: forbid_containment_without_evidence
        assets: [dirsvc, ws-317, store-personal]
        message: "材料なしに止めることは、疑いだけで不利益を与えることになります"
      # **1本目の「業務継続最優先が周知を禁じる」と同じ位置にある制約だが、
      # 理由が違う。** 業務が止まるからではなく、部門全体への連絡が
      # 特定の個人を事実上名指しするからである（SPEC 5.6.1 の費用の付け方）
      - type: forbid_action
        action_ids: [act_preservation_notice]
        message: "部門全体への保全の連絡は、疑われている個人を事実上名指しします"
      - type: forbid_action
        action_ids: [act_seize_ws317]
        message: "貸与品の取り上げは、疑いの段階で就業を断つことと同じです"
      - type: forbid_action
        action_ids: [act_disable_acct_317]
        message: "サインインの停止は、疑いの段階で就業を断つことと同じです"

evidence:
  - id: ev_001
    points_to: [acct-317]
    misleading: false
    plausibility: high
    volatile: false
    occurred_at: "2026-09-12 21:04"
    summary: "9/8 と 9/12 の夜に、u317@example.com が価格表と取引先一覧を合わせて 2,148 件参照している"
    reading: |
      持ち出し検知の明細は「検知時刻 / 対象 / 規則 / 内訳」の順に並ぶ。

      検知時刻は、規則に合致したと判定された時刻である。日次のバッチで
      遡って検知する構成では、事象そのものの時刻は内訳の側にしか出ない。

      規則 R-014 は、一定時間内の参照件数と、参照先に付いた機微区分の
      2つが同時に条件を満たしたときに発報する。件数だけでも、区分だけでも
      発報しない。しきい値は部門ごとに違う。

      共有ストレージの監査が記録するのは「誰が何を開いたか」までである。
      開いた後にその中身がどこへ行ったかは、別の帳簿の話になる。
    possibilities:
      - |-
        退職を前に、引き継ぎの資料を手元へまとめた。参照先の区分で分かれる
      - |-
        部門で配られた手順に沿って、全員が同じ動きをした。他の人にも同じ形が出るかで分かれる
      - |-
        見えている範囲を、社外へ渡す目的で一度に取った。取った後の動きで分かれる
    content: |
      # 持ち出し検知 (DLP) アラート明細   ALERT-2026-0916-003

        検知時刻   : 2026-09-16T09:18:40Z   (日次バッチによる遡及検知)
        対象利用者 : u317@example.com
        対象領域   : \\fs-sales\sales-plan
        規則       : R-014「短時間の大量参照（機微区分を含む）」

        内訳
          2026-09-08 22:07 - 22:41   1,204 件   /sales-plan/pricing/
          2026-09-12 21:04 - 21:53     944 件   /sales-plan/accounts/
          合計 2,148 件 / 3.9 GB

        同一規則の直近90日の発報 : 7 件（うち同一部門 4 件）

        集計対象 : 共有ストレージの監査イベントのうち、規則に合致した参照
        非対象   : 参照の後に何が行われたか、端末の内側で起きたこと

  - id: ev_002
    points_to: [acct-317]
    misleading: false
    plausibility: high
    volatile: false
    summary: "参照先は価格表と取引先一覧に偏っていて、雛形の置き場には一度も入っていない"
    reading: |
      共有ストレージの監査集計は、アカウント別の件数と、操作の種別で並ぶ。

        FileAccessed   開いた・読み出した
        FileModified   書き換えた
        FileDeleted    消した

      更新が 0 件の大量参照は、読み出しだけが行われたことを表す。
      持ち出しでも、正規の資料収集でも、同じ形で記録される。

      フォルダに付いた機微区分は、置かれている資料の扱いの重さを表す。
      区分 2 は、社外へ出すときに承認が要るものを指す。

      集計は期間全体の合計で、1件ごとの時刻は明細を引き直さないと出ない。
    possibilities:
      - |-
        引き継ぎの範囲が、たまたま重い区分に寄っていた。依頼の記録と突き合わせて分かれる
      - |-
        部門の手順が指している置き場と、参照先がずれている。手順の側を見れば分かれる
      - |-
        社外へ出して価値のあるものだけを選んで取った。取った後の動きで分かれる
    content: |
      # 共有ストレージ 監査イベント集計 (2026-09-01 - 2026-09-16)
      # 対象領域: \\fs-sales\sales-plan

        アカウント別 上位
          u317@example.com   2,148 件   Accessed 2,148 / Modified 0 / Deleted 0
          u224@example.com   1,902 件   Accessed 1,902 / Modified 0 / Deleted 0
          u108@example.com     311 件
          その他 9 名        1,657 件

        u317@example.com の内訳（フォルダ別）
          /sales-plan/pricing/     1,204 件   価格表・原価表     機微区分 2
          /sales-plan/accounts/      944 件   取引先一覧・与信   機微区分 2
          /sales-plan/templates/       0 件   提案雛形           機微区分 0

        集計対象 : 共有ストレージが記録した参照・更新・削除のイベント
        非対象   : 参照した端末の識別、参照した後の複製先

  - id: ev_003
    points_to: []
    clears: [store-personal]
    misleading: true
    plausibility: high
    volatile: false
    summary: "私物の外部保管 stor.example.net への送信は、期間を通して 8.4 MB しかない"
    reading: |
      宛先別の集計は「送信バイト / 受信バイト / 要求数」で並ぶ。

      送信が大きい通信と受信が大きい通信では用途が違う。前者は外へ置く形、
      後者は外から取る形になる。要求数だけでは向きが決まらない。

      分類の欄は、この製品が宛先に付けている業種の札である。
      札が付いていることと、その宛先が使われたかどうかは別の話になる。

      収集範囲の欄は、この集計がどの経路の通信を数えたかを表す。
      境界のプロキシは、そこを通った要求しか数えられない。
    possibilities:
      - |-
        この宛先へは何も出ていない。端末の側に残る跡を見れば分かれる
      - |-
        出てはいるが、ここを通らない道から出たので数に載っていない
      - |-
        出てはいるが、集計の例外に入っていて宛先の行から落ちている
    content: |
      # 境界プロキシ 宛先別 送信量集計 (2026-09-01 - 2026-09-16)
      # 対象: 営業企画部に貸与された端末 12 台

        宛先                  送信        受信       要求数
        sync.example.com      365 GB      12 GB      1,840,112
        mail.example.com       88 GB      41 GB        402,551
        crm.example.org        12 GB      77 GB        118,904
        stor.example.net      8.4 MB     210 MB          1,377   分類: オンライン保管
        news.example.org      1.1 MB     3.4 GB         44,209

        stor.example.net の内訳
          送信の最大 1 件 : 1.2 MB      送信を伴う要求 : 41

        収集範囲 : 社内の有線・無線から境界プロキシを経由した要求
        非対象   : 端末の内蔵回線（携帯網）から直接出た通信、社外での利用、
                   プロキシの例外一覧に載っている宛先
    refuted_by: [ev_004]

  - id: ev_004
    points_to: [store-personal]
    misleading: false
    plausibility: high
    volatile: false
    occurred_at: "2026-09-12 21:44"
    summary: "外部保管サービスの側には 2,131 件・14.6 GB が上がっていて、社外へ配れる共有リンクが1本生きている"
    reading: |
      事業者からの開示は「契約者の識別 / 操作の記録 / 発信元」で構成される。

      操作の記録の Upload は、その時刻に受け付けが完了した件数を表す。
      受け付け側の時計なので、送り出した端末の時計とは数秒ずれる。

      発信元の欄に並ぶアドレスは、要求がどの回線から届いたかを表す。
      割り当て事業者の欄が「移動体通信」であれば、携帯の回線から届いている。

      共有リンクの状態が active のものは、その URL を知っていれば
      契約者以外でも開ける。開かれた回数は別の帳簿になる。
    possibilities:
      - |-
        契約者が自分の資料を自分のために置いた。置かれたものの中身で分かれる
      - |-
        会社の資料が、会社の外へ渡せる形で置かれた。配れる口があるかで分かれる
      - |-
        置いたのは別の人で、契約者の口を借りただけ。届いた回線の側で分かれる
    content: |
      # 保全・開示要請 IR-0916-02 / stor.example.net 事業者回答
      # 区分: 外部保管サービス（個人契約）

        契約者識別 : 当社ドメインの個人用アドレスではなく、一般の受信箱
        保全適用   : 2026-09-16T14:02Z （以後、契約者側からの削除は保留される）

        Upload 記録（直近30日）
          2026-09-08T22:15:31Z - 22:49:02Z    1,188 件    6.2 GB
