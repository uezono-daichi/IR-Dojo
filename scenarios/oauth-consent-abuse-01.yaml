schema_version: "0.4"

meta:
  id: oauth-consent-abuse-01
  title: "取引先からの一本の電話"
  version: "1.0.0"
  author: "IR Dojo"
  license: "CC-BY-4.0"
  estimated_play_minutes: 10
  language: ja
  default_policy: business_continuity
  default_assist_level: assisted
  briefing: |
    6/18 10:40、取引先2社から相次いで連絡。
    「営業部の森さんから、見慣れない共有リンクの付いたメールが届いた。
      本文が短くて不自然なので、念のため確認したい」

    差出人は詐称ではなく、社内から出た本物の送信である。
    あなたは情報セキュリティ担当として対応にあたる。

    自社は クラウド基盤 1テナントで ID・メール・ファイル共有をまとめて
    運用している中規模の会社で、外部の連携アプリを業務でも使っている。
    現時点の一次情報は「取引先2社が同じ苦情を寄せている」だけである。
  tags: [saas, identity, consent-phishing, misleading-evidence]

world:
  assets:
    - id: tenant
      label: "ID基盤テナント"
      criticality: critical
      depends_on: []
      business_impact_per_hour: 90

    - id: mailbox
      label: "クラウドメール"
      criticality: high
      depends_on: [tenant]
      business_impact_per_hour: 60

    - id: filehub
      label: "共有ファイル領域"
      criticality: high
      depends_on: [tenant]
      business_impact_per_hour: 55

    - id: acct-admin
      label: "テナント管理者アカウント (岸)"
      criticality: medium
      depends_on: [tenant]
      business_impact_per_hour: 12

    - id: acct-mori
      label: "営業部アカウント (森)"
      criticality: low
      depends_on: [tenant]
      business_impact_per_hour: 4

    # 依存が木にならない資産。テナント・メール・ファイル共有の3つに
    # またがるので、構成図は DAG になる（SPEC 7.6.7）
    - id: app-scan
      label: "契約書点検サービス"
      criticality: low
      depends_on: [tenant, mailbox, filehub]
      business_impact_per_hour: 3

    - id: app-relay
      label: "差出人整理アシスタント"
      criticality: low
      depends_on: [tenant, mailbox]
      business_impact_per_hour: 2

    - id: app-board
      label: "会議室予約コネクタ"
      criticality: low
      depends_on: [tenant]
      business_impact_per_hour: 2

  ground_truth:
    patient_zero: acct-mori
    compromised: [acct-mori, mailbox, app-relay]
    persistence: [mailbox, app-relay]
    innocent: [acct-admin, app-scan, app-board]
    attack_narrative: |
      5/17（32日前）10:02、営業部の森宛に「共有された文書の閲覧」を装うメールが届いた。
      リンクの先はクラウド基盤の本物の同意画面で、そこに並んでいたのは
      攻撃者が3日前に登録した「差出人整理アシスタント」というアプリだった。
      森は 10:04 に「承諾」を押している。パスワードは一度も入力していないし、
      多要素認証も破られていない。攻撃者が手に入れたのは資格情報ではなく、
      森の代理としてメールとファイルを読む「委任された立場」である。

      以後32日間、攻撃者はこのアプリのトークンでメールとファイル共有を読み続けた。
      同時に森の受信箱へ規則を1件追加し、「請求」「口座」を含む受信を既読にして
      RSS フィード フォルダへ移すようにしてある。森からは何も見えていない。

      6/18 10:12、攻撃者は同じアプリの権限で、森の名前のまま取引先30社へ
      共有リンク付きのメールを送った。これが露見の契機になった。

      契約書点検サービスは、2年前に法務部が申請し承認された正規の連携である。
      テナント全体のファイルとメールを読める広い権限を持っているが、
      それは審査を通ったうえで与えられたものである。
      会議室予約コネクタの呼び出しが 10:05 前後に集中しているのは、
      始業時刻に予約の同期が走る設定によるものである。
      テナント管理者アカウントに並んでいる外部からのサインインの記録は、
      条件付きアクセスがすべて手前で止めている試行である。

      共有ファイル領域そのものは乗っ取られていない。読まれたのは
      森に見えている範囲であり、それはアプリに委ねられた権限の広さで決まる。

policies:
  - id: business_continuity
    label: "業務継続最優先"
    briefing: |
      経営判断により、業務の停止は最終手段とする。
      封じ込めは業務影響を最小化する形で実施すること。
      証拠保全は可能な範囲で行えばよい。

      基幹の仕組み（ID基盤テナント / クラウドメール / 共有ファイル領域）を
      止める場合は、それが侵害されている根拠を示せる状態であること。
    weights:
      business_impact:          0.40
      total_damage:             0.25
      containment_completeness: 0.20
      evidence_preserved:       0.15
    constraints:
      - type: forbid_containment_without_evidence
        assets: [tenant, mailbox, filehub]
        message: "証拠なしに基幹の仕組みを止めることは方針違反です"
      # 全社に「消すな・移すな」と流し、対象期間に保全ホールドを掛けることは、
      # 日々の運用を止めることと同じである。記録は残るが、その日の仕事は滞る。
      # この方針の下では取れない手（SPEC 5.6.1）
      - type: forbid_action
        action_ids: [act_preservation_notice]
        message: "全社への保全の周知と保持の固定は、日々の運用を止めます"

  - id: evidence_preservation
    label: "証拠保全最優先"
    briefing: |
      法的対応と対外報告の可能性があり、証拠保全を最優先とする。

      このテナントでは、記録は待っていると消える。
      保全ホールドとエクスポートを封じ込めに先行させること。
      封じ込めによって失われる状態がある場合、先に書き出してから実施すること。
    weights:
      evidence_preserved:       0.45
      containment_completeness: 0.25
      total_damage:             0.20
      business_impact:          0.10
    constraints:
      - type: require_before
        action_type: contain
        prerequisite_tags: [preservation_hold]
        message: "封じ込め前に保全ホールドとエクスポートが必要です"

  - id: damage_minimization
    label: "被害最小化最優先"
    briefing: |
      被害拡大の阻止を最優先とする。
      業務影響および証拠保全は二次的な考慮事項とする。

      止めるべきものは、根拠が固まる前でも止めてよい。
      利用者ごとに手で戻して回るのではなく、テナントの側で確実に断つこと。
    weights:
      total_damage:             0.50
      containment_completeness: 0.30
      business_impact:          0.10
      evidence_preserved:       0.10
    constraints:
      # 利用者を1人ずつ回って同意を取り消す手は、名簿から漏れた1人を取りこぼす。
      # 業務継続にとっては最良の手が、この方針では違反になる。
      # これが無いと3つの締め方は「業務を止めない順」で決まり、
      # 対応フェーズの取捨選択が方針に依存しなくなる（SPEC 原則4）
      - type: forbid_action
        action_ids: [act_revoke_per_user]
        message: "利用者ごとに回る取り消しは取りこぼしうる。この方針ではテナントの側で断つこと"
      # 控えを取っている間も、読まれ続ける時間は進んでいる。
      # 証拠保全にとっては最良の手が、この方針では違反になる。
      # 3つの締め方に、3つの方針がそれぞれ別に着地する形はここで閉じる
      # （残る1つ＝テナントの側で登録ごと断つ手だけが、この方針で許される）
      - type: forbid_action
        action_ids: [act_hold_then_revoke]
        message: "控えを取っている間も読まれ続ける。この方針では書き出しを待たずに断つこと"

evidence:
  - id: ev_001
    points_to: [acct-mori]
    misleading: false
    plausibility: high
    volatile: false
    summary: "森のアカウントから、社外30宛先へ共有リンク付きのメールが一斉に送られている"
    reading: |
      メッセージ追跡ログの1行は「時刻 / 差出人 / 宛先 / 件名 / 経路 / 結果」で並ぶ。

      ClientApp の欄は、その送信がどの経路で投げられたかを表す。
        Browser        利用者がブラウザの画面から送った
        MobileApp      利用者が携帯の専用アプリから送った
        RESTAPI        アプリケーションが API 経由で送った
      RESTAPI の場合、AppId の欄に呼び出し元のアプリ識別子が入る。

      Auth の欄は送信時の認証方式で、Delegated は「利用者の代理として」、
      AppOnly は「アプリ自身として」を表す。前者は利用者の権限で動く。

      短時間に同一本文が多数の宛先へ出る形は、一斉送信の設定でも
      自動化された送信でも同じように記録される。件数と間隔だけでは
      どちらかを決められない。
    content: |
      # クラウドメール メッセージ追跡 (2026-06-18 09:00 - 11:00)

      2026-06-18T10:12:04Z  mori@example.com -> torihiki-a@example.org
        Subject   : 共有されたファイルのご確認
        ClientApp : RESTAPI
        AppId     : 7f3c-relay
        Auth      : Delegated (mori@example.com)
        Status    : Delivered
      2026-06-18T10:12:04Z  mori@example.com -> torihiki-b@example.org   (同一本文)
      2026-06-18T10:12:05Z  mori@example.com -> torihiki-c@example.org   (同一本文)
      ...
        同一 Subject の外部宛て送信 : 30 件 (10:12:04 - 10:12:31)
        本文中の URL              : https://files.example.net/s/9d1a  (全件同一)

      同時間帯の mori@example.com の他の送信:
        ClientApp=Browser  4 件   ClientApp=MobileApp 1 件

      集計対象 : 追跡ログに残る送受信（社内外を問わない）
      非対象   : 送信の本文そのもの、下書きのまま送られなかったもの

  - id: ev_002
    points_to: []
    misleading: false
    plausibility: medium
    volatile: false
    summary: "森のサインインは拠点の回線と登録済み端末からのものだけで、外部からの成功は認められない"
    reading: |
      サインイン ログの読み方。
        ResultCode 0       成功
        ResultCode 50126   利用者名またはパスワードが違う
        ResultCode 50074   多要素認証の要求が満たされていない
        DeviceCompliant    端末管理に登録され、要件を満たしているか
        RiskLevel          サインインごとに付く危険度の推定値

      このテナントのサインイン ログの保持は既定の 30日で、
      31日目以降は日次のジョブで古い日から順に落ちていく。
      照会できるのは、その時点で残っている範囲だけになる。

      なお、委任された立場で動くアプリの API 呼び出しは、
      利用者のサインインとしては記録されない。別の帳簿に載る。
    content: |
      # サインイン ログ (mori@example.com / 保持範囲の全期間)

        期間            : 2026-05-19 - 2026-06-18   (30日保持の残存分)
        総件数          : 412
        ResultCode 0    : 409
        ResultCode 50074:   2   (2026-06-02 09:11, 2026-06-09 08:57)
        ResultCode 50126:   1   (2026-06-05 08:44)

        送信元 IP       : 203.0.113.24/29 のみ  (本社回線)
        DeviceId        : 3 台。いずれも DeviceCompliant=true
        RiskLevel       : none 410 / low 2 / medium 0 / high 0

      照会対象 : サインインの成否と条件付きアクセスの評価結果
      非対象   : 委任された立場で動くアプリからの API 呼び出し、
                 保持期間 (30日) を過ぎて落ちた日の分

  - id: ev_003
    points_to: [acct-mori]
    misleading: false
    plausibility: high
    volatile: false
    summary: "5/17 10:04 に、森が外部のアプリへ委任同意を与えている"
    reading: |
      監査ログの Consent to application は、利用者が同意画面で「承諾」を
      押したときに1件記録される。読みどころは3つある。

        ConsentType    Principal は「その利用者ぶんだけ」、
                       AllPrincipals は「テナント全員ぶん」を表す
        Scope          委ねた権限の一覧。Mail.Read は受信箱の読み取り、
                       Files.Read.All は利用者から見えるファイルの読み取り、
                       Mail.Send は利用者の名前での送信、
                       offline_access は利用者が画面にいなくても
                       アプリが動き続けられる更新トークンの発行を指す
        IPAddress      同意画面を操作した端末の送信元

      統合監査ログの保持は既定 90日で、サインイン ログ (30日) より長い。
      同じ出来事でも、どの帳簿に載るかで残っている期間が違う。
    content: |
      # 統合監査ログ / Consent to application

      2026-05-17T10:04:38Z
        Operation      : Consent to application
        InitiatedBy    : mori@example.com
        IPAddress      : 203.0.113.26
        ConsentType    : Principal
        Scope          : Mail.Read Mail.Send Files.Read.All offline_access User.Read
        AppDisplayName : 差出人整理アシスタント
        AppId          : 7f3c-relay

      同一利用者の直前の操作:
      2026-05-17T10:03:51Z  UserLoggedIn        mori@example.com  203.0.113.26
      2026-05-17T10:02:10Z  MailItemsAccessed   (Browser)         203.0.113.26

      照会対象 : 統合監査ログに載る操作 (保持 90日)
      非対象   : 同意画面に至るまでにたどったリンクの経路

  - id: ev_004
    points_to: [app-relay]
    misleading: false
    plausibility: high
    volatile: true
    summary: "そのアプリには 12名ぶんの同意が生きており、更新トークンが今も使われている"
    reading: |
      委任同意の一覧は、いま有効な「代理の許可証」を並べたものである。
      台帳ではなく現在の状態なので、取り消すと行そのものが消える。
      取り消した後で「どんな範囲を渡していたか」を数え直すことはできない。

        Grants        その利用者ぶんの委任同意
        Scope         委ねた権限
        RefreshTokens 発行済みの更新トークン。1本ごとに、利用者が
                      画面にいなくてもアプリが動き続けられる
        LastUsed      その利用者ぶんの許可証が最後に使われた時刻

      LastUsed が現在時刻に近いということは、その許可証が今も
      生きて使われているということを表す。
    content: |
      # 委任同意の一覧 (現在の状態 / AppId=7f3c-relay)

        Grants        : 12 principals
        ConsentType   : Principal (AllPrincipals なし)
        Scope         : Mail.Read Mail.Send Files.Read.All offline_access User.Read
        RefreshTokens : 12 本 (失効なし)

        principal            granted              LastUsed
        mori@example.com     2026-05-17T10:04Z    2026-06-18T10:31Z
        sekiya@example.com   2026-05-21T14:22Z    2026-06-18T09:48Z
        ...                  (計 12 名)
        最古の granted       : 2026-05-17T10:04Z
        最新の granted       : 2026-06-16T11:07Z

      取得範囲 : 現在有効な委任同意と、それに紐づく更新トークンの本数
      非対象   : 既に取り消された同意、アプリ自身の権限 (AppOnly) の分

  - id: ev_005
    points_to: [app-relay]
    misleading: false
    plausibility: high
    volatile: false
    summary: "そのアプリは同意の3日前に登録され、発行元の検証がなく、応答先が社外である"
    reading: |
      アプリ登録の内容は、テナントに登録された連携アプリの素性である。

        PublisherVerified   発行元が事業者として検証されているか
        VerifiedPublisherId 検証済みの発行元に割り当てられる識別子
        CreatedDateTime     テナントに登録された日時
        SignInAudience      どのテナントの利用者が同意できるか
        ReplyUrls           同意後に利用者を送り返す先
        RequiredResourceAccess  同意画面に並べる権限の要求一覧

      ReplyUrls は同意の完了時に認可コードを受け取る場所なので、
      ここに書かれたホストが、その連携の実体が動いている場所になる。

      社内の申請を経て導入した連携であれば、審査番号と申請部署が
      アプリ審査台帳の側に載っている。登録の内容だけでは分からない。
    content: |
      # アプリ登録 (AppId=7f3c-relay)

        DisplayName         : 差出人整理アシスタント
        CreatedDateTime     : 2026-05-14T03:26:11Z
        PublisherVerified   : false
        VerifiedPublisherId : (なし)
        SignInAudience      : AzureADMultipleOrgs
        ReplyUrls           : https://relay-portal.example.net/oauth2/cb
        Owners              : (なし)
        RequiredResourceAccess:
          Mail.Read (Delegated) / Mail.Send (Delegated) /
          Files.Read.All (Delegated) / offline_access / User.Read

        Logo                : 登録あり
        TermsOfService      : (なし)      PrivacyStatement : (なし)

      取得範囲 : テナントに登録されたアプリの属性と要求権限
      非対象   : 実際に呼び出された回数、社内の導入申請の記録

  - id: ev_006
    points_to: [mailbox]
    misleading: false
    plausibility: high
    volatile: false
    summary: "森の受信箱に、請求と口座を含む受信を既読にして別フォルダへ移す規則が1件ある"
    reading: |
      受信箱の規則は、受信のたびにサーバ側で動く設定である。
      端末にもブラウザにも依存しないので、利用者が別の端末に変えても動き続ける。

        Enabled       規則が有効か
        Priority      複数ある場合に評価される順番
        Conditions    どの受信に当てはめるか
        Actions       当てはまったときに何をするか
          MarkAsRead      既読にする
          MoveToFolder    指定フォルダへ移す
          StopProcessing  以降の規則を評価しない

      規則は現在の設定であって、いつ誰が作ったかは規則そのものには残らない。
      作成の記録は統合監査ログ側の New-InboxRule に載る。
    content: |
      # 受信箱の規則 (mori@example.com)

      Name         : (空文字)
      Enabled      : True      Priority : 1
      Conditions   : SubjectOrBodyContainsWords = {請求, 口座, invoice, payment}
      Actions      : MarkAsRead = True
                     MoveToFolder = "RSS フィード"
                     StopProcessing = True

      Name         : 社内報を購読フォルダへ
      Enabled      : True      Priority : 2
      Conditions   : FromAddressContainsWords = {kouhou@example.com}
      Actions      : MoveToFolder = "購読"

        規則の総数 : 2
        RSS フィード フォルダの未読数 : 0    アイテム数 : 63

      取得範囲 : サーバ側に保存された受信箱の規則
      非対象   : 端末側のメールソフトに保存された振り分け設定

  - id: ev_007
    points_to: [app-relay]
    misleading: false
    plausibility: high
    volatile: false
    summary: "あるアプリ識別子からの読み取りが、32日間ほぼ毎日続いている"
    reading: |
      統合監査ログをアプリ識別子ごとに畳んだもの。委任された立場で動く
      アプリの操作は、利用者のサインインではなくここに載る。

        MailItemsAccessed   受信箱の項目が読まれたときに記録される
        FileAccessed        ファイル共有の項目が読まれたときに記録される
        Send                利用者の名前でメールが送られたときに記録される
        ClientAppId         呼び出し元のアプリ識別子
        UserId              誰の代理として動いたか

      1日あたりの件数と、動いている時間帯の幅を見る。
      人が画面を操作して読む場合は、就業時間の中に収まり、
      日によって件数が大きく振れる。予約実行の仕組みが読む場合は、
      時刻と件数が揃う。どちらの形かは並べてみないと分からない。
    content: |
      # 統合監査ログ / ClientAppId 別 (2026-05-17 - 2026-06-18)

        ClientAppId=7f3c-relay
          MailItemsAccessed : 8,214 件   (32日間 / 稼働日 32日)
          FileAccessed      : 1,902 件
          Send              :    30 件   (2026-06-18 10:12 のみ)
          UserId            : 12 名
          時間帯            : 00:00 - 23:59 に分散。02:00 台と 04:00 台にも計上あり
          1日あたり         : 最小 141 / 中央値 256 / 最大 612

        ClientAppId=2b90-scan
          FileAccessed      : 44,310 件   MailItemsAccessed : 5,180 件
