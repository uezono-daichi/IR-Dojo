        対象             : 統合監査ログ / サインイン ログ / メッセージ追跡
        期間指定         : 2026-03-20 - 2026-06-18
        出力             : JSON Lines 3 ファイル / 合計 6.1 GB
        書き出し件数     : 4,180,662 行
        保全先           : 監査用ストレージ（変更不可の設定で保持）

        テナント側で当該期間に残っている範囲:
          統合監査ログ   : 2026-03-20 以降（90日保持のため境界に接している）
          サインイン ログ : 2026-05-19 以降（30日保持）
          メッセージ追跡  : 2026-03-20 以降

      取得範囲 : 指定した期間のうち、テナント側にまだ残っていた分
      非対象   : 既に保持期間を過ぎて落ちた日の分、無効な記録項目

open_questions:
  - id: q_entry
    label: "最初の一手"
    question: "森の名前で動いているものは、どうやってその立場を手に入れたか"
    resolved_by: [ev_003, ev_012]
    resolution_mode: any
    critical: true
    implication: |
      入口が分からないままでは、同じ誘い方が他の利用者にも届いているかを
      確かめられません。資格情報を入れ替えれば済む話かどうかも、
      ここが決まらないと判断できません。

  - id: q_which
    label: "関与している連携の絞り込み"
    question: "森のアカウントに紐づく外部連携のうち、この動きを説明できるのはどれか"
    resolved_by: [ev_005, ev_007]
    resolution_mode: any
    critical: true
    implication: |
      対象を絞れないままでは、取り消す先も、止める先も決められません。
      広く止めれば業務が止まり、狭く止めれば残ります。

  # 「どこまで読まれたか」は、この題材の本当の中心である。だが被疑判定は
  # 資産の集合しか宣言できないので、範囲はここでしか問えない（SPEC 9.4 #7）。
  # ファイル側とメール側の両方を書き出さないと数えられないので mode: all。
  # この論点があるおかげで、保全ホールドとエクスポートが最短経路に乗る
  - id: q_scope
    label: "読まれた範囲"
    question: "その立場で、どこまで読まれたのか"
    resolved_by: [ev_014, ev_017]
    resolution_mode: all
    critical: true
    implication: |
      範囲が分からないままでは、誰に何を知らせるべきかを決められません。
      読まれた分は、記録がまだ残っている間にしか数えられません。

  - id: q_persist
    label: "入り直せる状態の有無"
    question: "資格情報を入れ替えた後も、外から入り直せる仕掛けが残っていないか"
    resolved_by: [ev_006]
    resolution_mode: any
    critical: true
    implication: |
      ここを見ないまま資格情報だけを入れ替えると、同じ経路がそのまま残ります。
      取り消すべきものを数え上げるまで、封じ込めたとは言えません。

  - id: q_spread
    label: "同じ状態の利用者の広がり"
    question: "同じものを承諾している利用者が、他にもいるか"
    resolved_by: [ev_013]
    resolution_mode: any
    critical: false
    implication: |
      1人ぶんの取り消しで終わるかどうかが決まります。
      対外報告の範囲と、通知すべき相手の確定にも直結します。

actions:
  # ── 調査 ──
  - id: act_mail_trace
    label: "クラウドメールの外部宛て送信記録を洗う"
    command: |
      $ mailctl trace --sender mori@example.com \
          --from 2026-06-18T09:00 --to 2026-06-18T11:00
        events : 87

      $ mailctl trace --sender mori@example.com --recipient-domain '!example.com' \
          --group-by subject
        groups : 6
    group: "クラウドメール"
    phase: investigation
    type: investigate
    description: |
      クラウドメールのメッセージ追跡から、当該アカウントの送信を
      社外宛てに絞って並べる。誰にいつ何を送ったか、どの経路で投げられたかを見る。
    cost_minutes: 20
    investigates: [mailbox, acct-mori]
    yields: [ev_001]

  - id: act_inbox_rules
    label: "クラウドメールの受信箱の規則を一覧する"
    command: |
      $ mailctl inboxrule list --user mori@example.com --format detail
        rules : 2

      $ mailctl folder stat --user mori@example.com --all
        folders : 19
    group: "クラウドメール"
    phase: investigation
    type: investigate
    description: |
      サーバ側に保存された受信箱の規則を、条件と動作まで含めて書き出す。
      フォルダごとの件数も併せて確認する。
    cost_minutes: 15
    investigates: [mailbox]
    yields: [ev_006]

  - id: act_hold_export_mailbox
    label: "クラウドメールに保全ホールドを掛けて書き出す"
    command: |
      $ ediscctl hold apply --case IR-0618 --user mori@example.com --type inplace
        hold applied

      $ ediscctl export start --case IR-0618 --user mori@example.com --format pst
        job queued
      $ ediscctl export status --case IR-0618 --wait
        completed  (00:38:11)
    group: "クラウドメール"
    phase: investigation
    type: investigate
    tags: [preservation_hold]
    requires_evidence: [ev_001, ev_006]
    description: |
      対象の受信箱に保全ホールドを掛け、自動整理と保持期間の適用を止めたうえで、
      内容を1通ずつ書き出す。掛ける前に整理で消えた分は対象にならない。
    cost_minutes: 45
    investigates: [mailbox]
    yields: [ev_017]

  - id: act_signin_review
    label: "森のサインイン記録を照会する"
    command: |
      $ idctl signin list --user mori@example.com --all-retained
        records : 412

      $ idctl signin list --user mori@example.com --group-by resultCode
        groups : 4
      $ idctl signin list --user mori@example.com --group-by deviceId
        groups : 3
    group: "営業部アカウント（森）"
    phase: investigation
    type: investigate
    description: |
      当該アカウントのサインイン記録を、保持されている範囲すべてについて引く。
      送信元、端末、結果コード、危険度の推定値を並べる。
    cost_minutes: 20
    investigates: [acct-mori]
    yields: [ev_002]

  - id: act_consent_audit
    label: "森のアカウントの同意付与の履歴を照会する"
    command: |
      $ auditctl search --user mori@example.com \
          --operation 'Consent to application' --days 90
        records : 1

      $ auditctl search --user mori@example.com --days 90 --around 2026-05-17T10:04Z \
          --window 10m
        records : 9
    group: "営業部アカウント（森）"
    phase: investigation
    type: investigate
    requires_evidence: [ev_001, ev_006, ev_015]
    description: |
      統合監査ログから、当該アカウントが同意画面で承諾した操作を抜き出す。
      前後の操作も同じ帳簿の中で並べて確認する。
    cost_minutes: 25
    investigates: [acct-mori]
    yields: [ev_003]

  - id: act_mail_gateway
    label: "森宛の受信を、ゲートウェイの配送記録から洗う"
    command: |
      $ mgctl search --rcpt mori@example.com --from 2026-05-01 --to 2026-06-18 \
          --has-url
        messages : 61

      $ mgctl show C41A77E0 --headers --auth --body-urls
        headers + 1 url

      $ whoisq example.net --field created
        1 record
    group: "営業部アカウント（森）"
    phase: investigation
    type: investigate
    requires_evidence: [ev_001, ev_015]
    description: |
      メールゲートウェイの配送記録から、当該アカウント宛ての受信を洗う。
      差出人、件名、認証結果、本文中の URL を確認する。
    cost_minutes: 30
    investigates: [acct-mori]
    yields: [ev_012]

  - id: act_user_selfcheck
    label: "森本人に連絡し、画面を共有して見覚えのない連携と規則をその場で外してもらう"
    command: |
      $ 架電 11:02  内線                    応答あり
      $ 画面共有セッション開始 11:04        接続
      $ 聞き取り 11:04 - 11:2x              記録 3 ページ
    group: "営業部アカウント（森）"
    phase: investigation
    type: investigate
    requires_evidence: [ev_001, ev_003]
    description: |
      利用者本人に連絡し、記録に残らないこと（どんな画面が出て、何を押したか）を
      聞き取る。画面を共有し、本人が使っている連携の一覧を一緒に見ながら、
      見覚えのないものをその場で外してもらう。
    cost_minutes: 25
    investigates: [acct-mori]
    yields: [ev_016]
    # **調査側の排他はここ1組だけ。** 本人に片付けてもらうと、
    # 現在の状態を並べた一覧も、規則の定義も残らない。
    # 失われる側に critical 論点が紐づいている（SPEC 8.2 手順6.5）
    destroys: [ev_004, ev_006]

  - id: act_app_permission_review
    label: "連携アプリの委任権限を、要求スコープごとに一覧する"
    command: |
      $ tnctl app list --with-grants --sort scope-breadth
        apps : 3

      $ tnctl grant summary --by-app
        rows : 3
    group: "連携アプリを見比べる"
    phase: investigation
    type: investigate
    description: |
      テナントに登録された連携アプリを、要求している権限の広さで並べる。
      誰の代理として動くのか、全員ぶんの承諾があるのかを確認する。
    cost_minutes: 25
    investigates: [app-scan, app-board, app-relay]
    yields: [ev_008]

  - id: act_api_traffic_overview
    label: "テナント全体の API 呼び出しの概況を確認する"
    command: |
      $ tnctl api-usage --date 2026-06-18 --bucket 5m
        buckets : 288

      $ tnctl api-usage --date 2026-06-18 --top-clients 5
        rows : 5
    group: "テナント全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      テナント全体の API 要求を時間帯ごとに畳んで並べる。
      どのアプリ識別子が、いつ、どれだけ呼んだかを見る。
    cost_minutes: 20
    investigates: [app-board, app-scan, app-relay]
    yields: [ev_015]

  - id: act_unified_audit
    label: "統合監査ログを、アプリ識別子ごとに畳んで確認する"
    command: |
      $ auditctl search --days 90 --operations MailItemsAccessed,FileAccessed,Send \
          --group-by clientAppId
        groups : 3

      $ auditctl search --days 90 --client-app 7f3c-relay --histogram day
        buckets : 32
    group: "テナント全体を横断して見る"
    phase: investigation
    type: investigate
    requires_evidence: [ev_001, ev_003, ev_008, ev_015]
    description: |
      統合監査ログを、委任された立場で動いたアプリの識別子ごとにまとめる。
      読み取りと送信の件数、動いている時間帯の幅を並べる。
    cost_minutes: 30
    investigates: [app-relay, app-scan, app-board]
    yields: [ev_007]

  - id: act_grant_inventory
    label: "テナントに現在生きている委任同意を一覧する"
    command: |
      $ tnctl grant list --type delegated --state active --with-tokens
        grants : 31

      $ tnctl grant list --type delegated --state active --by-app --detail
        rows : 3
    group: "テナント全体を横断して見る"
    phase: investigation
    type: investigate
    requires_evidence: [ev_003, ev_008]
    description: |
      いま有効な委任同意を、利用者・権限・発行済みトークンの本数まで含めて
      書き出す。これは台帳ではなく現在の状態なので、取り消すと行が消える。
    cost_minutes: 25
    investigates: [app-relay]
    yields: [ev_004]

  - id: act_app_registration
    label: "差出人整理アシスタントのアプリ登録の内容を確認する"
    command: |
      $ tnctl app show 7f3c-relay --detail --owners --reply-urls
        1 record

      $ tnctl app show 7f3c-relay --required-access
        entries : 5
    group: "差出人整理アシスタント"
    phase: investigation
    type: investigate
    requires_evidence: [ev_004, ev_007, ev_013]
    description: |
      テナントに登録されたそのアプリの素性を引く。発行元の検証状況、
      登録日時、同意後の送り返し先、要求している権限の一覧を確認する。
      発行元の検証状況は別系統の照会になるため、応答を待つ時間がかかる。
    cost_minutes: 35
    investigates: [app-relay]
    yields: [ev_005]

  - id: act_file_access_audit
    label: "共有ファイル領域のアクセス記録を、API 経由に絞って洗う"
    command: |
      $ auditctl search --days 90 --workload filehub \
          --operations FileAccessed,FileDownloaded --client-app 7f3c-relay
        records : 2319

      $ auditctl search --days 90 --workload filehub --group-by siteUrl \
          --client-app 7f3c-relay
        groups : 3
    group: "共有ファイル領域"
    phase: investigation
    type: investigate
    requires_evidence: [ev_004, ev_007]
    description: |
      共有ファイル領域のアクセス記録を、API 経由の呼び出しに絞って洗う。
      どの領域の項目が、誰の代理として、どれだけ触られたかを並べる。
    cost_minutes: 30
    investigates: [filehub, app-relay]
    yields: [ev_014]

  - id: act_tenant_consent_sweep
    label: "テナント全体の同意付与の推移を洗う"
    command: |
      $ auditctl search --days 30 --operation 'Consent to application' \
          --histogram day
        buckets : 30

      $ auditctl search --days 30 --operation 'Consent to application' \
          --group-by appId --with-department
        groups : 3
    group: "テナント全体を横断して見る"
    phase: investigation
    type: investigate
    requires_evidence: [ev_003, ev_008]
    description: |
      統合監査ログの同意付与を日ごとに数え、どのアプリに何件が積み上がったかを
      並べる。承諾した利用者の所属も併せて出す。
    cost_minutes: 30
    investigates: []
    yields: [ev_013]

  - id: act_app_usage_baseline
    label: "連携アプリ3件の利用実績を、過去90日の実行回数で比べる"
    command: |
      $ tnctl report app-usage --days 90 --all-apps
        rows : 3

      $ appreviewq --status approved --format count
        2 records
    group: "台帳・運用の記録"
    phase: investigation
    type: investigate
    requires_evidence: [ev_008, ev_015]
    description: |
      テナントの利用状況レポートから、各連携アプリの導入日と呼び出し回数を引く。
      社内のアプリ審査台帳も併せて照会し、申請と承認の記録を突き合わせる。
      異常かどうかは、平常時の姿を知らないと判定できない。
    cost_minutes: 25
    investigates: []
    yields: [ev_009]

  - id: act_admin_signin_review
    label: "テナント管理者アカウントのサインイン記録を照会する"
    command: |
      $ idctl signin list --user kishi-adm@example.com --from 2026-06-01 \
          --with-ca-status
        records : 1184

      $ idctl signin list --user kishi-adm@example.com --from 2026-06-01 \
          --group-by resultCode
        groups : 4
    group: "テナント管理者アカウント（岸）"
    phase: investigation
    type: investigate
    requires_evidence: [ev_002, ev_008]
    description: |
      特権のあるアカウントのサインイン記録を、条件付きアクセスの評価結果まで
      含めて引く。送信元、経路、結果コードを並べる。
    cost_minutes: 25
    investigates: [acct-admin]
    yields: [ev_010]

  - id: act_ca_review
    label: "条件付きアクセスの構成と直近の変更履歴を確認する"
    command: |
      $ idctl ca policy list --state all
        policies : 3

      $ idctl ca policy history --days 30
        changes : 0
    group: "台帳・運用の記録"
    phase: investigation
    type: investigate
    requires_evidence: [ev_010]
    description: |
      サインインの成否を決める前段の関門が、いまどう構成されているかを引く。
      直近の変更履歴も併せて確認する。
    cost_minutes: 20
    investigates: []
    yields: [ev_011]

  - id: act_hold_export_audit
    label: "監査記録を保全先へ書き出す"
    command: |
      $ auditctl export start --from 2026-03-20 --to 2026-06-18 \
          --sources unified,signin,messagetrace --sink audit-archive
        job queued

      $ auditctl export status --wait
        completed  (00:27:44)
    group: "テナント全体を横断して見る"
    phase: investigation
    type: investigate
    tags: [preservation_hold]
    requires_evidence: [ev_002, ev_003]
    description: |
      テナント側にまだ残っている監査記録を、保持期間とは別の保管先へ写す。
      写した後の分は、テナント側の保持期間の影響を受けなくなる。
      写す前に落ちた日の分は対象にならない。
      指定した期間を投げるだけの操作で、待ち時間も短い。
    cost_minutes: 20
    investigates: []
    yields: [ev_018]

  # ── 現場への指示 ──
  # 証拠を取りに行くのではなく、記録が消えるのを止めに行く手。
  # このテナントで記録を消すのは自分の手ではなく時計である（保持期間）。
  # 効くのは打ち終わった時刻から先だけで、既に落ちた日には効かない。
  - id: act_preservation_notice
    label: "全社に保全の周知を出し、対象期間の保持を固定する"
    command: |
      $ noticectl send --template ir-preserve --to all-staff@example.com
        delivered: 218 recipients

      $ ediscctl hold apply --case IR-0618 --scope tenant --period 2026-03-20..now
        hold applied

      $ helpdesk-cli script set --id first-response --file notice-hd.txt
        1 script updated
    group: "全体への指示"
    phase: investigation
    type: communicate
    description: |
      情報システム部から全社へ、調査期間中のメールとファイルの削除・移動・
      連携の解除を行わないよう周知する。あわせて対象期間の記録に保全ホールドを
      掛け、保持期間による自動削除を止める。ヘルプデスクの一次応答も
      同じ文面に差し替える。調査そのものは1ミリも進まない。
    cost_minutes: 20
    prevents: [tl_retention_signin, tl_deleted_items, tl_app_sweep,
               tl_helpdesk_rule, tl_user_unlink]

  # ── 封じ込め・対応 ──
  # 連携そのものを止める手。登録も同意も残るので、条件を外せば元に戻る。
  - id: act_block_app_relay
    label: "差出人整理アシスタントを、条件付きアクセスで遮断する"
    command: |
      $ idctl ca policy create --name block-7f3c --target-app 7f3c-relay \
          --grant block --state enabled
        policy created
      $ idctl ca policy simulate --app 7f3c-relay
        evaluated : blocked
        登録と同意はそのまま。条件の側だけで止める。
    group: "連携だけを止める"
    phase: response
    type: contain
    description: |
      その連携アプリからの要求を、条件付きアクセスの側で拒否する。
      登録も同意も残したまま、通る／通らないの判定だけを変える。
    cost_minutes: 15
    targets: [app-relay]
    investigates: []
    side_effects:
      business_impact: false

  - id: act_block_app_scan
    label: "契約書点検サービスを、条件付きアクセスで遮断する"
    command: |
      $ idctl ca policy create --name block-2b90 --target-app 2b90-scan \
          --grant block --state enabled
        policy created
      $ idctl ca policy simulate --app 2b90-scan
        evaluated : blocked
        夜間の定期処理は次回から止まる。
    group: "連携だけを止める"
    phase: response
    type: contain
    description: |
      その連携アプリからの要求を、条件付きアクセスの側で拒否する。
      登録も同意も残したまま、通る／通らないの判定だけを変える。
    cost_minutes: 15
    targets: [app-scan]
    investigates: []
    side_effects:
      business_impact: true

  # 受信箱の側で連携を止める手。攻撃者の読み取りは止まるが、
  # 同意も規則も残るので、方針を戻せば元に戻る。
  # **この手が無いと 5.8 の persistence 条項が恒真になる** — 受信箱を止める
  # 手が根絶する手しか無いと、「止めたが取り除いていない」盤面が作れない（v1.37）
  - id: act_mailbox_app_block
    label: "クラウドメールへの、外部連携からのアクセスを止める"
    command: |
      $ mailctl appaccess policy create --name deny-apps --user mori@example.com \
          --apps all --action deny
        policy created
      $ mailctl appaccess test --user mori@example.com --app 7f3c-relay
        access : denied
        利用者本人の送受信はそのまま続く。
    group: "連携だけを止める"
    phase: response
    type: contain
    description: |
      対象の受信箱に対して、外部連携アプリからの参照を拒否する方針を入れる。
      利用者本人の送受信はそのまま続く。同意も規則もそのまま残る。
    cost_minutes: 15
    targets: [mailbox]
    investigates: []
    side_effects:
      business_impact: false

  - id: act_reset_acct_mori
    label: "森の資格情報を入れ替え、多要素認証を登録し直す"
    command: |
      $ idctl user reset-credential --user mori@example.com --require-change
        credential reset
      $ idctl user mfa reset --user mori@example.com
        methods cleared : 2
        本人が再登録すれば、そのまま業務を続けられる。
    group: "利用者の側で締める"
    phase: response
    type: contain
    description: |
      当該アカウントのパスワードを再設定し、多要素認証の登録をやり直させる。
      本人は再登録の後、そのまま業務を続けられる。
    cost_minutes: 25
    targets: [acct-mori]
    investigates: []
    side_effects:
      business_impact: false

  - id: act_disable_acct_mori
    label: "森のアカウントをサインインできない状態にする"
    command: |
      $ idctl user block-signin --user mori@example.com
        accountEnabled : false
        本人は自分の画面にも入れなくなる。
    group: "利用者の側で締める"
    phase: response
    type: contain
    description: |
      当該アカウントのサインインを止める。本人も業務に使えなくなる。
    cost_minutes: 10
    targets: [acct-mori]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_disable_acct_admin
    label: "テナント管理者アカウントをサインインできない状態にする"
    command: |
      $ idctl user block-signin --user kishi-adm@example.com
        accountEnabled : false
        このアカウントで行う管理作業は止まる。
    group: "利用者の側で締める"
    phase: response
    type: contain
    description: |
      特権のあるアカウントのサインインを止める。
      このアカウントで行っている管理作業も止まる。
    cost_minutes: 10
    targets: [acct-admin]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_tenant_consent_lock
    label: "ID基盤テナントで、利用者による外部連携への同意を一律に停止する"
    command: |
      $ tnctl setting set --key userConsentToApps --value disabled
        applied (tenant-wide)
      $ tnctl grant list --type delegated --state active
        grants : 31
        既にある同意はそのまま。新しく承諾することだけができなくなる。
    group: "テナント全体を締める"
    phase: response
    type: contain
    description: |
      テナントの設定を変え、利用者が自分の判断で外部連携へ同意することを
      できなくする。全社の連携申請は管理者経由に切り替わる。
    cost_minutes: 25
    targets: [tenant]
    investigates: []
    side_effects:
      business_impact: true

  # 3つの締め方。**止めることと、居座られた状態を消すことは別の作業である。**
  # 条件付きアクセスで遮断しても、同意も規則も残るので、条件を外せば元に戻る。
  # この3つだけが `eradicates` を持ち、5.8 の減衰を on_partial から
  # on_correct_containment へ動かす。
  #
  # **対ではなく3つ置いてある。** 業務／記録の2軸を張るには手が2つでは足りず、
  # 「業務も記録も守る手」が1つあると2方針がそこへ相乗りする（SPEC 8.1）。
  - id: act_revoke_per_user
    label: "同意を利用者ごとに取り消し、受信箱の規則を既定に戻す"
    command: |
      $ tnctl grant revoke --app 7f3c-relay --principal-file principals.txt
        revoked : 12 grants
      $ mailctl inboxrule reset --user-file principals.txt --to-baseline
        rules reset : 3 users
        利用者は自分の画面をそのまま使い続けられる。
    group: "元の状態に戻す"
    phase: response
    type: contain
    description: |
      承諾した利用者を1人ずつ回り、その利用者ぶんの委任同意を取り消す。
      あわせて受信箱の規則を、その利用者の既定の状態へ戻す。
      利用者の画面は止まらないが、名簿を作って回るぶん時間がかかる。
    cost_minutes: 40
    targets: [app-relay, mailbox]
    eradicates: [app-relay, mailbox]
    investigates: []
    # 取り消すと同意の行は消え、規則を戻すと規則の定義も残らない。
    # どちらも「現在の状態」であって、台帳ではない
    destroys: [ev_004, ev_006]
    side_effects:
      business_impact: false

  - id: act_hold_then_revoke
    label: "保全ホールドを掛けたうえで、同意を取り消し、受信箱の規則を控えて外す"
    command: |
      $ ediscctl hold apply --case IR-0618 --scope tenant --type inplace
        hold applied
      $ tnctl grant export --app 7f3c-relay --sink audit-archive
        exported : 12 grants
      $ mailctl inboxrule export --user-file principals.txt --sink audit-archive
        exported : 3 users
      $ tnctl grant revoke --app 7f3c-relay --all-principals
        revoked : 12 grants
        ホールドの間、対象の受信箱は送受信を止めて据え置く。
    group: "元の状態に戻す"
    phase: response
    type: contain
    tags: [preservation_hold]
    description: |
      先に保全ホールドを掛け、取り消す前の状態を控えてから同意を取り消す。
      控えを取る間、対象の受信箱は据え置きになり、送受信が止まる。
      控えは同意・規則・受信箱の3系統をそれぞれ書き出すので、時間がかかる。
    cost_minutes: 60
    targets: [app-relay, mailbox]
    eradicates: [app-relay, mailbox]
    investigates: []
    destroys: []
    side_effects:
      business_impact: true

  - id: act_purge_tenantwide
    label: "アプリ登録を削除し、テナント全体で発行済みトークンを一括で失効させる"
    command: |
      $ tnctl app delete 7f3c-relay --purge
        application deleted
        service principal deleted
      $ idctl token revoke --all-users
        refresh tokens revoked : 5,402
        全利用者が次の操作でサインインし直す。
    group: "元の状態に戻す"
    phase: response
    type: contain
    description: |
      アプリの登録そのものをテナントから削除し、あわせて全利用者の
      発行済みトークンを一括で失効させる。全社がサインインし直すことになる。
      登録を消すので、その登録の内容と、それに紐づいていた同意の状態は
      以後たどれなくなる。管理画面から1操作で終わる。
    cost_minutes: 15
    targets: [app-relay, mailbox]
    eradicates: [app-relay, mailbox]
    investigates: []
    # 登録が消えると識別子が解決できなくなるので、登録の内容も、
    # そこに紐づいていた同意の状態も、以後たどれない
    destroys: [ev_004, ev_005]
    side_effects:
      business_impact: true

phases:
  - id: investigation
    label: "調査"
    advance_label: "対応フェーズに移る"

  - id: response
    label: "封じ込め・対応"
    advance_label: null
    requires_assessment: true

# 時間が経つと向こうから入ってくること（SPEC 5.10）。
# 1本目のシナリオでは、揮発性の証拠を消すのは学習者自身の手だった。
# ここでは消すのは**時計**である — 帳簿ごとに保持期間が違い、
# 日次のジョブが古い日から順に落としていく。誰も悪意で消していない。
# 保全ホールドを先に掛けた場合だけ、落ちるはずだった日が残る。
timeline:
  - id: tl_accel
    at_minutes: 170
    label: "取引先窓口から追加連絡"
    text: |
      「同じ内容のメールについて、問い合わせが増えています。
        朝より速い勢いで連絡が来ていて、こちらの窓口が追いつきません。」
    heralds: acceleration

  - id: tl_retention_signin
    at_minutes: 225
    label: "ログ基盤チームから連絡"
    text: |
      「日次のパージが走りました。保持期間の設定どおりの動作です。
        照会範囲の古い側から、順に対象に入っていきます。」
    destroys: [ev_002]
    averted_label: "ログ基盤チームから連絡"
    averted_text: |
      「日次のパージが走りましたが、保全の指定が入っていたので
        対象から外れました。範囲はそのまま残っています。」

  - id: tl_deleted_items
    at_minutes: 265
    label: "メール運用チームから連絡"
    text: |
      「メールボックスの容量が上限に近づいていたので、
        自動整理が動きました。設定どおりの定期処理です。」
    destroys: [ev_017]
    averted_label: "メール運用チームから連絡"
    averted_text: |
      「自動整理が動こうとしたのですが、保全の指定が掛かっていたので
        対象外になりました。中身はそのままです。」

  - id: tl_app_sweep
    at_minutes: 295
    label: "アプリ管理チームから連絡"
    text: |
      「申請の記録が無い連携の登録を自動で整理する仕組みが、
        今朝の分をまとめて処理しました。月次の棚卸しの設定どおりです。」
    destroys: [ev_005]
    averted_label: "アプリ管理チームから連絡"
    averted_text: |
      「自動整理が走るところでしたが、保全の指定が入っていたので
        処理から外しました。登録はそのまま残しています。」

  - id: tl_helpdesk_rule
    at_minutes: 310
    label: "ヘルプデスクから連絡"
    text: |
      「営業部から『請求のメールが届かない』という申告が来ていて、
        担当者が受信箱の設定を見て、その場で直したそうです。」
    destroys: [ev_006]
    averted_label: "ヘルプデスクから連絡"
    averted_text: |
      「営業部から『請求のメールが届かない』という申告が来ていますが、
        先の周知どおり、設定には触らずに預かっています。」

  - id: tl_user_unlink
    at_minutes: 355
    label: "営業部から連絡"
    text: |
      「本人が心配して、自分の画面から連携アプリの一覧を開いて、
        見覚えのないものを片付けたと言っています。」
    destroys: [ev_004]
    averted_label: "営業部から連絡"
    averted_text: |
      「本人が心配して連携アプリの一覧を開いたそうですが、
        周知を見て、そのままにしておいたとのことです。」

damage:
  model: exponential
  params:
    base: 300.0
    rate: 0.15
  acceleration:
    # 折れ点は「巧いプレイの長さ」L の 1.1〜1.3 倍（SPEC 8.2 手順7）。
    # L = 判断に到達するまで（145分）＋ compromised を覆い persistence を
    # 根絶する最安の封じ込め（25分）＝ 170分。200/170 = 1.18倍。
    threshold_minutes: 200
    multiplier: 2.5
  containment_effect:
    on_correct_containment: 0.2
    on_partial: 0.6
    on_incorrect: 1.0

scoring:
  fact_layer:
    metrics:
      - id: assessment_precision
        label: "被疑判定の適合率"
        direction: higher_is_better
      - id: assessment_recall
        label: "被疑判定の再現率"
        direction: higher_is_better
      - id: assessment_support
        label: "名指しの裏付け"
        direction: higher_is_better
      - id: unresolved_questions
        label: "未解消論点を抱えたままの判断"
        label_good: "論点を解消してからの判断"
        direction: lower_is_better
    weights:
      assessment_precision:  0.20
      assessment_recall:     0.20
      assessment_support:    0.20
      # critical 論点が4つあるので 5段階の階段になる。1論点 = 10 fact点
      unresolved_questions:  0.40

  policy_layer:
    constraint_penalty: 0.15

  consequence_layer:
    display_only:
      - elapsed_minutes
      - total_damage
      - business_impact
      - evidence_preserved
      - containment_completeness
    business_impact_horizon_minutes: 480
    normalization:
      total_damage:             { worst: 18000, best: 0 }
      # 帯の上端は「盤面で到達しうる最悪」に合わせる。1600 にしていたとき、
      # 依存の根を止める3つのプレイ（1976 / 2071 / 2273）が全部 0点に
      # 張り付いて、互いの差が消えていた
      business_impact:          { worst: 2300,  best: 0 }
      evidence_preserved:       { worst: 0.722, best: 1.0 }
      containment_completeness: { worst: 0.0,   best: 1.0 }

  composite:
    method: weighted_sum
    fact_weight: 0.7

retrospective:
  minimal_path:
    compute: true
    label: "事後的に見た最短経路"
    disclaimer: |
      これは答えを知った上で算出した参照値です。
      実際の対応では、外れを引くことは避けられません。
      この差分は無駄ではなく、不確実性の代価です。
  counterfactuals:
    compute: true
  unresolved_review:
    compute: true

debrief:
  reveal_ground_truth: true
  misleading_explanations:
    ev_008: |
      契約書点検サービスの権限は、確かにこのテナントで最も広いものです。
      ただしそれは2年前に法務部が申請し、審査番号 APP-2024-0031 として
      承認されたうえで与えられたものです。過去90日の呼び出しは
      148万件・214名で、直近30日と前60日の比は 0.98 でした。
      権限の広さは「何ができる状態か」であって、「何が起きたか」ではありません。
    ev_010: |
      テナント管理者アカウントへの試行は、条件付きアクセスの CA-002／CA-003 が
      すべて手前で止めています。結果コード 53003 は、資格情報の照合まで
      到達していないことを表します。成功（結果コード 0）は 0 件でした。
      外部からの試行そのものは、どのテナントでも日常的に記録されます。
    ev_015: |
      会議室予約コネクタの呼び出しが 10:05 に跳ねるのは、
      始業時刻に予約の同期が走る設定によるものです。
      過去90日の実績と比べれば同じ形が毎営業日に現れます。
      跳ねた時刻が事案の時刻と近かったため、関係があるように見えました。
  key_lessons:
    - "同意は認証ではない。パスワードも多要素認証も破られていないのに、攻撃者は32日間読み続けられる。サインインの記録だけを見ていると、この形は最後まで見えない。"
    - "権限の広さは、何が起きたかを語らない。最も凶悪な権限を持つ連携が、最も長く使われてきた正規の連携でもある。棄却の材料は台帳ではなく、平常時の利用実績にある。"
    - "資格情報の入れ替えでは、委ねた立場は戻らない。同意と、受信箱に残された規則を取り消すまで、同じ経路がそのまま残る。"
    - "このテナントでは、記録は自分の手より先に時計が消す。帳簿ごとに保持期間が違い、日次のジョブが古い日から順に落としていく。保全は「先に掛ける」ことでしか効かない。"
    - "読まれた範囲は、権限の広さで決まる。取り消した後に数え直すことはできない。"
  replay_suggestions:
    - policy: evidence_preservation
      hint: |
        同じ状況を「証拠保全最優先」で解くと、封じ込めの前に
        保全ホールドとエクスポートが要ります。その分だけ被害が伸びます。
    - policy: damage_minimization
      hint: |
        「被害最小化最優先」では、利用者を1人ずつ回る取り消しが違反になります。
        同じ行動列でも評価が変わることを確かめてください。
