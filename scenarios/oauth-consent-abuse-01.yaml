  - id: ev_011
    points_to: []
    misleading: false
    plausibility: medium
    volatile: false
    summary: "条件付きアクセスの構成と、結果コードが何を意味するかの対応表が取れる"
    reading: |
      条件付きアクセスは、サインインの成否を決める前段の関門である。
      ポリシーごとに「誰に」「どの経路で」「何を要求するか」を持つ。

        State           enabled / reportOnly / disabled
        Users           対象の利用者や役割
        Conditions      対象のクライアント種別・場所・端末の状態
        GrantControls   通すための条件 (多要素認証・準拠端末など)
        BlockLegacyAuth 古い認証経路を一律で遮断する設定

      結果コード 53003 は、条件付きアクセスの段でその試行が止まったことを表す。
      止まった試行では、その先の資格情報の照合そのものが行われない。

      ポリシーの評価は毎回のサインインで走るので、
      構成が変わっていない限り、同じ経路の試行は同じ段で扱われる。
    content: |
      # 条件付きアクセス ポリシー一覧 (2026-06-18 時点)

      CA-001  管理者ロールに多要素認証を必須化
        State : enabled    Users : Global Administrator ほか 6 ロール
        GrantControls : requireMFA AND requireCompliantDevice

      CA-002  古い認証経路の遮断
        State : enabled    Users : 全利用者
        Conditions : clientAppTypes = [exchangeActiveSync, other]
        GrantControls : block

      CA-003  国外からの管理操作の遮断
        State : enabled    Users : Global Administrator ほか 6 ロール
        Conditions : locations = All except 日本
        GrantControls : block

        直近30日の変更履歴 : 0 件
        reportOnly のポリシー : 0 件

      照会対象 : ポリシーの構成と、直近の変更履歴
      非対象   : 各サインインが実際にどのポリシーで扱われたかの1件ごとの内訳

