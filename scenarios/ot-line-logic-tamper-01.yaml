schema_version: "0.4"

meta:
  id: ot-line-logic-tamper-01
  title: "止めるか、動かし続けるか"
  version: "1.0.0"
  author: "IR Dojo"
  license: "CC-BY-4.0"
  estimated_play_minutes: 10
  language: ja
  default_policy: production_continuity
  default_assist_level: assisted
  briefing: |
    02:40、IT 側の監視センターから連絡。工場の保守接続用の踏み台 jump01 に、
    保守ベンダの作業アカウントで深夜の接続が続いている。
    ベンダの当番からは、作業予定の連絡を受けていない。

    あなたは IT と制御の両方を見る当直の対応担当として、製造課の当直長と
    合流した。充填ラインは 24時間の連続運転中で、いまも動いている。

    ここは IT の現場と前提が違う。ラインを止めると立ち上げ直すまでに
    数時間かかり、その間の仕掛品はすべて廃棄になる。安全に関わる仕組みは
    制御とは別系統で動いており、そちらを落とすと運転そのものを続けられない。
    「怪しいから止める」は、ここでは無条件に正しい手ではない。
  tags: [ics, ot-incident-response, misleading-evidence]

world:
  assets:
    # **この盤面には `aliases` が要る**（SPEC 5.2 / v1.45）。
    # 制御の現場は同じものを場所ごとに別の名前で呼ぶ。踏み台は
    # 「保守ゲートウェイ」、制御プログラム作成端末は「エンジニアリング端末」、
    # 監視操作端末は「HMI」と、資料の側がそう書く。宣言しないと
    # `names_asset` に依存する漏洩検査が、その語のぶんだけ空振りする。
    # **広すぎる語を入れないこと** — 「端末」のように他の label に
    # 含まれる語を入れると、片方を名指しした文が両方を名指しになる。
    # **安全計装そのものは何も作らない。** 止めて失うのは、この機器の
    # 仕事ではなく「ラインを運転してよい」という条件のほうである。
    # だから値段は控えめで、代わりに plc-11 がここに依存している —
    # 止めれば波及でラインが落ち、代価はそちらから出る（SPEC 5.2）。
    # 重要度は「止めたときに業務が受ける影響」なので、この機器単体では
    # 「重要」になる。最重要はラインそのもの（plc-11）である
    - id: sis01
      label: "安全計装システム"
      aliases: ["SIS", "安全計装"]
      criticality: high
      depends_on: []
      business_impact_per_hour: 45

    - id: ctl01
      label: "制御系の基盤サーバ"
      aliases: ["基盤サーバ"]
      criticality: high
      depends_on: []
      # 監視・履歴・エンジニアリングの土台（時刻同期・タグ定義の配布・認証）。
      # 止めると、ぶら下がっている3つが実質止まる
      business_impact_per_hour: 120

    # **盤面で最も高くつくのはラインそのものである。** 止めれば
    # 立ち上げ直しに 3.5〜5時間かかり、その間の仕掛品は全部廃棄になる。
    # **装置は基盤サーバには依存しない。** 上位が落ちてもラインは回り続ける —
    # 制御の世界ではここが IT と逆で、依存は上から下へは流れない。
    # 依存するのは安全計装のほうで、そちらが落ちれば運転を続けられない
    - id: plc-11
      label: "充填ラインの制御装置"
      aliases: ["PLC-11"]
      criticality: critical
      depends_on: [sis01]
      business_impact_per_hour: 240

    - id: hmi02
      label: "監視操作端末 (オペレータ室)"
      aliases: ["HMI-02"]
      criticality: medium
      depends_on: [ctl01]
      # 止めても装置は動き続ける。オペレータが値を見られなくなる
      business_impact_per_hour: 25

    - id: ews01
      label: "制御プログラム作成端末"
      aliases: ["EWS-01", "エンジニアリング端末"]
      criticality: medium
      depends_on: [ctl01]
      # 止めると、この日に予定されている他ラインの改造作業が止まる
      business_impact_per_hour: 22

    - id: hist01
      label: "生産履歴サーバ"
      aliases: ["履歴サーバ"]
      criticality: medium
      depends_on: [ctl01]
      # 止めると、出荷判定に使う記録がその間だけ欠ける
      business_impact_per_hour: 18

    - id: jump01
      label: "保守接続の踏み台"
      aliases: ["保守ゲートウェイ"]
      criticality: low
      depends_on: []
      # 止まって困るのはベンダの遠隔作業だけ。当面の予定は入っていない
      business_impact_per_hour: 8

  ground_truth:
    patient_zero: jump01
    # 3台目（plc-11）は「疑われなかった」ほうの失敗のために置いてある。
    # この盤面で plc-11 を指す非誤導の証拠は、現地採取の1件しかない。
    # 手元の画面から引ける安いほうは、正しく「記録の範囲には何も無い」と返す
    compromised: [jump01, ews01, plc-11]
    persistence: [ews01]
    # ctl01 はここに書かない。**どの資料もこのサーバを疑わせない** —
    # 1本目の dc01 と同じ立ち位置で、侵害もされておらず、
    # 「疑わしいが無関係」でもない。誤導が指すのは sis01 と hmi02 である
    innocent: [sis01, hmi02, hist01]
    attack_narrative: |
      5/19 02:31、保守ベンダの作業アカウントで jump01 への接続が行われた。
      この資格情報は、ベンダ側の業務端末から 4月に持ち出されたものである。
      多要素の追加確認は、社内からの接続とみなす設定によって迂回されている。

      攻撃者は 02:38 に jump01 から ews01 へ渡り、02:44 に ews01 の
      エンジニアリングツールで plc-11 のプロジェクトを開いた。
      02:47、充填量を決めているファンクションブロックに、
      上位からの指令値を一定の割合で書き換える処理を追加して転送している。
      装置は止まらず、記録されるタグの値も、しきい値の内側に収まる。
      表に出るのは充填量のばらつきだけで、それは原料や環境のせいにも見える。

      ews01 には、サービスとして登録されたローダが残されている。
      端末を作り直すか、その登録を戻さない限り、接続が閉じても戻ってくる。

      02:52 に sis01 の技術者ポートで記録された 27件の読み出しは、
      ベンダによる年次のプルーフテストの準備であり、5/12 に承認されている。
      攻撃とは無関係。作業の枠に紛れ込まれたのではなく、
      たまたま同じ夜に別々のことが起きた。

      監視ベンダが hmi02 について上げたアラートは、宛先アドレスが
      2月まで別の事業者に割り当てられていたことによる。現在の割り当て先は
      気象データの配信で、hmi02 の画面部品が毎時取りに行っている。
      攻撃とは無関係。

policies:
  # **3本とも、この題材のために作り直してある。** IT の盤面の
  # 「業務継続 / 証拠保全 / 被害最小化」をそのまま持ってくると、
  # 「止めることが人身と設備の危険になりうる」という制御の前提が
  # どこにも現れない。安全最優先は、止めることを禁じもするし、
  # 止める前に確かめることを要求もする — 両方を持つ方針である。
  - id: safety_first
    label: "安全最優先"
    briefing: |
      人と設備の安全を最優先とする。生産の継続と証拠の保全は
      二次的な考慮事項とする。

      安全計装には手を触れないこと。これを落とすと、ラインを安全な側へ
      倒す最後の仕組みが無くなる。どんな根拠があっても取らない手である。

      止める前に、現場の人の配置と、安全に関わる仕組みが生きていることを
      確認すること。人が中にいる状態で装置の状態を変えてはならない。

      通信を絞るだけ、運転を止めるだけでは足りない。予定外のものが
      入っている装置は、指令を受け付けない保守の状態まで落とすこと。

      端末に残ったものも、登録を戻すだけで済ませないこと。
      見えていない場所に残った分を取りこぼしうる。作り直して確実に取り除く。
    weights:
      total_damage:             0.45
      containment_completeness: 0.30
      business_impact:          0.15
      evidence_preserved:       0.10
    constraints:
      # 安全計装を止めることは、この方針では常に違反である。
      # 盤面には誤導（ev_005）があり、乗ると押したくなる手でもある
      - type: forbid_action
        action_ids: [act_stop_sis01]
        message: "安全計装を止めることは、この方針では取れません"
      # **「必須になる手」の側。** 前提タグの付いた手を1つ押していれば
      # 満たされる `require_before` は、SPEC 5.3 が「ほぼ無料」と
      # 名指しした型である。ここではそれで正しい — 安全確認は
      # 資産ごとではなく現場ごとに1回行うもので、25分で必ず取れる手元の手。
      # 値段は時間としてそのまま乗り、この方針の L を最も長くする
      - type: require_before
        action_type: contain
        prerequisite_tags: [safety_confirm]
        message: "現場の状態を確認せずに、装置の状態を変えています"
      # 生産継続にとって最良の手（経路を絞る）も、証拠保全にとって
      # 最良の手（運転だけ止める）も、この方針では違反になる。
      # ブリーフィングの「保守の状態まで落とすこと」が根拠
      - type: forbid_action
        action_ids: [act_fence_plc11, act_planned_stop_plc11]
        message: "指令を受け付ける状態のまま残しています"
      # 同じ理屈が残されたものの側にもある。登録を戻すだけの除去は、
      # 見えていない場所に残った分を取りこぼしうる。丁寧なほうが高くつくのは
      # 装置の3つの手と同じ形で、この方針だけが「作り直す」を選ばされる
      - type: forbid_action
        action_ids: [act_restore_ews01]
        message: "登録を戻すだけでは取りこぼしうる。この方針では作り直して確実に取り除くこと"

  - id: production_continuity
    label: "生産継続最優先"
    briefing: |
      経営判断により、ラインの停止は最終手段とする。
      封じ込めは生産への影響を最小化する形で実施すること。
      証拠保全は可能な範囲で行えばよい。

      運転中の装置や基幹の仕組みを止める場合は、
      それが触られていると言える根拠を示せる状態であること。

      現場の操作を一律に止める指示は出さないこと。
      現場が手を出せなくなった時点で、生産はそこで止まる。
    weights:
      business_impact:          0.40
      total_damage:             0.25
      containment_completeness: 0.20
      evidence_preserved:       0.15
    constraints:
      - type: forbid_containment_without_evidence
        assets: [plc-11, sis01, ctl01]
        message: "根拠なく運転中の装置を止めることは方針違反です"
      # 現場に「何も触るな」と流すことは、生産を止めることと同じである。
      # 記録は残るが、その日の生産は止まる。この方針の下では取れない手
      - type: forbid_action
        action_ids: [act_freeze_notice]
        message: "現場の操作を一律に止める周知は、生産を止めます"

  - id: evidence_preservation
    label: "証拠保全最優先"
    briefing: |
      重大事故に至りうる事案として、当局への報告と第三者調査が見込まれる。
      証拠保全を最優先とする。

      止める資産ごとに、その資産から消える情報を先に取ってから止めること。
      別の資産で取れていることは、この要件を満たさない。

      止めた資産は運転から降ろすこと。動かしたままでは記録の上書きが続く。
      指令を受け付けない状態まで落とさないこと。装置がいま保持している値は、
      そこまで落とした時点で取れなくなる。
    weights:
      evidence_preserved:       0.40
      containment_completeness: 0.30
      total_damage:             0.20
      business_impact:          0.10
    constraints:
      # **`require_before` ではこの方針は成立しない**（SPEC 5.3 / v1.40）。
      # 盤面のどこか1つで満たせる制約は、封じ込めの「どの手を選ぶか」に
      # 一度も効かない。止める資産ごとに、その資産から取らせる
      - type: require_capture_of_target
        action_type: contain
        prerequisite_tags: [volatile_capture]
        message: "止める資産から消える情報を、止める前に取っていません"
      # 経路を絞るだけでは装置は運転を続け、保持している値は上書きされ続ける。
      # 保守の状態まで落とすと、いま保持している値は以後どうやっても取れない。
      # 残るのは「動かしたまま、運転だけを止める」1つになる
      - type: forbid_action
        action_ids: [act_fence_plc11, act_safe_state_plc11]
        message: "運転に載せたままにも、保持している値を捨ててもいけません"

evidence:
  - id: ev_001
    points_to: [jump01]
    misleading: false
    plausibility: high
    volatile: false
    occurred_at: "2026-05-19 02:31"
    summary: "jump01 に、普段と違う接続元からベンダの作業アカウントで接続されている"
    reading: |
      保守ゲートウェイの認証ログ。行の読み方:
        auth=success   認証そのものは通っている
        method         使われた認証の方式
        src            接続してきた側の住所
        route          どの回線を通って来たか
        mfa=skipped(trusted-network)
                       追加の確認を省いた理由。接続元が社内とみなす範囲に
                       入っている場合に、設定でそう扱われる

      「直近90日の接続元」は、そのアカウントが普段どこから来ているかの並びで、
      当日の接続と突き合わせるための物差しになる。ここには当日どうだったかは
      書かれておらず、比べる側の値は上の行にある。

      ゲートウェイが残すのは、通したかどうかと、通した相手の外形だけである。
      通した先で何が行われたかは、この記録には載らない。
    possibilities:
      - |-
        ベンダが予定を伝えないまま、いつもと違う回線から入った。
        予定の枠を見れば分かれる
      - |-
        持ち出された資格情報で、別の誰かが同じ名前で入った。
        入った先に残る動きで分かれる
      - |-
        経路の付け替えがあって、見える接続元だけが変わった。
        回線側の記録で分かれる
    content: |
      # jump01 リモートアクセスゲートウェイ 認証ログ

      2026-05-19T02:31:12Z  auth=success  user=svc_maint_v3  method=password
        src=203.0.113.48   route=site-to-site/vendor
        mfa=skipped(trusted-network)   client="RG/10.0"   session=RG-4471

      2026-05-19T02:31:44Z  policy=maint-window  result=allow  session=RG-4471

      直近90日の同一アカウントの接続元: 198.51.100.0/24 のみ（41 セッション）

      収集範囲 : 保守ゲートウェイの認証と接続許可の記録
      非対象   : 通した先で行われたこと、ベンダ側の端末に残る記録

  - id: ev_011
    points_to: [jump01]
    misleading: false
    plausibility: high
    volatile: false
    occurred_at: "2026-05-19 02:38"
    summary: "jump01 から制御側のセグメントへ、深夜に接続が張られている"
    reading: |
      踏み台に残る転送セッションの記録。列の読み方:
        dst            つないだ先の住所と待ち受け口
        proto          そこで話された手順の名前
        bytes_out/in   踏み台から見た送受のバイト数
        dur            つながっていた秒数

      3389 は画面を転送してそのまま操作する口、18245 は制御系の機器へ
      設定や プログラムを送るときに使われる口である。前者は人の操作、
      後者は道具の通信という形で現れる。

      踏み台は通した接続の外形を残すが、その先の端末で何が起動したかは
      この記録の外にある。両側を突き合わせて読む。
    possibilities:
      - |-
        予定された遠隔作業が、決められた順に手順を進めた。
        承認の枠を見れば分かれる
      - |-
        入った誰かが、そこを足場にして奥へ進んだ。
        つないだ先に残る記録で分かれる
    content: |
      # jump01 転送セッション記録

      2026-05-19T02:38:05Z  session=RG-4471  user=svc_maint_v3
        dst=192.0.2.31:3389    proto=rdp        bytes_out=18,204,112  dur=4,180s
      2026-05-19T02:39:50Z  session=RG-4471
        dst=192.0.2.31:445     proto=smb        bytes_out=2,118,004   dur=96s

      同時間帯に踏み台が通した他の接続: 0 件

      192.0.2.31 の台帳上の名前: EWS-01

      収集範囲 : 踏み台が中継した接続の外形（宛先・口・量・継続時間）
      非対象   : 中継した先の端末で起動したもの、画面に表示された内容

  - id: ev_009
    points_to: [ews01]
    misleading: false
    plausibility: medium
    volatile: false
    occurred_at: "2026-05-19 02:47"
    summary: "制御セグメントの受動監視に、深夜のエンジニアリング通信が出ている"
    reading: |
      制御セグメントに置いた受動監視の装置が、流れている通信を手順ごとに
      数えた集計である。中身は保存せず、誰と誰が、どの手順で、何回話したかだけを残す。

      手順の名前の意味:
        ctrl-eng   機器へ設定やプログラムを送るときに使われる
        ctrl-data  上位が機器から値を読み続けるときに使われる
        hist-feed  履歴の収集が値を吸い上げるときに使われる

      ctrl-eng は日中の改造作業の時間帯に出るのが普通の形で、
      平常時の1日あたりの件数が右の欄に並んでいる。当日の件数と並べて読む。
      どの機器が相手だったかは出るが、何を送ったかは出ない。
    possibilities:
      - |-
        日中に終わらなかった改造の作業が、夜に持ち越された。
        予定の枠を見れば分かれる
      - |-
        道具を握った誰かが、その口を使って設定を送り込んだ。
        送られた側を見れば分かれる
      - |-
        値を読む処理が、別の手順として数え直されている。
        手順ごとの向きで分かれる
    content: |
      # 制御セグメント 受動監視 セッション集計 (2026-05-19 00:00 - 05:00)

      src            dst           proto       count   平常時の1日あたり
      192.0.2.31     192.0.2.111   ctrl-eng       12   0-3（改造作業日のみ）
      192.0.2.40     192.0.2.111   ctrl-data  86,400   86,400
      192.0.2.60     192.0.2.40    hist-feed   1,842   1,842
      192.0.2.33     192.0.2.120   ctrl-eng       27   0-40（保全作業日のみ）
      192.0.2.55     192.0.2.40    ctrl-data  12,004   11,800-12,300

      最初の ctrl-eng セッション: 2026-05-19T02:47:03Z

      台帳上の名前: 192.0.2.31=EWS-01 / 192.0.2.40=制御系の基盤サーバ /
                    192.0.2.33=登録なし / 192.0.2.55=HMI-02 /
                    192.0.2.60=履歴サーバ / 192.0.2.111=PLC-11 /
                    192.0.2.120=安全計装

      収集範囲 : 制御セグメントを流れた通信の外形（相手・手順・回数）
      非対象   : 送られた中身、セグメントの外で行われた通信

  - id: ev_003
    points_to: []
    misleading: false
    plausibility: medium
    volatile: false
    summary: "5/19 深夜は、ベンダによる年次のプルーフテストの準備が承認された枠である"
    reading: |
