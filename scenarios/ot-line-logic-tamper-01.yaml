    implication: |
      確かめないまま運転を続ければ、作っているものの逸脱が続きます。
      確かめないまま止めれば、止めた理由も、立ち上げ直したあとに
      同じことが起きないと言える理由も、どちらも示せません。
      現物は運転中にしか読み出せず、保守の状態まで落とせば取れなくなります。

  - id: q_persistence
    label: "接続を閉じた後に残るものの有無"
    question: "保守の経路を閉じても、また入られる状態か"
    resolved_by: [ev_012]
    resolution_mode: any
    critical: true
    implication: |
      残っているものを取り除かないまま運用へ戻すと、経路を閉じても
      同じところから戻ってきます。稼働中のメモリにしか残らない情報であり、
      端末を止めた時点で確かめる手段は失われます。

  - id: q_safety_integrity
    label: "安全に関わる仕組みへの影響の有無"
    question: "安全計装の設定は、要求されたとおりのまま保たれているか"
    resolved_by: [ev_006, ev_010]
    resolution_mode: all
    critical: false
    implication: |
      安全に関わる仕組みが要求どおりかどうかは、運転を続けてよいかの
      判断と、当局への届出の要否に直結します。

actions:
  # ── 調査 ──
  - id: act_jump_authlog
    label: "jump01 の認証と転送の記録を収集・解析"
    command: |
      $ rgctl export --from 2026-05-19T00:00 --to 2026-05-19T05:00 --format jsonl
        auth events    : 214
        session events : 38

      $ jq -r 'select(.result=="allow")' rg.jsonl | wc -l
        61

      $ rgctl baseline --user svc_maint_v3 --days 90 --field src
        1 range listed

      $ rgctl sessions --id RG-4471 --relay
        2 relayed connections
    group: "jump01（保守接続の踏み台）"
    phase: investigation
    type: investigate
    description: |
      保守ゲートウェイの認証ログと、そこが中継した接続の記録をまとめて取得し、
      時系列に並べる。誰が・いつ・どこから入り、その先のどこへつないだかを洗う。
    cost_minutes: 25
    investigates: [jump01]
    yields: [ev_001, ev_011]

  - id: act_ot_flow_overview
    label: "制御セグメントの通信概況を確認"
    command: |
      $ tapctl summary --iface ot-mirror --from 2026-05-19T00:00 --to 2026-05-19T05:00
        sessions aggregated : 5,204
        protocols           : 6

      $ tapctl summary --group src,dst,proto --baseline 30d
        18 rows

      $ tapctl first --proto ctrl-eng
        1 row
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      制御セグメントに置いてある受動監視の装置から、深夜帯の通信を
      相手と手順ごとに数え直す。中身は見えないが、どの機器がどの機器と
      どの手順で何回話したかが、平常時の件数と並べて出る。
    cost_minutes: 20
    investigates: [ews01, hmi02, hist01]
    yields: [ev_009]

  - id: act_permit_ledger
    label: "保全計画と作業許可の台帳を照会"
    command: |
      $ pmctl permits --site P2 --window 2026-05-18T20:00/2026-05-19T08:00
        1 record

      $ pmctl show PTW-2026-0518 --with-attachments
        1 permit, 3 attachments
    group: "作業許可と保全の記録"
    phase: investigation
    type: investigate
    description: |
      保全計画システムと作業許可の台帳を引き、この時間帯に承認済みの
      作業が入っていないかを確認する。異常かどうかを言うには、
      平常時と、予定されていた姿を知る必要がある。
    cost_minutes: 10
    investigates: []
    yields: [ev_003]

  - id: act_soc_alert_detail
    label: "監視サービスからの通知の内容を確認"
    command: |
      $ socportal fetch --ticket SOC-26-1187
        1 notification

      $ socportal rule show R-3311
        1 rule definition

      $ socportal attachments SOC-26-1187
        0 files
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      外部に委託している監視サービスの通知を開き、どの規則に一致したのか、
      根拠として何を見ているのか、一次の記録が添えられているかを確かめる。
    cost_minutes: 15
    investigates: [hmi02]
    yields: [ev_007]

  - id: act_safety_status
    label: "ライン内の立ち入りと、安全に関わる機器の状態を現場で確認"
    command: |
      $ 03:0x  当直長と構内へ。入場記録を照合
        entries 00:00-03:00 : 0

      $ safetyctl status --all
        14 e-stop / 12 interlock / 0 bypass

      $ safetyctl keyswitch --history --days 60
        1 change listed
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    tags: [safety_confirm]
    description: |
      現場へ出て、ライン内に人がいないこと、非常停止とインターロックが
      要求どおりに働く状態にあること、鍵の位置がどうなっているかを、
      当直長と一緒に確かめる。装置の状態を変える前に踏む手順そのもの。
    cost_minutes: 25
    investigates: [sis01]
    yields: [ev_010]

  - id: act_project_backup
    label: "制御プログラムの保管状態と、復旧手順・所要を確認"
    command: |
      $ vaultctl show LINE11_FILL --latest
        rev.41  verified

      $ vaultctl audit --since 2026-05-01
        write requests : 0

      $ docctl get DOC-OPS-114
        1 document

      $ opsdb restarts --line 11 --last 12
        12 records
    group: "作業許可と保全の記録"
    phase: investigation
    type: investigate
    description: |
      保管庫に入っている正規の版が健全かを確かめ、承認済みの復旧手順と、
      過去の立ち上げ直しに実際どれだけかかったかを引く。
      止めるという判断の値段を、先に把握しておく作業。
    cost_minutes: 30
    investigates: []
    yields: [ev_020]

  - id: act_jump_live_capture
    label: "jump01 に臨場して、セッションを切らずに採取"
    requires_evidence: [ev_001]
    command: |
      $ 03:1x  ラック前に到着。セッションは確立したまま
      $ winpmem_mini_x64.exe D:\ir\jump01.raw
        Acquiring physical memory ... 8,192 MB / 8,192 MB   (00:09:31)
        SHA-256 recorded

      $ vol.py -f jump01.raw windows.pslist
        87 processes
      $ vol.py -f jump01.raw windows.netscan
        23 connections
      $ vol.py -f jump01.raw windows.cmdline
        87 rows
    group: "jump01（保守接続の踏み台）"
    phase: investigation
    type: investigate
    tags: [volatile_capture]
    description: |
      踏み台のところまで行き、確立している接続を切らないままメモリを取得して、
      動いているプロセスと引数を読む。切ってしまうと、つながっている相手も、
      画面の向こうで何をしていたかも取れなくなる。
    cost_minutes: 30
    investigates: [jump01]
    yields: [ev_002]

  - id: act_egress_review
    label: "境界の通信記録と、宛先の割り当てを照会"
    requires_evidence: [ev_007]
    command: |
      $ fwctl sessions --dst 198.51.100.140 --from 2026-05-19T00:00
        3 sessions

      $ whoisctl history 198.51.100.140
        2 allocations

      $ procurement search --vendor-service weather-feed
        1 contract
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      境界のファイアウォールが残しているセッションの記録を引き、
      問題になっている宛先が過去から現在まで誰に割り当てられていたか、
      その相手と社内に取引があるかを併せて照会する。
    cost_minutes: 25
    investigates: []
    yields: [ev_008]

  - id: act_ews_toollog
    label: "ews01 のエンジニアリングツールの操作ログを解析"
    requires_evidence: [ev_011, ev_009]
    command: |
      $ engctl log export --host EWS-01 --from 2026-05-19T00:00 --to 2026-05-19T05:00
        42 entries

      $ engctl log filter --action download,edit
        3 entries

      $ engctl log baseline --host EWS-01 --days 90
        38 sessions
    group: "ews01（制御プログラム作成端末）"
    phase: investigation
    type: investigate
    description: |
      制御プログラムを作る道具が自分で残している操作ログを取り出し、
      いつ誰がどのプロジェクトを開き、どこへ何を送ったかを時系列に並べる。
    cost_minutes: 30
    investigates: [ews01]
    yields: [ev_004]

  # plc-11 への手は2つある。**片方は手元の画面から引き、片方は現地まで行く。**
  # 安いほうが返すのは正しい資料（履歴サーバが集めている範囲には何も無い）で、
  # 誤るのは読み手の一般化のほうである（5.4 / 3.4）。
  # 20分と40分の差は、この盤面で最も高くつく読み違いの値段になっている。
  - id: act_hist_query_line
    label: "plc-11 の運転記録とアラームを履歴サーバで照会"
    requires_evidence: [ev_011, ev_009]
    command: |
      $ histctl query --device PLC-11 --from 2026-05-19T00:00 --to 2026-05-19T05:00
        tags 1,842   samples 18,420,000

      $ histctl alarms --device PLC-11 --same-window
        0 rows

      $ histctl ops --device PLC-11 --same-window
        0 rows

      $ histctl stats --tag FILL_VOL --with-baseline 30d
        1 row
    group: "plc-11（充填ラインの制御装置）"
    phase: investigation
    type: investigate
    description: |
      履歴サーバに集まっている運転の記録を照会し、値の動き、しらせ、
      上位から出された操作を、平常時の幅と並べて確かめる。
      手元の画面から引くだけで、現場には出ない。
    cost_minutes: 20
    investigates: [plc-11, hist01]
    yields: [ev_014]

  - id: act_plc_onsite_capture
    label: "plc-11 に臨場して、運転させたまま中身を取り出して照合"
    requires_evidence: [ev_011, ev_009]
    command: |
      $ 03:4x  盤前に到着。ラインは運転を継続
      $ plcctl upload --device PLC-11 --all-blocks --online
        212 blocks uploaded   (00:16:22)

      $ plcctl diff --against vault:LINE11_FILL@rev.41
        212 compared

      $ plcctl counters --device PLC-11
        2 values

      $ plcctl retain dump --device PLC-11 --area DB9
        1 area dumped
    group: "plc-11（充填ラインの制御装置）"
    phase: investigation
    type: investigate
    tags: [volatile_capture]
    description: |
      装置のところまで行き、運転を止めないまま中で動いているプログラムを
      全ブロック読み出して、保管してある正規の版と突き合わせる。
      保持している領域のいまの値も一緒に取る。移動と現地作業の分だけ時間がかかる。
    cost_minutes: 40
    investigates: [plc-11]
    yields: [ev_015]

  # 仕掛けと読解を割ってある（SPEC 5.6.2 / 5.6.3）。合計 45分は割る前と同じで、
  # 変わるのは**どこに置けるか**だけ。取得だけ先に済ませておけば、
  # 現場が端末を触っても手元のイメージは変わらない（secures）。
  # 読むのは後でよく、読まずに終えることもできる —
  # その場合 q_persistence は解けないまま残る。
  - id: act_ews_mem_capture
    label: "ews01 のメモリイメージを取得して保全"
    requires_evidence: [ev_011, ev_009]
    command: |
      $ winpmem_mini_x64.exe \\EWS-01\c$\ir\ews01.raw
        Acquiring physical memory ... 16,384 MB / 16,384 MB   (00:12:08)
        SHA-256 recorded

      $ ir-evidence store --case IR-2026-0519 --file ews01.raw --hash sha256
        stored, chain-of-custody entry created
    group: "ews01（制御プログラム作成端末）"
    phase: investigation
    type: investigate
    tags: [volatile_capture]
    description: |
      稼働中の ews01 からメモリイメージを取得し、保全用の領域に収める。
      端末は動かしたまま行う。取得したイメージの解析は別の作業で、
      そちらにさらに時間がかかる。
    cost_minutes: 20
    investigates: [ews01]
    yields: []
    secures: [ev_012]

  - id: act_ews_mem_analyze
    label: "ews01 のメモリイメージを解析"
    requires_actions: [act_ews_mem_capture]
    command: |
      $ vol.py -f ews01.raw windows.pslist
        142 processes
      $ vol.py -f ews01.raw windows.netscan
        56 connections
      $ vol.py -f ews01.raw windows.registry.printkey --key "CurrentControlSet\Services"
        key dumped
      $ strings -el ews01.raw | grep -Ei 'http|sleep|tmp' | sort -u
        3,180 lines
    group: "ews01（制御プログラム作成端末）"
    phase: investigation
    type: investigate
    description: |
      保全してあるメモリイメージを解析する。実行中プロセス、確立中の接続、
      メモリ上の文字列、サービスの登録を見る。端末には触らない。
    cost_minutes: 25
    investigates: [ews01]
    yields: [ev_012]

  - id: act_ews_disk_image
    label: "ews01 を停止してディスクイメージを取得"
    requires_evidence: [ev_011, ev_009]
    command: |
      $ Stop-Computer -ComputerName EWS-01 -Force
        EWS-01: powered off

      $ ftkimager \\.\PHYSICALDRIVE0 /mnt/ir/ews01 --e01 --frag 2G
        Acquiring 512 GB ... done   (00:44:51)
        MD5/SHA1 verified

      $ mftecmd.exe -f ews01.E01 --csv /mnt/ir/out
        391,204 records
      $ AppCompatCacheParser.exe -f ews01/SYSTEM --csv /mnt/ir/out
        1,024 entries
    group: "ews01（制御プログラム作成端末）"
    phase: investigation
    type: investigate
    description: |
      ews01 をシャットダウンしてディスクを取り外し、物理イメージを取得する。
      ファイル管理表、レジストリ、実行の痕跡といったディスク上のものを
      網羅的に見られる。停止が前提なので、稼働中にしか存在しないものは取れなくなる。
    cost_minutes: 60
    investigates: [ews01]
    yields: [ev_013]
    destroys: [ev_012]

  - id: act_sis_port_log
    label: "安全計装の技術者ポートのアクセス記録を確認"
    requires_evidence: [ev_009, ev_011]
    command: |
      $ safetyctl engport log --from 2026-05-19T00:00 --to 2026-05-19T05:00
        27 entries

      $ safetyctl engport log --group src
        1 group

      $ cmdbctl lookup 192.0.2.33
        0 records
    group: "sis01（安全計装システム）"
    phase: investigation
    type: investigate
    description: |
      安全計装の設定を読み書きする口が、いつ・どこから・何に対して
      使われたかの記録を引く。接続元の住所を台帳と突き合わせる。
    cost_minutes: 25
    investigates: [sis01]
    yields: [ev_005]

  - id: act_sis_oplog
    label: "安全計装の操作履歴とアプリケーションの登録情報を照合"
    requires_evidence: [ev_005]
    command: |
      $ safetyctl oplog --from 2026-05-19T00:00 --to 2026-05-19T05:00 --by op
        2 groups

      $ safetyctl app show
        1 application record

      $ safetyctl keyswitch --history --days 90
        1 change listed

      $ docctl get F-12 --render-index
        27 steps
    group: "sis01（安全計装システム）"
    phase: investigation
    type: investigate
    description: |
      安全計装が自分で残している操作の履歴を、読み出しと書き込みに分けて数え、
      いま動いているアプリケーションの登録情報と、年次点検の手順書の項番を
      突き合わせる。
    cost_minutes: 30
    investigates: [sis01]
    yields: [ev_006]

  - id: act_hmi_triage
    label: "hmi02 をトリアージ"
    requires_evidence: [ev_007]
    command: |
      $ irtriage.exe --host HMI-02 --collect autoruns,shimcache,tasks,persistence
        autoruns    : 16 entries
        shimcache   : 208 entries
        tasks       : 44 entries
        persistence : 0 findings
        (00:17:05)

      $ irtriage.exe --host HMI-02 --timeline --from 2026-05-19T02:00 --to 2026-05-19T05:00
        9 events
    group: "hmi02（監視操作端末）"
    phase: investigation
    type: investigate
    description: |
      hmi02 の自動起動項目、直近の実行の痕跡、スケジュールタスク、
      画面部品の構成を自動収集ツールで一括取得して確認する。
    cost_minutes: 25
    investigates: [hmi02]
    yields: [ev_016]

  - id: act_hist_integrity
    label: "hist01 に蓄えられた記録の整合性を確認"
    requires_evidence: [ev_009]
    command: |
      $ histctl verify --scope store --full
        checksum ... OK   corrupt 0

      $ histctl writers --days 30
        4 registered

      $ histctl retention show
        2 policies

      $ histctl adminlog --days 30
        0 entries
    group: "hist01（生産履歴サーバ）"
    phase: investigation
    type: investigate
    description: |
      履歴サーバに蓄えられている記録そのものが壊れていないか、
      登録された経路以外から書き込まれていないか、保持の設定や
      管理者の操作に変化がないかを確かめる。
    cost_minutes: 30
    investigates: [hist01]
    yields: [ev_017]

  - id: act_ctl_audit
    label: "ctl01 の変更履歴と権限を確認"
    requires_evidence: [ev_009]
    command: |
      $ ctlctl config diff --baseline corp-ot-std
        0 differences

      $ ctlctl accounts audit --days 30
        0 changes

      $ ctlctl tagdef history --last 5
        5 records

      $ ctlctl timesync status --all
        7 nodes
    group: "ctl01（制御系の基盤サーバ）"
    phase: investigation
    type: investigate
    description: |
      制御系の土台になっているサーバの設定・アカウント・サービスの
      変更履歴を照会する。攻撃者が後で戻れるように権限を足していないかを見る。
    cost_minutes: 25
    investigates: [ctl01]
    yields: [ev_019]

  - id: act_shift_interview
    label: "夜勤の当番に聞き取り"
    requires_evidence: [ev_009]
    command: |
      $ 03:3x  現場にて聞き取り（製造課 夜勤当番 1名）
        質問 6 / 回答 6

      $ opsdb shiftlog --line 11 --from 2026-05-18T22:00
        3 entries
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      その時間帯にラインを見ていた当番に、画面の見え方や、
      設定に触ったかどうか、構内で見慣れない人を見なかったかを聞く。
      夜勤は朝で上がるので、同じ人にもう一度聞ける時間には限りがある。
    cost_minutes: 20
    investigates: []
    yields: [ev_018]

  # ── 現場への指示 ──
  # 記録を取りに行くのではなく、記録が消えるのを止めに行く手。
  # 効くのは打ち終わった時刻から先だけで、既に起きたことには効かない。
  # 速いプレイなら 15分を払う意味は無い（世界が追いつく前に終わる）。
  # 遅くなると分かっているときだけ得になる、自分の速さへの賭け。
  - id: act_freeze_notice
    label: "現場とベンダに、状態を変えないよう周知する"
    command: |
      $ mail -s "[重要] 対応中の操作制限について" ops-all@example.com vendor-oncall@example.org < notice.txt
        delivered: 96 recipients

      $ helpdesk-cli script set --id first-response --file notice-hd.txt
        1 script updated

      $ opsboard post --board P2-line11 --pin
        pinned
    group: "現場への指示"
    phase: investigation
    type: communicate
    description: |
      製造課・保全・ベンダの当番へ、ラインの立ち上げ直し、端末の再起動や
      電源断、接続の切断を行わないよう周知する。夜勤の当番には、
      こちらの用が済むまで残ってもらう。ヘルプデスクと当直日誌の一次応答も
      同じ文面に差し替え、問い合わせへの回答を揃える。
      調査そのものは1ミリも進まない。
    cost_minutes: 15
    prevents: [tl_shift_change, tl_vendor_disconnect, tl_terminal_reboot, tl_line_restart]

  # ── 封じ込め・対応 ──
  - id: act_block_vendor_path
    label: "保守ベンダからの接続経路を境界で閉じる"
    command: |
      $ fwctl rule add --name block-vendor-vpn --src 203.0.113.0/24 --action deny --log
        rule installed (edge-fw-01, edge-fw-02)

      $ vpnctl tunnel disable --peer vendor-maint
        tunnel down  (00:01:12)

        踏み台は動作を継続。外からの入口だけを閉じた。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      ベンダ側から入ってくる回線を境界で落とす。踏み台は動いたままで、
      外からの入口だけが閉じる。
    cost_minutes: 10
    targets: [jump01]
    investigates: []
    side_effects:
      business_impact: false

  - id: act_isolate_jump01
    label: "jump01 を制御ネットワークから切り離す"
    command: |
      $ swctl port disable --switch sw-dmz-01 --port Gi1/0/8
        port down  (00:00:41)

        踏み台は動作を継続。通信だけを止めた。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      jump01 をネットワークから切り離す。機器は動いたまま、通信だけを止める。
      ベンダの遠隔作業はこの間できなくなる。
    cost_minutes: 10
    targets: [jump01]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_isolate_ews01
    label: "ews01 を制御ネットワークから切り離す"
    command: |
      $ swctl port disable --switch sw-ot-02 --port Gi1/0/3
        port down  (00:00:38)

        端末は動作を継続。通信だけを止めた。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      ews01 をネットワークから切り離す。端末は動いたまま、通信だけを止める。
      この日に予定されている他ラインの改造作業は、その間できなくなる。
    cost_minutes: 10
    targets: [ews01]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_isolate_hmi02
    label: "hmi02 を制御ネットワークから切り離す"
    command: |
      $ swctl port disable --switch sw-ot-01 --port Gi1/0/12
        port down  (00:00:35)

        端末は動作を継続。オペレータの画面は更新されなくなる。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      hmi02 をネットワークから切り離す。端末は動いたまま、通信だけを止める。
      オペレータからラインの値が見えなくなる。
    cost_minutes: 10
    targets: [hmi02]
    investigates: []
    side_effects:
      business_impact: true

  # plc-11 に対する手は**3つある**。ここが対応フェーズの取捨選択の中心で、
  # 3つの方針が3つの違う答えを出す唯一の場所である。
  #
  #   経路を絞る      25分  運転は続く・生産は続く・保持している値が残る
  #   運転だけを止める 35分  通電したまま・生産は止まる・保持している値が残る
  #   保守の状態まで   45分  指令を受け付けない・生産は止まる・値は取れなくなる
  #
  # **いちばん安いのが「経路を絞る」であること**が要る。仕掛品を抜きながら
  # ラインを落とす手順は、経路を1つ塞ぐより必ず長くかかる。値段の順序が
  # 逆になっていると、方針を知らない学習者は「安いから」で生産を止める。
  #
  # 生産継続は重みで1番目を選び、残る2つは制約で選ばされる。
  # 重みで選ばせられるのは1本だけである — 数時間ぶんの生産影響は、
  # 数十分の被害差より必ず大きいので、重みを触っても順位は動かない（SPEC 5.3）。
  # 安全計装への手は2つある。**技術者ポートへの経路を塞ぐことと、
  # 安全計装そのものを止めることは別の手である。** 前者は安全の機能を
  # 生かしたまま書き換えの口だけを閉じるので、運転は続く。
  # 後者はラインを運転できない状態へ落とす。誤導（ev_005）に乗った学習者に
  # 逃げ道を1本残しておかないと、罠の代価が「破滅か放置か」の二択になる
  - id: act_isolate_sis01
    label: "安全計装の技術者ポートを、セルの機器で塞ぐ"
    command: |
      $ cellctl acl add --dst 192.0.2.120 --proto tcp --dport 18245 \
          --allow-src none --action deny --log
        acl applied (cell-sw-11)  entries: 1

      $ safetyctl status --all
        14 e-stop / 12 interlock / 0 bypass
        安全の機能は稼働を継続。設定を読み書きする口だけを閉じた。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      安全計装の設定を読み書きする口へ向かう通信を、セルの機器のアクセス制御で
      塞ぐ。安全の機能は動いたままで、ラインの運転も続く。
    cost_minutes: 10
    targets: [sis01]
    investigates: []
    side_effects:
      business_impact: false

  - id: act_fence_plc11
    label: "plc-11 へ書き込める経路を、セルの機器で絞る"
    command: |
      $ chgctl request --type acl --scope cell-11 --window now --approver oncall
        CHG-2026-0441  emergency  approved  (00:14:40)

      $ cellctl acl add --dst 192.0.2.111 --proto tcp --dport 18245 \
          --allow-src none --action deny --log
        acl applied (cell-sw-11)  entries: 1

      $ plcctl ping --device PLC-11 --from ews-net
        write path : blocked
        ライン は運転を継続。上位からの読み取りに変化なし。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      plc-11 へ設定やプログラムを送れる経路を、セルの機器のアクセス制御で絞る。
      装置は運転を続け、生産も止まらない。深夜帯の構成変更なので、
      変更管理の承認と実機での確認に時間がかかる。
    cost_minutes: 25
    targets: [plc-11]
    investigates: []
    destroys: []
    side_effects:
      business_impact: false

  - id: act_planned_stop_plc11
    label: "正規の手順でラインを計画停止し、plc-11 は通電したまま運転を止める"
    command: |
      $ opsctl line stop --line 11 --mode planned --drain
        draining in-process items ... done
        line stopped  (00:18:20)

      $ plcctl mode --device PLC-11 --show
        mode : RUN (no scan cycle; outputs held)
        装置は通電したまま。保持している領域は読み出せる。
    group: "運転を止める"
    phase: response
    type: contain
    description: |
      承認された手順でラインを計画停止し、装置は通電したままで運転だけを止める。
      仕掛品を抜いてから止めるので、その分の時間がかかる。
      生産はここで止まり、立ち上げ直すまで戻らない。
    cost_minutes: 35
    targets: [plc-11]
    investigates: []
    destroys: []
    side_effects:
      business_impact: true

  - id: act_safe_state_plc11
    label: "計画停止のうえ、plc-11 を指令を受け付けない保守の状態まで落とす"
    command: |
      $ opsctl line stop --line 11 --mode planned --drain
        line stopped  (00:18:20)

      $ plcctl mode --device PLC-11 --set STOP --keyswitch PROG
        mode : STOP
        retentive area : cleared on mode change
        装置は指令を受け付けない。保持していた値は初期化された。
    group: "装置を止める"
    phase: response
    type: contain
    description: |
      ラインを計画停止させたうえで、plc-11 を指令を受け付けない保守の状態まで
      落とす。外から設定やプログラムを送り込むことはできなくなる。
      保持していた領域の値は、この操作で初期化される。
    cost_minutes: 45
    targets: [plc-11]
    investigates: []
    destroys: [ev_015]
    side_effects:
      business_impact: true

  - id: act_stop_sis01
    label: "安全計装を停止して構成を取り直す"
    command: |
      $ safetyctl shutdown --confirm --reason ir
        safety system: OFFLINE  (00:03:20)

        ラインは運転を継続できない。全系統が停止条件に入った。
    group: "装置を止める"
    phase: response
    type: contain
    description: |
      安全計装を止めて、中の構成を静止した状態で取り直す。
      止めている間、ラインは運転を続けられない。
    cost_minutes: 15
    targets: [sis01]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_stop_ctl01
    label: "ctl01 を停止する"
    command: |
      $ Stop-Computer -ComputerName CTL01 -Force
        CTL01: powered off  (00:04:10)

        時刻同期とタグ定義の配布が停止。ぶら下がる機器が実質停止。
    group: "装置を止める"
    phase: response
    type: contain
    description: |
      制御系の土台になっているサーバを停止する。
      これにぶら下がっているものは、その間使えなくなる。
    cost_minutes: 15
    targets: [ctl01]
    investigates: []
    side_effects:
      business_impact: true

  # 3つ目の束。**止めることと、居座られた状態を消すことは別の作業である。**
  # 経路を閉じれば攻撃者の手は届かなくなるが、端末に残された登録は
  # そのままなので、端末を運用へ戻した瞬間に元へ戻る。
  # この束だけが `eradicates` を持ち、5.8 の減衰を on_partial から
  # on_correct_containment へ動かす。
  - id: act_restore_ews01
    label: "ews01 の自動実行まわりの登録を標準構成に戻す"
    command: |
      $ edrctl remediate --host EWS-01 --scope autorun,service --restore-baseline
        Services         : 1 entry reverted
        Run keys         : baseline matched
        Scheduled Tasks  : baseline matched
        applied  (00:07:02)

      $ edrctl scan --host EWS-01 --profile deep --verify
        scanned 198,440 objects   (00:31:10)
        端末は動作を継続。予定されている改造作業はそのまま進められる。
    group: "元の状態に戻す"
    phase: response
    type: contain
    description: |
      ews01 のサービスと自動実行まわりの登録を、標準構成と突き合わせて戻す。
      端末は動いたままで、この日の作業も止まらない。
      戻した先が本当に標準どおりかを確かめる深いスキャンに時間がかかる。
    cost_minutes: 40
    targets: [ews01]
    eradicates: [ews01]
    investigates: []
    destroys: []
    side_effects:
      business_impact: false

  - id: act_rebuild_ews01
    label: "ews01 を初期化して標準構成で復帰させる"
    command: |
      $ imgctl deploy --host EWS-01 --image ot-eng-std --wipe
        disk 0: secure erase done  (00:12:40)
        image applied, 1 partition, 58 GB

      $ engctl provision --host EWS-01 --projects from-vault
        projects restored from vault  (00:14:05)
        端末は標準構成で起動。作業の環境は組み直しになる。
    group: "元の状態に戻す"
    phase: response
    type: contain
    description: |
      ews01 のディスクを消去して標準イメージを入れ直し、
      保管庫からプロジェクトを戻す。流し込みは自動化されているので短い。
      作業の間その端末は使えない。
    cost_minutes: 30
    targets: [ews01]
    eradicates: [ews01]
    investigates: []
    destroys: [ev_012, ev_013]
    side_effects:
      business_impact: true

  # **囮**。`eradicates` を持つ手が ews01 の2つだけだったとき、
  # この束を読むだけで「取り除くものが残っているのはどれか」が分かった。
  # 切り離す束には無実の端末が混ざっているのに、取り除く束だけが
  # ground_truth.persistence の写しになる（SPEC 5.6 / v1.45）。
  # 誤導（ev_007 の通知）に乗った学習者は、この端末についても
  # 同じことをしたくなる。40分は返ってこない。
  - id: act_restore_hmi02
    label: "hmi02 の自動実行まわりの登録を標準構成に戻す"
    command: |
      $ edrctl remediate --host HMI-02 --scope autorun,service --restore-baseline
        Services         : baseline matched
        Run keys         : baseline matched
        Scheduled Tasks  : 1 entry reverted
        applied  (00:06:20)

      $ edrctl scan --host HMI-02 --profile deep --verify
        scanned 151,020 objects   (00:32:44)
        端末は動作を継続。オペレータはそのまま画面を見られる。
    group: "元の状態に戻す"
    phase: response
    type: contain
    description: |
      hmi02 のサービスと自動実行まわりの登録を、標準構成と突き合わせて戻す。
      端末は動いたままで、オペレータの操作も止まらない。
      戻した先が本当に標準どおりかを確かめる深いスキャンに時間がかかる。
    cost_minutes: 40
    targets: [hmi02]
    eradicates: [hmi02]
    investigates: []
    destroys: []
    side_effects:
      business_impact: false

  # ── 復旧（SPEC 5.11）。**止めたものを業務に戻す手。**
  #    並びは依存の順にしてある — 安全計装が戻るまでラインは運転できず、
  #    基盤サーバが戻るまでぶら下がる端末は実質使えない。
  #    順を違えて押しても、依存で引き直されて元の木阿弥になる
  - id: act_resume_sis01
    label: "安全計装を起動し直して、運転の条件を戻す"
    type: restore
    phase: response
    cost_minutes: 20
    group: "業務に戻す"
    restores: [sis01]
    command: |
      $ safetyctl start --confirm
        safety system: ONLINE   14 e-stop / 12 interlock / 0 bypass  (00:03:40)

      $ safetyctl prooftest --scope startup
        24/24 passed  (00:12:10)
    description: |
      安全計装を起動し直し、立ち上げ時の確認を通す。
      これが戻らない限り、ラインは運転を続けられない。

  - id: act_resume_ctl01
    label: "ctl01 を起動し直して業務に戻す"
    type: restore
    phase: response
    cost_minutes: 20
    group: "業務に戻す"
    restores: [ctl01]
    command: |
      $ Start-VM -Name CTL01 -Wait
        CTL01: running   services 33/33  (00:05:20)

      $ ctlctl health --all
        time sync ok   tag catalog ok   auth ok   (00:03:10)
    description: |
      制御系の土台になっているサーバを起動し直す。
      ぶら下がっている資産は、これが戻るまで実質使えない。

  - id: act_resume_jump01
    label: "jump01 を制御ネットワークに戻す"
    type: restore
    phase: response
    cost_minutes: 10
    group: "業務に戻す"
    restores: [jump01]
    command: |
      $ swctl port enable --switch sw-dmz-01 --port Gi1/0/8
        port up  (00:00:35)
    description: |
      踏み台の通信を元に戻す。ベンダの遠隔作業が再びできるようになる。

  - id: act_resume_ews01
    label: "ews01 を制御ネットワークに戻す"
    type: restore
    phase: response
    cost_minutes: 10
    group: "業務に戻す"
    restores: [ews01]
    command: |
      $ swctl port enable --switch sw-ot-02 --port Gi1/0/3
        port up  (00:00:33)
    description: |
      端末の通信を元に戻す。予定されている他ラインの改造作業を再開できる。

  - id: act_resume_hmi02
    label: "hmi02 を制御ネットワークに戻す"
    type: restore
    phase: response
    cost_minutes: 10
    group: "業務に戻す"
    restores: [hmi02]
    command: |
      $ swctl port enable --switch sw-ot-01 --port Gi1/0/12
        port up  (00:00:31)
    description: |
      端末の通信を元に戻す。オペレータが再びラインの値を見られるようになる。

  # **この盤面でいちばん高い戻す手である。** 止めたラインは押した瞬間には
  # 戻らない — 立ち上げ直しに要る時間が、そのまま生産の止まっている時間になる。
  # 値段が安いと「とりあえず止めて、あとで戻す」が無料の選択肢になり、
  # ラインを止めるかどうかという、この盤面の中心の判断が消える
  - id: act_restart_line11
    label: "ラインを立ち上げ直して運転に戻す"
    type: restore
    phase: response
    cost_minutes: 210
    group: "業務に戻す"
    restores: [plc-11]
    command: |
      $ opsctl line start --line 11 --mode normal
        interlock check   : ok
        feed purge        : 62 min
        temperature ramp  : 94 min
        first-article     : 3 lots discarded
        line running  (03:26:40)
    description: |
      止めた充填ラインを立ち上げ直して運転に戻す。原料の入れ替えと
      温度の立ち上げに時間がかかり、立ち上がりの分は製品にならない。
      戻るまでの間、生産は止まったままである。

  # ── 再発防止（SPEC 5.12）。**盤面の上では何も起きない。**
  #    効くのは演習が終わったあとで、見えるのは講評の破線だけである
  - id: act_harden_jump01
    label: "保守接続の追加確認を、接続元によらず必ず求めるようにする"
    type: harden
    phase: response
    cost_minutes: 25
    group: "入り口を塞ぐ"
    hardens: [jump01]
    command: |
      $ idpctl policy set --app maint-gw --mfa always --trusted-network off
        applied   sessions revoked 3   (00:04:10)
    description: |
      保守接続の認証で、接続元の場所による免除をやめ、追加の確認を
      常に求める設定にする。ベンダの遠隔作業の手順は変わらない。

  - id: act_harden_ews01
    label: "ews01 から装置へ送る操作を、承認された作業のときだけに限る"
    type: harden
    phase: response
    cost_minutes: 25
    group: "入り口を塞ぐ"
    hardens: [ews01]
    command: |
      $ cellctl acl add --dst 192.0.2.0/24 --proto tcp --dport 18245 \
          --allow-src ews01 --require-change-window --action allow --log
        acl applied (cell-sw-11)  entries: 1   (00:03:50)
    description: |
      エンジニアリング端末から装置へプログラムや設定を送れる時間帯を、
      承認された作業の枠に限る。枠の中の作業は今までどおり行える。

  - id: act_harden_hmi02
    label: "hmi02 の外向き通信を、許可した宛先だけに限る"
    type: harden
    phase: response
    cost_minutes: 20
    group: "入り口を塞ぐ"
    hardens: [hmi02]
    command: |
      $ fwctl policy set --src HMI-02 --egress allowlist --default deny --log
        applied   entries 4   (00:02:40)
    description: |
      監視操作端末から外へ出る通信を、許可した宛先だけに限る。
      画面の表示に使っている取得先は許可に含める。


# フェーズは2つ。不可逆な移行は、必ず判断を伴うものだけにする（SPEC 3.8）。
phases:
  - id: investigation
    label: "調査"
    advance_label: "対応フェーズに移る"

  - id: response
    label: "封じ込め・対応"
    advance_label: null
    requires_assessment: true

# 時間が経つと向こうから入ってくること（SPEC 5.10）。
# どれも学習者に不利にしか働かない。奪うか、費用の変化を告げるか。
# 誰が悪いという話ではない。品質を守ろうとする判断も、重い端末の
# 立ち上げ直しも、それ自体は正しい行動である。
# 制御の現場で消える情報は、そういう正しさで普通に消える。
timeline:
  - id: tl_accel
    at_minutes: 220
    label: "品質保証から連絡"
    text: |
      「出荷前の抜き取りで、規格を外れる個体が続けて出ています。
        作り直しに回す分が、さっきから増え続けています。」
    heralds: acceleration

  - id: tl_shift_change
    at_minutes: 255
    label: "製造課から連絡"
    text: |
      「夜勤の当番が上がりました。次の当番へは口頭で渡しただけなので、
        細かいところはもう分かりません。」
    destroys: [ev_018]
    averted_label: "製造課から連絡"
    averted_text: |
      「夜勤の当番が上がる時間ですが、先の周知が回っていたので、
        そちらの用が済むまで残ってもらっています。」

  - id: tl_vendor_disconnect
    at_minutes: 290
    label: "ベンダの当番から折り返し"
    text: |
      「先ほどまでつないでいた接続は、こちらで切りました。
        作業を続ける予定はありません。」
    destroys: [ev_002]
    averted_label: "ベンダの当番から折り返し"
    averted_text: |
      「接続を切ろうとしたのですが、先の周知が届いていたので、
        つないだまま手を止めています。そのままにしてあります。」

  - id: tl_terminal_reboot
    at_minutes: 320
    label: "保全の担当から連絡"
    text: |
      「動きが重くなっている端末を、順番に立ち上げ直しています。
        朝の作業までに戻しておきたいので。」
    destroys: [ev_012]
    averted_label: "保全の担当から連絡"
    averted_text: |
      「端末を立ち上げ直してよいかという問い合わせが来ています。
        先の周知どおり、そのままにしておくよう返しています。」

  - id: tl_line_restart
    at_minutes: 345
    label: "製造課から連絡"
    text: |
      「ラインを一度止めて、立ち上げ直しました。
        このまま流し続けるわけにいかないと判断しました。」
    destroys: [ev_015]
    averted_label: "製造課から連絡"
    averted_text: |
      「ラインを立ち上げ直すという話が出たのですが、先の周知が
        回っていたので止めました。そのままの状態で預かっています。」

damage:
  model: exponential
  params:
    base: 300.0
    rate: 0.15
  acceleration:
    threshold_minutes: 255
    multiplier: 2.5
  containment_effect:
    on_correct_containment: 0.2
    on_partial: 0.6
    on_incorrect: 1.0

scoring:
  fact_layer:
    metrics:
      - id: assessment_precision
        label: "被疑判定の適合率"
        direction: higher_is_better
      - id: assessment_recall
        label: "被疑判定の再現率"
        direction: higher_is_better
      - id: assessment_support
        label: "名指しの裏付け"
        direction: higher_is_better
      - id: unresolved_questions
        label: "未解消論点を抱えたままの判断"
        label_good: "論点を解消してからの判断"
        direction: lower_is_better
    weights:
      assessment_precision:  0.20
      assessment_recall:     0.20
      assessment_support:    0.20
      unresolved_questions:  0.40

  policy_layer:
    constraint_penalty: 0.15

  consequence_layer:
    display_only:
      - elapsed_minutes
      - total_damage
      - business_impact
      - evidence_preserved
      - containment_completeness
    business_impact_horizon_minutes: 480
    normalization:
      # 巧いプレイが**入り口を塞ぐところまで**行くようになり（5.12）、
      # 復旧地平が半分になって被害が 4,800 → 2,417 に下がった。
      # 8.2 手順7 どおり再導出する（v1.71）。**手で書いた数字は、
      # 盤面を変えた瞬間に腐る。**
      #
      # **2つの判定が逆向きに引っ張る。** 帯（巧いプレイが 2〜3割）は
      # 天井を下げたがり、「何も止めないプレイは正しく止めたプレイに負ける」は
      # 天井を上げたがる — 下げすぎると何も止めないプレイが帯の外に出て 0 で
      # 並び、被害の差が消えるからである。両方が通るのは 11,000〜12,085 の
      # 窓だけで、その真ん中を取っている
      total_damage:             { worst: 11500, best: 0 }
      business_impact:          { worst: 5200,  best: 0 }
      evidence_preserved:       { worst: 0.75,  best: 1.0 }
      containment_completeness: { worst: 0.0,   best: 1.0 }

  composite:
    method: weighted_sum
    fact_weight: 0.7

retrospective:
  minimal_path:
    compute: true
    label: "事後的に見た最短経路"
    disclaimer: |
      これは答えを知った上で算出した参照値です。
      実際の対応では、外れを引くことは避けられません。
      この差分は無駄ではなく、不確実性の代価です。
  counterfactuals:
    compute: true
  unresolved_review:
    compute: true

debrief:
  reveal_ground_truth: true
  misleading_explanations:
    ev_005: |
      安全計装の技術者ポートに残っていた 27件は、ベンダによる年次
      プルーフテストの準備です。作業は 5/12 に承認されており（PTW-2026-0518）、
      読み出しの並びは点検手順書の項番の順そのままです。

      ここは、台帳だけでは閉じません。台帳が言うのは「その時間帯に作業が
      承認されていた」ことであって、記録に残ったこの動きがその作業だった
      ことではありません。保守の枠に紛れて動く例は実務にあります。

      安全計装の側の操作履歴だけでも閉じません。設定を読み出すだけの動きは、
      作業の準備でも、下調べでも、同じ形で記録されます。

      枠（承認された作業と、その手順書）と、中身（書き込み 0 件、
      鍵は RUN のまま、読んだ対象の並びが手順書の項番と同じ）が
      両方揃って初めて、この 27件は候補から外れます。

      なお 192.0.2.33 が台帳に登録されていないことは本当の不備です。
      持ち込み機器の登録が運用から漏れていました。攻撃とは別の話です。
    ev_007: |
      監視サービスからの通知は、規則どおりに発報しています。
      嘘は書かれていません。

      誤っていたのは、規則が抱えている前提のほうです。
      198.51.100.140 は 2026-02-10 まで別の事業者に割り当てられており、
      脅威情報の一覧に載ったのは 2025-11-04、つまり移る前の持ち主に
      ついての記録でした。いまの割り当て先は気象情報の配信で、
      御社は 2026-03 から購読しています。hmi02 の画面部品「天候」が
      毎時そこへ取りに行っていました。

      委託先は、こちらの環境の一次の記録を持っていません。
      通知に添付が無いことを、通知自身が書いています。
      出所の階層を一段降りて境界の記録を引けば、送信 1.2KB・
      受信 48KB・2秒・毎時ちょうど、という形がそのまま出てきます。
    ev_014: |
      履歴サーバの照会結果そのものは正しく、嘘は書かれていません。
      登録されているタグには、本当に何も出ていません。

      誤っていたのは資料ではなく、そこからの一般化です。
      「記録に出ていない」は「装置は触られていない」ではありません。
      収集対象の欄が「登録されているタグ」と「上位から出された操作」を
      指しており、非対象の欄に「装置の中のロジックの構成」と
      「上位を通さずに直接入れられた変更」が並んでいます。

      仕込まれていたのは、上位へ返す値を実測から指令値へ差し替える
      1行でした。上位が受け取る値は指令どおりに揃い、
      散らばりはむしろ普段より小さくなります。資料はそれを
      標準偏差 0.3（平常時 3.8 - 4.6）として、そのまま書いていました。

      収集の範囲の外で起きたことは、盤面でいちばん静かに見えます。
      0 件は、何も起きていないことと、そこを見ていないことの
      どちらでも同じ数字になります。
  key_lessons:
    - "止めることが、常に安全側とは限らない。制御の現場では、止め方そのものが人と設備の危険になりうるし、止めた代償は数時間の立ち上げ直しと仕掛品の廃棄として必ず払われる。"
    - "「止めた」と呼ばれる手は1つではない。経路を絞ること、運転を止めること、指令を受け付けない状態まで落とすことは別の手で、残るものと諦めるものがそれぞれ違う。"
    - "記録に出ていないことと、起きていないことは別である。資料が自分で書いている収集対象と非対象の欄が、どちらなのかを言っている。"
    - "外部の監視サービスや脅威情報の一覧は二次の情報である。いつの事実を記録したものかを見て、一次の記録まで一段降りる。"
    - "承認された作業の枠は、その時間帯に作業が承認されていたことしか言わない。記録された動きがその作業だったかどうかは、動きを受けた側の中身を見ないと決まらない。"
    - "上位に見えている値は、装置が返すと決めた値である。装置の中で何を返すことになっているかは、現物を読み出すまで分からない。"
    - "疑いすぎる失敗は判定に現れるが、疑わなかった失敗は何も出てこない。名指ししなかった装置は、講評まで誰も話題にしない。"
    - "入口を塞ぐことと、居座られた状態を取り除くことは別の作業である。前者だけでは、その端末を運用へ戻したときに元へ戻る。"
    - "稼働中にしか読めないものがある。装置が保持している値も、端末のメモリも、止めた時点で取れなくなる。取得の順序そのものが判断である。"
    - "安全に関わる仕組みを止めることは、封じ込めではない。それを止めた時点で、ラインを安全な側へ倒す最後の仕組みが無くなる。"
  replay_suggestions:
    - policy: safety_first
      hint: |
        同じ状況を「安全最優先」で解くと、装置に取れる手が変わります。
        止める前に現場を確認する手順が要り、経路を絞るだけ・運転を止めるだけでは
        足りなくなります。安全計装に手を出すことは、どの根拠があっても取れません。
    - policy: evidence_preservation
      hint: |
        「証拠保全最優先」では、止める資産ごとに、その資産から消える情報を
        先に取る必要があります。取るための時間がそのまま被害に乗るので、
        被害は伸びます。
