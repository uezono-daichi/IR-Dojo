debrief:
  reveal_ground_truth: true
  misleading_explanations:
    ev_007: |
      ws-107 の外部通信は、毎日 02:15 に起動するクラウドバックアップの
      定時ジョブです。転送量も宛先も直近30日と変わっていません。
      攻撃の発生時刻と近かったため、攻撃の痕跡に見えました。
    ev_005: |
      ws-113 の管理者ログオンは、承認済みの定例パッチ適用作業
      (CHG-2026-0271) によるものです。作業時間帯は 02:00-04:00 で
      承認されており、多数のネットワークログオンは想定内の挙動です。

      ただし、台帳だけではここまで言えません。台帳が言うのは
      「その時間帯に作業が承認されていた」ことであって、
      記録されたログオンがその作業だったことではないからです。
      攻撃者が保守作業の時間帯に紛れるのは実務でよくある形です。
      枠（台帳）と中身（端末に残った実行履歴）の両方が揃って、
      初めてこの端末を候補から外せます。
    ev_020: |
      管理コンソールの照会結果そのものは正しく、嘘は書かれていません。
      コンソールが保持している転送済みの分には、本当に何もありません。

      誤っていたのは資料ではなく、そこからの一般化です。
      「コンソールに無い」は「この端末に無い」ではありません。
      最終受信の欄が 2026-03-02 を指しており、他のホストが
      3/14 の未明まで届いているのに対して 12日分の空白があります。
      その空白の中で何が起きたかは、コンソールには載りようがありません。

      収集の経路が落ちている資産は、盤面でいちばん静かに見えます。
      新規 0 件は、何も起きていないことと、何も届いていないことの
      どちらでも同じ数字になります。
  key_lessons:
    - "時刻の近さは関係の証明にならない。同時刻の事象がすべて同じ原因とは限らない。"
    - "通常時の姿を知らないと、異常かどうかは判定できない。台帳や運用設定は最も安価な棄却手段である。"
    - "承認済みの作業予定は「予定されていた」ことしか言わない。その時間帯に起きたことが予定どおりだったかは、当の資産を見るまで分からない。否定の材料は、1つで閉じるとは限らない。"
    - "無関係な資産を止めることには値段がある。止めた先の仕事は、こちらの都合とは無関係に止まる。"
    - "「見つからなかった」には二通りある。そこに無かったのか、そこを見ていなかったのか。資料が自分で書いている収集範囲と最終受信が、どちらなのかを言っている。"
    - "疑いすぎる失敗は判定に現れるが、疑わなかった失敗は何も出てこない。名指ししなかった資産は、講評まで誰も話題にしない。"
    - "侵入経路が分からないまま封じ込めても、同じ経路から再び入られる。"
    - "通信を止めることと、端末を元の状態に戻すことは別の作業である。前者だけでは、その端末を業務に戻したときに元へ戻る。"
    - "揮発性の情報は封じ込めで失われる。取得の順序そのものが判断である。"
    - "経路を塞ぐことと、その資産を業務から降ろすことと、電源を落とすことは別の手である。どれも「止めた」と呼ばれるが、残るものと諦めるものがそれぞれ違う。"
  replay_suggestions:
    # **この文面は v1.39 まで嘘をついていた。** 「その分だけ被害が伸びます」と
    # 書いてあったが、実測は 93 / 93 / 94 で伸びていなかった。当時の証拠保全は
    # 盤面のどこかで揮発性を1つ取れば済む制約しか持たず、封じ込めの順序も
    # 手も変わらなかったためである（v1.40 で制約を入れ替えて実測 6,188 vs 5,594）。
    - policy: evidence_preservation
      hint: |
        同じ状況を「証拠保全最優先」で解くと、fs01 に取れる手が変わります。
        止める資産ごとに、その資産から先に取る必要があり、
        業務に載せたままにも、電源を落としてもいけません。
        取るための時間がそのまま被害に乗るので、被害は伸びます。
    - policy: damage_minimization
      hint: |
        「被害最小化最優先」では、根拠が固まる前に止める判断が許容されます。
        同じ行動列でも評価が変わることを確かめてください。
