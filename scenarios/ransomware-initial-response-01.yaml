        PID / PPID     プロセスIDと親プロセスID。親子関係から起動経路を辿れる
        services.exe   サービス制御マネージャ。サービスとして登録された
                       実行ファイルは、この配下で起動する
        ESTABLISHED    その時点で確立していた TCP 接続

      HKLM\SYSTEM\CurrentControlSet\Services 配下の登録は、
      利用者のログオンを待たずに端末の起動時点で走る。HKCU 配下の Run キーとは、
      動き出す時点も、書き込むのに要る権限も違う。

      EventID 7045 はサービスの新規インストールの記録である。
      端末のローカルに書かれるイベントログは、転送の設定とは関係なく
      端末上には残り続ける。
    content: |
      # ws-055 現地採取（端末は稼働させたまま）

      [プロセス]
      PID 3208  svchost32.exe   PPID 704 (services.exe)  Start 02:29:44
        接続中: 198.51.100.77:443  (ESTABLISHED)

      [サービス登録]
      HKLM\SYSTEM\CurrentControlSet\Services\WinDefendSvcHost
        ImagePath : C:\Windows\Temp\svchost32.exe
        Start     : 2 (自動起動)
        書き込み時刻: 2026-03-14T02:29:41Z

      [端末のローカルに残っていたセキュリティ／システムログ]
        EventID 4624  2026-03-14T02:29:33Z  CORP\sato  LogonType 3 (Network)
          IpAddress 192.0.2.42
        EventID 7045  2026-03-14T02:29:41Z  ServiceName WinDefendSvcHost

      取得範囲 : 物理メモリ全域と、端末のローカルに残るイベントログ
      非対象   : ディスク全域のイメージ、$MFT、ShimCache

open_questions:
  - id: q_initial_access
    label: "初期侵入経路"
    question: "攻撃者はどこから侵入したか"
    resolved_by: [ev_004, ev_014]
    resolution_mode: any
    critical: true
    implication: |
      未解消のまま封じ込めても、同じ経路から他の端末が
      侵害される可能性が残ります。侵入経路を塞がない限り、
      封じ込めは時間稼ぎにしかなりません。

  - id: q_lateral_movement
    label: "横展開の有無と経路"
    question: "fs01 で起きた大量のファイル操作は、どこから来たか"
    resolved_by: [ev_006]
    resolution_mode: any
    critical: true
    implication: |
      経路が不明なままでは、同じ手法で到達可能な
      他の資産を特定できません。窃取された資格情報が
      使われている場合、隔離だけでは止まりません。

  - id: q_persistence
    label: "永続化の有無"
    question: "再起動しても攻撃者が戻ってくる状態か"
    resolved_by: [ev_009]
    resolution_mode: any
    critical: true
    implication: |
      永続化を確認しないまま隔離を解くと、端末は再び C2 へ接続します。
      稼働中のメモリにしか残らない情報であり、
      端末を停止した時点で確認する手段は失われます。

  - id: q_exfiltration
    label: "データ持ち出しの有無"
    question: "外部通信は持ち出しか C2 か"
    resolved_by: [ev_011, ev_012]
    resolution_mode: all
    critical: false
    implication: |
      持ち出しの有無は、個人情報保護法上の報告義務と
      顧客通知の要否の判断に直結します。

actions:
  # ── 調査 ──
  - id: act_collect_evtx_fs01
    label: "fs01 のイベントログを収集・解析"
    command: |
      $ wevtutil epl Security C:\ir\fs01_sec.evtx /r:FS01
      $ wevtutil epl Microsoft-Windows-PowerShell/Operational C:\ir\fs01_ps.evtx /r:FS01
        2 files exported (184 MB)

      $ Get-WinEvent -Path C:\ir\fs01_sec.evtx -FilterXPath "*[System[TimeCreated[@SystemTime>='2026-03-14T00:00:00Z']]]"
        4,281 events
      $ Get-WinEvent -Path C:\ir\fs01_ps.evtx | Where-Object Id -eq 4104
        1,164 events

      $ Get-Content \\FS01\c$\Windows\System32\LogFiles\fileaudit.log | Measure-Object -Line
        Lines : 138,402
    group: "fs01（ファイルサーバ）"
    phase: investigation
    type: investigate
    description: |
      fs01 のセキュリティログ、PowerShell 操作ログ、ファイル監査ログを
      まとめて取得し、時系列に並べる。サーバ側から見て「誰が・いつ・何をしたか」を
      洗い出す作業。
    cost_minutes: 30
    investigates: [fs01]
    yields: [ev_001, ev_002]

  - id: act_netflow_overview
    label: "ネットワークフローの概況確認"
    command: |
      $ nfdump -R /var/netflow/2026-03-14 -t 2026/03/14.00:00-04:00 -s record/bytes -n 20
        Aggregated flows : 41,208
        Top 20 by bytes  : listed

      $ nfdump -R /var/netflow/2026-03-14 -t 2026/03/14.00:00-04:00 'dst net not 192.0.2.0/24'
        Matched flows : 1,933  (egress only)
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      境界とコアスイッチのフロー情報から、深夜帯の通信を通信量順に並べる。
      通信の中身は見えないが、どの端末がどこへどれだけ話したかが分かる。
    cost_minutes: 20
    investigates: [ws-042, ws-107, ws-113]
    yields: [ev_007]

  - id: act_asset_inventory
    label: "資産管理台帳・変更管理台帳の照会"
    command: |
      $ curl -s "https://cmdb.corp.local/api/assets?site=HQ" | jq '.[] | {id,owner,role}'
        6 records

      $ curl -s "https://cmdb.corp.local/api/changes?from=2026-03-13&to=2026-03-14" | jq length
        3 records
    group: "台帳・運用の記録"
    phase: investigation
    type: investigate
    description: |
      資産管理台帳と変更管理台帳を引き、各端末の用途・管理者と、
      この時間帯に承認済みの作業が入っていないかを確認する。
      異常かどうかを判定するには、平常時の姿を知る必要がある。
    cost_minutes: 10
    investigates: []
    yields: [ev_008]

  - id: act_dc_authlog
    label: "dc01 の認証ログを確認"
    command: |
      $ Get-WinEvent -ComputerName DC01 -FilterHashtable @{
            LogName='Security'; Id=4624,4625,4672;
            StartTime='2026-03-14 00:00'; EndTime='2026-03-14 04:00' }
        1,507 events

      $ ... | Group-Object {$_.Properties[5].Value} | Sort Count -Descending
        18 distinct accounts
    group: "dc01（ドメインコントローラ）"
    phase: investigation
    type: investigate
    description: |
      ドメインコントローラのセキュリティログから、深夜帯の認証イベントを抽出する。
      誰がどの端末からドメインにログオンしたかを見る。
    cost_minutes: 25
    investigates: [dc01, ws-113]
    yields: [ev_005]

  - id: act_interview_sato
    label: "利用者（佐藤）に連絡して聞き取り"
    requires_evidence: [ev_001, ev_007]
    command: |
      $ 架電 03:21  携帯（登録番号）      呼出 30秒 → 応答なし
      $ 架電 03:24  携帯（登録番号）      呼出 30秒 → 応答なし
      $ 架電 03:29  自宅（緊急連絡先）    呼出 30秒 → 応答なし
      $ 社用チャット DM 送信 03:31        既読なし
      $ 架電 03:38  上長経由              呼出 30秒 → 応答なし
    group: "ws-042（営業部端末）"
    phase: investigation
    type: investigate
    description: |
      端末の利用者に電話で連絡し、心当たりのある操作がなかったかを聞く。
      深夜帯であり、つながる保証はない。
    cost_minutes: 20
    investigates: [ws-042]
    yields: [ev_016]

  - id: act_edr_full_scan
    label: "全端末に EDR のフルスキャンを実行"
    command: |
      $ edrctl scan --all --type full --wait
        DC01     ........ done   0 detections
        FS01     ........ done   0 detections
        WS-042   ........ done   0 detections
        WS-055   ........ done   0 detections
        WS-107   ........ done   0 detections
        WS-113   ........ done   0 detections

        Signature DB : 2026-03-13 22:10 (latest)
        Scanned      : 6 hosts / 3,109,204 files / 38m02s
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      全端末に EDR のフルスキャンを走らせ、既知のマルウェアシグネチャと照合する。
      ディスク上の検体を探す作業。
    cost_minutes: 35
    investigates: []
    yields: [ev_017]

  - id: act_backup_config
    label: "バックアップ運用設定の照会"
    requires_evidence: [ev_007]
    command: |
      $ bkpctl job list --host WS-107 --format json | jq '.[] | {name,schedule,target}'
        1 job

      $ bkpctl job history --name nightly-cloud-sync --days 30
        30 runs listed
    group: "台帳・運用の記録"
    phase: investigation
    type: investigate
    description: |
      バックアップ製品の設定と実行履歴を引き、
      どの端末が・いつ・どこへ・どれだけ送る設定になっているかを確認する。
    cost_minutes: 15
    investigates: []
    yields: [ev_003]

  - id: act_mail_gateway
    label: "メールゲートウェイのログを照合"
    requires_evidence: [ev_001, ev_007]
    command: |
      $ mgctl search --rcpt sato@example.com --from 2026-03-14T00:00 --to 2026-03-14T04:00
        3 messages

      $ mgctl show 4B2F91A0C7 --headers --attachments
        headers + 1 attachment

      $ Get-WinEvent -ComputerName WS-042 -LogName Microsoft-Windows-VHDMP/Operational
        6 events
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      メールゲートウェイの配送ログから、対象利用者宛の受信を洗う。
      差出人、件名、添付、認証結果（SPF/DKIM）を確認する。
    cost_minutes: 25
    investigates: [ws-042]
    yields: [ev_004]

  - id: act_smb_session_fs01
    label: "fs01 の SMB セッション履歴を解析"
    command: |
      $ Get-WinEvent -ComputerName FS01 -FilterHashtable @{LogName='Security'; Id=4624,5140}
        892 events

      $ ... | Where-Object { $_.Properties[8].Value -eq 3 } | Group AuthenticationPackageName
        2 groups (Kerberos / NTLM)

      $ Get-SmbSession -CimSession FS01 | Format-Table ClientComputerName,ClientUserName
        4 sessions
    group: "fs01（ファイルサーバ）"
    phase: investigation
    type: investigate
    description: |
      fs01 のファイル共有への接続履歴を解析する。
      どのアカウントが、どの端末から、どの認証方式で接続したかを見る。
    cost_minutes: 30
    investigates: [fs01, ws-042]
    yields: [ev_006]

  # ws-055 への手は2つある。**片方は端末に触れず、片方は端末まで行く。**
  # 安いほうが返すのは正しい所見（コンソールが持っている分には何も無い）で、
  # 誤るのは読み手の一般化のほうである（5.4 / 3.4）。
  # 20分と40分の差は、この盤面で最も高くつく読み違いの値段になっている
  - id: act_console_query_ws055
    label: "ws-055 の状態を管理コンソールで照会"
    requires_evidence: [ev_001, ev_006]
    command: |
      $ edrctl inventory show --host WS-055 --sections autoruns,tasks,persistence
        3 sections exported   (00:00:38)

      $ edrctl inventory diff --host WS-055 --baseline corp-win11-std
        autoruns : 19 entries compared
        tasks    : 47 entries compared

      $ siemctl search --host WS-055 --from 2026-03-14T02:00 --to 2026-03-14T04:00
        matched events : 0

      $ siemctl feed status --host WS-055 --format json | jq .last_received
        1 field
    group: "ws-055（営業部共用端末）"
    phase: investigation
    type: investigate
    description: |
      管理コンソールに集まっている ws-055 のインベントリとイベントを照会し、
      標準構成との差分を取る。手元の画面から引くだけで、端末には触れない。
    cost_minutes: 20
    investigates: [ws-055]
    yields: [ev_020]

  - id: act_local_collect_ws055
    label: "ws-055 に臨場して、稼働させたまま採取"
    requires_evidence: [ev_001, ev_006]
    command: |
      $ 03:4x  現地着。端末は電源が入ったまま
      $ winpmem_mini_x64.exe D:\ir\ws055.raw
        Acquiring physical memory ... 8,192 MB / 8,192 MB   (00:09:52)
        SHA-256 recorded

      $ vol.py -f ws055.raw windows.pslist
        96 processes
      $ vol.py -f ws055.raw windows.netscan
        31 connections
      $ vol.py -f ws055.raw windows.registry.printkey --key "SYSTEM\CurrentControlSet\Services"
        key dumped

      $ wevtutil epl Security D:\ir\ws055_sec.evtx
      $ wevtutil epl System D:\ir\ws055_sys.evtx
        2 files exported (140 MB)
    group: "ws-055（営業部共用端末）"
    phase: investigation
    type: investigate
    tags: [volatile_capture]
    description: |
      ws-055 のところまで行き、端末を動かしたままメモリを取得して、
      端末のローカルに残っているイベントログを直接吸い上げる。
      移動と現地での作業の分だけ時間がかかる。
    cost_minutes: 40
    investigates: [ws-055]
    yields: [ev_021]

  - id: act_memory_dump_ws042
    label: "ws-042 のメモリダンプ取得・解析"
    requires_evidence: [ev_001, ev_007]
    command: |
      $ winpmem_mini_x64.exe \\WS-042\c$\ir\ws042.raw
        Acquiring physical memory ... 16,384 MB / 16,384 MB   (00:11:42)
        SHA-256 recorded

      $ vol.py -f ws042.raw windows.pslist
        118 processes
      $ vol.py -f ws042.raw windows.netscan
        47 connections
      $ vol.py -f ws042.raw windows.registry.printkey --key "Software\Microsoft\Windows\CurrentVersion\Run"
        key dumped
      $ strings -el ws042.raw | grep -Ei 'http|key|sleep' | sort -u
        2,904 lines
    group: "ws-042（営業部端末）"
    phase: investigation
    type: investigate
    tags: [volatile_capture]
    description: |
      稼働中の ws-042 からメモリイメージを取得して解析する。
      実行中プロセス、確立中の接続、メモリ上の文字列、自動起動の設定を見る。
      端末は動かしたまま行う。
    cost_minutes: 45
    investigates: [ws-042]
    yields: [ev_009]

  - id: act_memory_dump_fs01
    label: "fs01 のメモリダンプ取得・解析"
    command: |
      $ winpmem_mini_x64.exe \\FS01\c$\ir\fs01.raw
        Acquiring physical memory ... 32,768 MB / 32,768 MB   (00:19:05)

      $ vol.py -f fs01.raw windows.pslist
        94 processes
    group: "fs01（ファイルサーバ）"
    phase: investigation
    type: investigate
    tags: [volatile_capture]
    description: |
      稼働中の fs01 からメモリイメージを取得して解析する。
      実行中プロセスと開いているファイルハンドルを見る。サーバは止めない。
    cost_minutes: 40
    investigates: [fs01]
    yields: [ev_010]

  - id: act_proxy_log
    label: "ws-042 のプロキシログを照合"
    requires_evidence: [ev_001, ev_007]
    command: |
      $ zgrep '192.0.2.42' /var/log/squid/access.log.*.gz | wc -l
        65

      $ zgrep '192.0.2.42' /var/log/squid/access.log.*.gz \
          | awk '{print $1}' | awk 'NR>1{print $1-p} {p=$1}' | datamash mean 1 sstdev 1
        60.2   14.8

      $ fwctl session list --src 192.0.2.42 --since 2026-03-14T02:00
        1 session
    group: "ws-042（営業部端末）"
    phase: investigation
    type: investigate
    description: |
      プロキシと境界ファイアウォールのログから、対象端末の外向き通信を
      1リクエストずつ洗う。宛先、間隔、転送量、User-Agent を見る。
    cost_minutes: 20
    investigates: [ws-042]
    yields: [ev_011]

  - id: act_dlp_review
    label: "DLP ログを精査し外部送信を確認"
    requires_evidence: [ev_007]
    command: |
      $ dlpctl alerts --from 2026-03-14T00:00 --to 2026-03-14T04:00 --policy confidential-egress
        0 alerts

      $ dlpctl transfers --from 2026-03-14T00:00 --to 2026-03-14T04:00 --min-size 10MB
        1 transfer (approved destination)

      $ casbctl egress --unapproved --min-size 10MB --from 2026-03-14T00:00
        0 transfers
    group: "全体を横断して見る"
    phase: investigation
    type: investigate
    description: |
      DLP と CASB のログを引き、機密ファイルの外部送信が検知されていないかを確認する。
      承認済み宛先への送信と、未承認宛先への送信を分けて見る。
    cost_minutes: 25
    investigates: [ws-107]
    yields: [ev_012]

  - id: act_triage_ws113
    label: "ws-113 をトリアージ"
    requires_evidence: [ev_005]
    command: |
      $ irtriage.exe --host WS-113 --collect autoruns,shimcache,tasks,persistence
        autoruns    : 24 entries
        shimcache   : 312 entries
        tasks       : 61 entries
        persistence : 0 findings
        (00:18:44)

      $ irtriage.exe --host WS-113 --timeline --from 2026-03-14T02:00 --to 2026-03-14T04:00
        38 events
    group: "ws-113（情報システム部端末）"
    phase: investigation
    type: investigate
    description: |
      ws-113 の自動起動項目、直近の実行履歴、スケジュールタスクを
      自動収集ツールで一括取得して確認する。
    cost_minutes: 25
    investigates: [ws-113]
    yields: [ev_013]

  - id: act_backup_integrity
    label: "バックアップの健全性を確認"
    command: |
      $ bkpctl verify --set FY2026-daily --generation latest
        checksum ... OK  (14 generations present)

      $ bkpctl restore --set FY2026-daily --generation 2026-03-14T01:00 \
          --path '\\share\経理' --to /mnt/verify --limit 20
        20 files restored ... OK

      $ bkpctl repo audit --since 2026-03-13T22:00
        write requests : 0
    group: "台帳・運用の記録"
    phase: investigation
    type: investigate
    description: |
      バックアップからの復元を試験し、世代とデータが健全かを確認する。
      ランサムウェア対応では復旧可否を早期に把握したい。
    cost_minutes: 30
    investigates: []
    yields: [ev_018]

  - id: act_ad_group_audit
    label: "dc01 の特権グループ変更履歴を確認"
    command: |
      $ Get-ADGroupMember 'Domain Admins','Enterprise Admins','Schema Admins','Backup Operators'
        4 groups queried

      $ Get-WinEvent -ComputerName DC01 -FilterHashtable @{LogName='Security'; Id=4728,4732,4756;
            StartTime='2026-02-12'}
        0 events
    group: "dc01（ドメインコントローラ）"
    phase: investigation
    type: investigate
    description: |
      Active Directory の特権グループ（Domain Admins 等）の
      メンバー変更履歴を確認する。攻撃者が権限を追加していないかを見る。
    cost_minutes: 25
    investigates: [dc01]
    yields: [ev_019]

  # 以下2つは排他。稼働中にしか取れないものを、取得のために失う
  - id: act_disk_image_ws042
    label: "ws-042 を停止してディスクイメージを取得"
    requires_evidence: [ev_001, ev_007]
    command: |
      $ Stop-Computer -ComputerName WS-042 -Force
        WS-042: powered off

      $ ftkimager \\.\PHYSICALDRIVE0 /mnt/ir/ws042 --e01 --frag 2G
        Acquiring 512 GB ... done   (00:41:20)
        MD5/SHA1 verified

      $ mftecmd.exe -f ws042.E01 --csv /mnt/ir/out
        482,913 records
      $ RECmd.exe -d ws042/Users/sato/NTUSER.DAT --bn RecentDocs.reb
        61 entries
      $ AppCompatCacheParser.exe -f ws042/SYSTEM --csv /mnt/ir/out
        1,024 entries
    group: "ws-042（営業部端末）"
    phase: investigation
    type: investigate
    description: |
      ws-042 をシャットダウンしてディスクを取り外し、物理イメージを取得する。
      $MFT、レジストリ、ShimCache といったディスク上の痕跡を網羅的に見られる。
      停止が前提なので、稼働中にしか存在しない情報は取れなくなる。
    cost_minutes: 60
    investigates: [ws-042]
    yields: [ev_014]
    destroys: [ev_009]

  - id: act_reboot_fs01
    label: "fs01 をセーフモードで再起動して確認"
    command: |
      $ Restart-Computer -ComputerName FS01 -Wait -For WinRM
        FS01: rebooting into Safe Mode
        back online  (00:06:31)

      $ autorunsc.exe -accepteula -a * -h \\FS01
        31 entries
      $ Get-WinEvent -ComputerName FS01 -FilterHashtable @{LogName='Application'; Id=524}
        2 events
      $ Get-ChildItem \\FS01\c$\Windows\Temp -File | Sort LastWriteTime -Desc
        18 files
    group: "fs01（ファイルサーバ）"
    phase: investigation
    type: investigate
    description: |
      fs01 をセーフモードで再起動し、自動起動項目とディスク上のファイルを確認する。
      再起動するため、稼働中のプロセス情報は残らない。
    cost_minutes: 35
    investigates: [fs01]
    yields: [ev_015]
    destroys: [ev_010]

  # ── 現場への指示 ──
  # 証拠を取りに行くのではなく、証拠が消えるのを止めに行く手。
  # 効くのは打ち終わった時刻から先だけで、既に起きたことには効かない。
  # 速いプレイなら20分を払う意味は無い（世界が追いつく前に終わる）。
  # 遅くなると分かっているときだけ得になる、自分の速さへの賭け。
  - id: act_preservation_notice
    label: "全社に証拠保全の周知を出す"
    command: |
      $ mail -s "[重要] 障害対応中の端末操作について" all-staff@corp.example < notice.txt
        delivered: 412 recipients

      $ helpdesk-cli script set --id first-response --file notice-hd.txt
        1 script updated

      $ chatops post --channel #all-announce --pin
        pinned
    group: "全体への指示"
    phase: investigation
    type: communicate
    description: |
      情報システム部から全社へ、異常が出ている端末の電源断・再起動・
      ファイルの削除を行わないよう周知する。ヘルプデスクの一次応答も
      同じ文面に差し替え、問い合わせへの回答を揃える。
      調査そのものは1ミリも進まない。
    cost_minutes: 15
    prevents: [tl_backup_roll, tl_fs01_restart, tl_field_reboot]

  # ── 封じ込め・対応 ──
  - id: act_block_c2
    label: "C2 ドメインを境界で遮断"
    command: |
      $ fwctl rule add --name block-c2 --dst 198.51.100.77/32 --action deny --log
        rule installed (edge-fw-01, edge-fw-02)

      $ dnsctl sinkhole add --domain gate.php.198.51.100.77 --to 192.0.2.250
        sinkhole active

        端末は動作を継続。通信のみ遮断。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      外部の C2 宛通信を境界で遮断する。端末は動いたまま、通信だけを止める。
    cost_minutes: 10
    targets: [ws-042]
    investigates: []
    side_effects:
      business_impact: false

  - id: act_isolate_ws042
    label: "ws-042 をネットワークから隔離"
    command: |
      $ edrctl isolate --host WS-042 --allow-management
        WS-042: network isolation ENABLED  (00:02:11)
        端末は動作を継続。管理経路のみ許可。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      ws-042 をネットワークから切り離す。端末は動いたまま、通信だけを止める。
    cost_minutes: 10
    targets: [ws-042]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_isolate_ws107
    label: "ws-107 をネットワークから隔離"
    command: |
      $ edrctl isolate --host WS-107 --allow-management
        WS-107: network isolation ENABLED  (00:02:04)
        端末は動作を継続。管理経路のみ許可。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      ws-107 をネットワークから切り離す。端末は動いたまま、通信だけを止める。
    cost_minutes: 10
    targets: [ws-107]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_isolate_ws055
    label: "ws-055 をネットワークから隔離"
    command: |
      $ edrctl isolate --host WS-055 --allow-management
        WS-055: network isolation ENABLED  (00:02:26)
        端末は動作を継続。管理経路のみ許可。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      ws-055 をネットワークから切り離す。端末は動いたまま、通信だけを止める。
    cost_minutes: 10
    targets: [ws-055]
    investigates: []
    side_effects:
      business_impact: true

  # fs01 に対する手は**3つある**。ここが対応フェーズの取捨選択の中心で、
  # 3つの方針が3つの違う答えを出す唯一の場所である（v1.40）。
  #
  #   境界で遮断  25分  ホスト稼働・業務は続く・稼働中の痕跡が残る
  #   共有を停止  10分  ホスト稼働・業務は止まる・稼働中の痕跡が残る
  #   ホスト停止  15分  電源を落とす・業務は止まる・稼働中の痕跡が消える
  #
  # 2つしか無かった頃、業務継続と証拠保全は**上位6組まで完全に同順**だった。
  # 証拠保全が重く見る evidence_preserved は「取る前に失った分」しか
  # 数えない（6.3）ので、先に取っておけばどれを選んでも減らない —
  # 重みは順序にしか効かず、**どの手を選ぶかには一度も効かなかった。**
  # 効かせられるのは方針の制約だけで、証拠保全には
  # require_capture_of_target（止める資産ごとに取ってから止める）を置いた。
  - id: act_block_smb_fs01
    label: "fs01 の共有への SMB を、発信元を絞って境界で遮断"
    command: |
      $ chgctl request --type acl --scope core --window now --approver oncall
        CHG-2026-0288  emergency  approved  (00:18:20)

      $ swctl acl add --vlan 20 --dst 192.0.2.10/32 --src-list CHG-2026-0288 \
          --proto tcp --dport 445 --action deny --log
        acl applied (sw-core-01, sw-core-02)  entries: 1

      $ smbutil check --to FS01
        connect \\FS01\share : timed out (blocked)
        FS01 は稼働を継続。他セグメントからの共有利用に変化なし。
    group: "通信だけを止める"
    phase: response
    type: contain
    description: |
      fs01 の SMB 共有へ向かう接続を、境界のアクセス制御で発信元単位に遮断する。
      サーバは動いたままで、他部署からの共有利用は続く。
      深夜帯の構成変更なので、変更管理の承認と実機での確認に時間がかかる。
    cost_minutes: 25
    targets: [fs01]
    investigates: []
    destroys: []
    side_effects:
      business_impact: false

  - id: act_stop_share_fs01
    label: "fs01 のファイル共有サービスだけを停止"
    command: |
      $ Get-SmbSession -CimSession FS01 | Measure-Object
        Count : 37

      $ Stop-Service LanmanServer -Force -CimSession FS01
        LanmanServer: stopped  (00:00:51)

      $ smbutil check --to FS01
        connect \\FS01\share : connection refused

        FS01 は稼働を継続。共有は誰からも使えなくなった。
    group: "サービスだけを止める"
    phase: response
    type: contain
    description: |
      fs01 のファイル共有サービスを止める。ホストは動いたままで、
      共有への接続だけが全社から使えなくなる。
      手元から1コマンドで済むので、承認も実機確認も要らない。
    cost_minutes: 10
    targets: [fs01]
    investigates: []
    destroys: []
    side_effects:
      business_impact: true

  - id: act_shutdown_fs01
    label: "fs01 を停止"
    command: |
      $ Stop-Service LanmanServer -Force -ComputerName FS01
        file share offline
      $ Stop-Computer -ComputerName FS01 -Force
        FS01: powered off  (00:03:48)

        \\FS01\share への接続はすべて切断された。
    group: "資産を停止する"
    phase: response
    type: contain
    description: |
      fs01 の電源を落とす。ファイル共有は使えなくなり、
      ホスト上で動いているものはすべて落ちる。
    cost_minutes: 15
    targets: [fs01]
    investigates: []
    destroys: [ev_010]
    side_effects:
      business_impact: true

  # 3つ目の束。**止めることと、居座られた状態を消すことは別の作業である。**
  # 通信を断てば攻撃者の手は届かなくなるが、端末に残された仕掛けは
  # そのままなので、端末を業務に戻した瞬間に元へ戻る。
  # この束だけが `eradicates` を持ち、5.8 の減衰を on_partial から
  # on_correct_containment へ動かす（9.4 #5 / v1.37）。
  #
  # **fs01 の2つの手と同じ形にしてある**（5.6 / 3.8）。丁寧に取り除く手は
  # 高くて業務も証拠も守り、作り直す手は安くて確実だが両方を差し出す。
  # どちらが正解かは方針が決める — damage_minimization は前者を禁じる。
  - id: act_purge_persistence_ws042
    label: "ws-042 の自動実行の登録を EDR で標準状態に戻す"
    command: |
      $ edrctl remediate --host WS-042 --scope autorun --restore-baseline
        HKCU\...\Run           : 1 entry reverted
        HKLM\...\Run           : baseline matched
        Scheduled Tasks        : baseline matched
        Services               : baseline matched
        applied  (00:06:12)

      $ edrctl scan --host WS-042 --profile deep --verify
        scanned 214,880 objects   (00:33:41)
        端末は動作を継続。利用者はそのまま作業できる。
    group: "元の状態に戻す"
    phase: response
    type: contain
    description: |
      ws-042 の自動実行まわりの登録を、EDR の標準構成と突き合わせて戻す。
      端末は動いたままで、利用者の作業も止まらない。
      戻した先が本当に標準どおりかを確かめる深いスキャンに時間がかかる。
    cost_minutes: 40
    targets: [ws-042]
    eradicates: [ws-042]
    investigates: []
    destroys: []
    side_effects:
      business_impact: false

  - id: act_rebuild_ws042
    label: "ws-042 を初期化して標準構成で復帰させる"
    command: |
      $ imgctl deploy --host WS-042 --image corp-win11-std --wipe
        disk 0: secure erase started
        disk 0: secure erase done  (00:11:36)
        image applied, 1 partition, 62 GB

      $ domainctl rejoin --host WS-042 --ou "OU=Sales" --new-machine-password
        WS-042: rejoined  (00:26:07)
        端末は標準構成で起動。利用者プロファイルは復元待ち。
    group: "元の状態に戻す"
    phase: response
    type: contain
    description: |
      ws-042 のディスクを消去して標準イメージを再導入し、ドメインへ入れ直す。
      流し込みは自動化されているので短い。作業の間その端末は使えない。
    cost_minutes: 30
    targets: [ws-042]
    eradicates: [ws-042]
    investigates: []
    destroys: [ev_009, ev_014]
    side_effects:
      business_impact: true

  - id: act_shutdown_dc01
    label: "dc01 を停止"
    command: |
      $ Stop-Computer -ComputerName DC01 -Force
        DC01: powered off  (00:04:02)

        ドメイン認証が停止。DC01 に依存する全ホストが実質停止。
    group: "資産を停止する"
    phase: response
    type: contain
    description: |
      dc01 を停止する。ドメイン認証が止まる。
    cost_minutes: 15
    targets: [dc01]
    investigates: []
    side_effects:
      business_impact: true

  - id: act_reset_credentials
    label: "dc01 を一時停止してドメイン資格情報を一括リセット"
    command: |
      $ Stop-Service NTDS -Force -ComputerName DC01
        directory service stopped

      $ Get-ADUser -Filter * | Set-ADAccountPassword -Reset -NewPassword (New-Password)
        47 accounts reset
      $ Reset-ComputerMachinePassword -Server DC01
        5 computer accounts reset

      $ Start-Service NTDS -ComputerName DC01
        directory service started  (00:14:55)
    group: "資産を停止する"
    phase: response
    type: contain
    description: |
      dc01 を一時停止し、全ドメインアカウントの資格情報をリセットする。
    cost_minutes: 20
    targets: [dc01]
    investigates: []
    side_effects:
      business_impact: true

# フェーズは2つ。不可逆な移行は、必ず判断を伴うものだけにする（SPEC 3.8）。
# 何を先に見るかは requires_evidence の連鎖が決めるので、
# 「まだ調査フェーズに入っていないから押せない」という門は置かない。
# 時間が経つと向こうから入ってくること。圧力だけを運び、答えは運ばない。
# 折れ点（270→150分）の前後に置いて、加速を数値ではなく声で気づかせる。
# 時間が経つと向こうから入ってくること（SPEC 5.10）。
# どれも学習者に不利にしか働かない。奪うか、費用の変化を告げるか。
# 何も変えない出来事はローダが拒否する（赤い枠の付いた飾りになるため）。
#
# 誰が悪いという話ではない。復旧を急ぐ現場判断も、固まった端末の再起動も、
# それ自体は正しい行動である。揮発性の証拠は、そういう善意で普通に消える。
timeline:
  - id: tl_accel
    at_minutes: 255
    label: "監視センターから追加連絡"
    text: |
      「暗号化の進み方が速くなっています。
        さっきまでの倍くらいのペースで拡がっているように見えます。」
    heralds: acceleration     # 折れ点（290分）の唯一の予告

  - id: tl_fs01_restart
    at_minutes: 295
    label: "運用チームから連絡"
    text: |
      「fs01 が応答しなくなっていたので、一度再起動をかけました。
        業務が止まっているので、復旧を優先すべきと判断しました。」
    destroys: [ev_010]        # 稼働中だった暗号化バイナリの痕跡
    averted_label: "運用チームから連絡"
    averted_text: |
      「fs01 が応答しないので再起動しようとしたのですが、
        周知が回っていたので手を止めました。そのままにしてあります。」

  - id: tl_backup_roll
    at_minutes: 305
    label: "バックアップ運用チームから連絡"
    text: |
      「世代がひとつ落ちました。保持数の上限に達したので、
        いちばん古いスナップショットから順に消えていきます。」
    destroys: [ev_018]        # 暗号化前の世代から復元できるという確認
    averted_label: "バックアップ運用チームから連絡"
    averted_text: |
      「保持数の上限に達しましたが、周知を受けて世代の削除を止めました。
        当面は今の状態のまま残します。」

  - id: tl_field_reboot
    at_minutes: 365
    label: "ヘルプデスクから連絡"
    text: |
      「動かなくなった端末を再起動する動きが、現場で始まっています。
        こちらからは何も出していないので、止めようがありません。」
    # メモリ上にしか無かった C2 設定・Run キーと、共用機のサービス登録。
    # 現場が触りに行くのは、担当者のいない端末から先である
    destroys: [ev_009, ev_021]
    averted_label: "ヘルプデスクから連絡"
    averted_text: |
      「端末を再起動していいかという問い合わせが続いています。
        先の周知どおり、そのままにしておくよう返しています。」

phases:
  - id: investigation
    label: "調査"
    advance_label: "対応フェーズに移る"

  - id: response
    label: "封じ込め・対応"
    advance_label: null
    requires_assessment: true

damage:
  model: exponential
  params:
    base: 350.7
    rate: 0.15
  acceleration:
    # 折れ点は「巧いプレイの長さ」L の 1.1〜1.3 倍（SPEC 8.2 手順7）。
    # **L は方針に依存する**（v1.40）。方針の制約が「何を先に押すか」を
    # 決めるので、守るものが重い方針では最良に解いても長くなる。
    #   業務継続   170分 ＋ 隔離10 ＋ 共有停止10 ＋ 作り直す30 = 220分
    #   証拠保全   170分 ＋ fs01 の採取40 ＋ 隔離10 ＋ 共有停止10 ＋ 作り直す30 = 260分
    #   被害最小化 170分 ＋ 隔離10 ＋ ホスト停止15 ＋ 作り直す30 = 225分
    # 折れ点は**最も高くつく方針**（証拠保全 260分）で置く。290/260 = 1.12倍。
    # v1.42 で 3台目の侵害資産が入り、判断までが 130 → 170分に伸びた
    # （その端末を指す非誤導の証拠は現地採取 40分でしか出ない）。
    # 折れ点の上限を決めているのは 8.3 のもう1本 —
    # 調査フェーズの総コスト 590分が折れ点の2倍以上であること（≦295分）。
    # 下限（1.1倍＝286分）との窓は 286〜295分しかない。**窓が狭いのは
    # 調査メニューが 8.1 の上限（20手）に届いているからで、
    # 次に手を足すなら、どれかを畳んでからにする。**
    # 折れ点を踏むかどうかが、渡された方針で決まってはいけない。
    # 判断だけで校正していた頃は 150分、根絶が L に入っていなかった頃は
    # 180分、方針が入っていなかった頃は 200分で、いずれも
    # 「盤面で最良の対応をする人が自分で踏む」位置にあった
    threshold_minutes: 290
    multiplier: 2.5
  containment_effect:
    on_correct_containment: 0.2
    on_partial: 0.6
    on_incorrect: 1.0

scoring:
  fact_layer:
    metrics:
      - id: assessment_precision
        label: "被疑判定の適合率"
        direction: higher_is_better
      - id: assessment_recall
        label: "被疑判定の再現率"
        direction: higher_is_better
      # 適合率・再現率は「答えと合っていたか」しか見ない。
      # 根拠の厚みを測るのはこの1本だけで、宣言した瞬間の手元を見る
      - id: assessment_support
        label: "名指しの裏付け"
        direction: higher_is_better
      # 生値は「悪さ」だが、講評が出すのは向きを揃えた「良さ」なので、
      # 良い側から見た名前（label_good）を必ず添える
      - id: unresolved_questions
        label: "未解消論点を抱えたままの判断"
        label_good: "論点を解消してからの判断"
        direction: lower_is_better
    weights:
      assessment_precision:  0.20
      assessment_recall:     0.20
      assessment_support:    0.20
      # critical 論点が3つあるので 4段階の階段になる。1論点 = 13.3 fact点。
      # 永続化の把握はこの中の q_persistence が受け持つ（ev_009 を
      # 現場の再起動より先に取れたか）。論点が2つ以下のシナリオでは
      # この重みは使えない（SPEC 8.3）
      unresolved_questions:  0.40

  policy_layer:
    constraint_penalty: 0.15

  consequence_layer:
    display_only:
      - elapsed_minutes
      - total_damage
      - business_impact
      - evidence_preserved
      - containment_completeness
    business_impact_horizon_minutes: 480
    normalization:
      # 巧いプレイの被害が worst の 2〜3割に入るように再導出する（8.2 手順7）。
      # 根絶を入れる前は 4993/20000 = 25.0% だった。根絶まで行くと
      # 封じ込めが 45分に伸びるので巧いプレイの被害が 5300 になり、
      # 同じ 25.0% に戻すには帯を 21200 まで広げる必要がある。
      # v1.40 で折れ点が 200 → 240分へ動き、巧いプレイの被害は 5069 に
      # 下がった（折れ点の手前で終わる時間が増えた）。5069/21200 = 23.9% で
      # 帯の中に収まっているので、**帯は動かしていない** — 狙いは
      # 「2〜3割」という帯であって、25.0% という点ではない。
      # **base（350.7）も動かさない** — 動かすとどの変更が効いたのか
      # 分からなくなる（帯だけを動かせば、比は帯の側で閉じる）
      total_damage:             { worst: 21200, best: 0 }
      # 業務影響の帯は「全資産を最序盤に停止した場合」（v1.39 の per_hour で
      # 164/h × 8時間 = 1312）と、**盤面で実際に到達できる最大**
      # （全部押して全部止める 690分のプレイで 1467）の両方を覆う値。
      # 前者だけに合わせると、上位3つの「全部止める」プレイが揃って
      # 帯の外に出て 0 で並び、何台巻き込んだかの差が消える。
      # 端末の per_hour を上げた分（138/h → 164/h）ここも広げないと、
      # 帯の意味が「止めたかどうか」の1ビットに落ちる。
      # v1.42 で資産が1つ増え（168/h × 8時間 = 1344）、盤面で到達できる
      # 最大は 1527 になった。1500 のままだと網羅・全隔離・根元落としの
      # 3つが帯の外へ出て 0 で並ぶ — 上の段落が名指ししている失敗そのもの
      business_impact:          { worst: 1550,  best: 0 }
      # 失いうるのは destroys に書かれた分だけ（ev_009 / ev_010 / ev_014 /
      # ev_018 / ev_021）。v1.42 で証拠が 19 → 21件になり、
      # 現場の再起動が ws-055 の稼働中の痕跡も奪うようになったので
      # 5/21 = 到達しうる最悪 0.762。**帯は盤面に合わせて再導出する** —
      # ここを 0.789 のままにすると、誰も踏まない 2.7% 分だけ帯が広くなる
      evidence_preserved:       { worst: 0.762, best: 1.0 }
      containment_completeness: { worst: 0.0,  best: 1.0 }

  composite:
    method: weighted_sum
    fact_weight: 0.7

