      # ws-042 メモリイメージ解析結果

      [プロセス]
      PID 4812  powershell.exe   PPID 3120 (explorer.exe)  Start 02:17:31
        接続中: 198.51.100.77:443  (ESTABLISHED, 3910s)

      [メモリ上の文字列]
        hxxps://198.51.100.77/gate.php
        sleep=60 jitter=15
        AES key: 3f9a1c...（32 bytes)

      [永続化]
      HKCU\Software\Microsoft\Windows\CurrentVersion\Run
        "OneDriveSync" = "powershell -nop -w hidden -enc SQBFAFgA..."
        書き込み時刻: 2026-03-14T02:18:02Z

      取得範囲 : 物理メモリ全域（プロセス一覧・接続・文字列・HKCU の Run キー）
