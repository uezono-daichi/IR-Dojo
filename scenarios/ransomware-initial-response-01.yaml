        非対象   : 既存の特権アカウントの資格情報を用いた利用

  # ── 再現率を下げる側の誤導（SPEC 3.4 / v1.42） ──
  # **これは嘘をつかない。** 管理コンソールが持っている転送済みの分には、
  # 本当に何も無い。誤っているのは資料ではなく、読み手の一般化
  # （「コンソールに無い」→「この端末には無い」）である。
  # その差は content の書き分けで守る — 収集範囲の欄が
  # 「保持している転送済みの分」と「最終受信 3/2」を平文で言っており、
  # 平常日にも同じ行が出る（5.4 の平常日テスト）。
  # 厚みも範囲欄も他の証拠と揃える。薄いと欄の有無が目印になる
  - id: ev_020
    points_to: []
    clears: [ws-055]
    misleading: true
    plausibility: high
    volatile: false
    summary: "ws-055 は管理コンソール上、自動起動も直近の実行も新規なしで並んでいる"
    reading: |
      管理コンソールの照会結果。コンソールは各端末から転送されてきた
      インベントリとイベントを保持していて、照会はその保持分に対して行われる。
      照会のたびに端末へ取りに行くわけではない。

        自動起動項目       ログオンや起動のたびに実行されるものの一覧
        直近30日の新規実行 転送された実行痕跡のうち、前回の台帳に無かったもの
        最終受信           その端末からの転送を最後に受け取った時刻

      「新規 0 件」が言うのは、前回の台帳と比べて増えていないことである。
      比較の基準になるのは、最終受信までに届いた分になる。

      転送が滞る原因は攻撃だけではない。エージェントの更新失敗、
      証明書の期限切れ、収集側の容量不足など、運用上の理由で止まるほうが多い。
    content: |
      # EDR / SIEM 管理コンソール照会

      対象ホスト        : WS-055.corp.local
      自動起動項目      : 登録 19 件。すべて既知の管理エージェントと署名済み
      直近30日の新規実行: 0 件
      スケジュールタスク: 変更なし
      永続化の痕跡      : 検出なし
      不審な親子関係    : 検出なし

