      非対象   : 最終受信より後にこのホスト上で起きたこと、
                 このホストのローカルにのみ残る記録
    # 棄却の材料は1つでよい。現地で採った分（ev_021）が
    # 「コンソールが持っていない期間に何があったか」をそのまま埋める
    refuted_by: [ev_021]
    refutation_mode: any

