        その時刻に配る側がどうなっているかで分かれる
      - |-
        既に走った分の中身が、予定していたものと違っている。
        入った先に何が残っているかで分かれる
      - |-
        台帳の側が、実際に走った分を写しきれていない。
        端末の側の導入記録と突き合わせて分かれる
    content: |
      # dist01 / jobctl deployments --job pdfview-4.2.2

      ring-1  検証   Targets=1  status=completed  2026-04-09 11:05:14
      ring-2  営業   Targets=1  status=scheduled  2026-04-09 13:50:00
      ring-3  経理   Targets=1  status=scheduled  2026-04-09 16:20:00
      ring-4  共用   Targets=1  status=held       (割当なし)

      # jobctl deployments --job pdfview-4.2.2 --ring 1 --detail
        WS-ENG01   installed  4.2.2   2026-04-09 11:05:14   rc=0

      照会対象 : この配信ジョブの区分ごとの実績と予定
      非対象   : 他の配信ジョブ、区分に属さない端末

  - id: ev_repo_audit
