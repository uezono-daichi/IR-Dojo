  - id: ev_job_definition
    points_to: [dist01]
    misleading: false
    plausibility: high
    volatile: false
    occurred_at: "2026-04-09 10:52"
    summary: "配信ジョブの導入後処理が 10:52 に書き換えられ、実行行が1行増えている"
    reading: |
      配信ジョブの定義と、その変更履歴である。

      ジョブの定義は「何を」「誰に」「いつ」「入れる前後に何をするか」の
      4つを持つ。パッケージ本体は「何を」にあたり、署名はそこに付く。
      「入れる前後に何をするか」は定義の側に文字列として書かれ、
      パッケージの署名の対象には入らない。

      diff の行頭の + は、その版で追加された行を指す。
      版番号 (rev) は定義を保存するたびに1つ上がる。

      Author は定義を保存したアカウント、SavedFrom は保存が行われた
      接続元である。
    possibilities:
      - |-
        運用の担当者が、手順の改善として1行足した。
        その変更が申請に載っているかで分かれる
      - |-
        別の誰かが、同じ口を使って1行足した。
        保存したときの接続元と時刻で分かれる
      - |-
        元から入っていた行が、今回たまたま目に付いた。
        変更履歴のどの版から在るかで分かれる
    content: |
      # dist01 / jobctl show --job pdfview-4.2.2 --history

      rev 8  2026-04-06 14:20  Author=CORP\\ito        SavedFrom=192.0.2.31
      rev 9  2026-04-09 10:52  Author=CORP\\svc-maint  SavedFrom=203.0.113.24

      # jobctl diff --job pdfview-4.2.2 --rev 8..9
        [post-install]
          cmd = pdfview-postcfg.cmd
      +   cmd = post-install.cmd

      # type post-install.cmd
        @echo off
        powershell -nop -w hidden -enc SQBOAFYATwBLAEUALQBFAFgAUABSAEUAUwBTAEkA...

      照会対象 : ジョブ定義の現在値と保存履歴
      非対象   : パッケージ本体、その署名

