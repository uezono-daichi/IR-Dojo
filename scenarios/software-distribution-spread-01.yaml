      非対象   : 監査が有効でない領域、保管庫の外に置かれた控え

  - id: ev_dist_live
    points_to: [dist01]
    misleading: false
    plausibility: high
    volatile: true
    occurred_at: "2026-04-09 11:07"
    summary: "dist01 の稼働中のセッションに、外部アドレスからの接続が残っている"
    reading: |
      稼働中のサーバから採取した、プロセス一覧と接続一覧である。

      ESTABLISHED は、その接続が採取の瞬間に生きていたことを示す。
      接続の相手が拠点の外のアドレスなら、外との通信がその時点で
      続いていたことになる。

      プロセスの開始時刻は、そのプロセスがいつ起動したかを指す。
      サービスとして常駐しているものは、サーバの起動時刻に揃う。
      そこから外れているものは、後から起動したものである。

      この一覧は採取した瞬間の姿であり、電源を落とすか、
      サービスを止め直した時点で以後は取れなくなる。
    possibilities:
      - |-
        保守の作業のために開いた口が、そのまま開いている。
        その時間帯の作業予定と突き合わせて分かれる
      - |-
        外から入られた口が、いまも保たれている。
        その口を開いた側の記録の有無で分かれる
      - |-
        監視や連携のための常時接続が、そう見えている。
        接続先と使っている口の番号で分かれる
