  - id: ev_deploy_ledger
    points_to: [ws-eng01]
    misleading: false
    plausibility: high
    volatile: false
    occurred_at: "2026-04-09 11:05"
    summary: "ring-1 への配信は 11:05 に完了し、後続の窓が 13:50 と 16:20 に控えている"
    reading: |
      配信実績台帳である。段階配信では、対象をいくつかの区分（ring）に
      分け、前の区分の結果を見てから次の区分へ進む。

      status の読み方:
        completed  配信が終わり、対象の端末で導入まで終わっている
        scheduled  窓の時刻が決まっていて、まだ来ていない
        held       止められていて、窓が来ても走らない

      scheduled の行は予定であって実績ではない。その時刻が来たときに
      配信元が動いていれば走り、止まっていれば走らない。

      Targets は、その区分に属する端末の台数である。
      どの端末が属するかは、共通設定の区分の割当に書かれている。
    possibilities:
